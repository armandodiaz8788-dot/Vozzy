      const phoneticNorm = (w) =>
        w.replace(/v/g, "b").replace(/z/g, "s").replace(/ll/g, "y").replace(/s$/, "");
      if (phoneticNorm(s1) === phoneticNorm(s2)) return 82; // Yellow: understandable regional/phonetic cadence

      const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
      for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
      for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;
      for (let j = 1; j <= s2.length; j += 1) {
        for (let i = 1; i <= s1.length; i += 1) {
          const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
          track[j][i] = Math.min(
            track[j][i - 1] + 1,
            track[j - 1][i] + 1,
            track[j - 1][i - 1] + indicator
          );
        }
      }
      const distance = track[s2.length][s1.length];
      const maxLen = Math.max(s1.length, s2.length);
      return Math.round(((maxLen - distance) / maxLen) * 100);
    }

    // Score Target Drills with Green (>=85%), Yellow (65-84%), Red (<65%)
    function scorePronunciation(expected, spoken) {
      const expWords = (expected || "").trim().split(/\s+/).filter(Boolean);
      const spkWords = (spoken || "").trim().split(/\s+/).filter(Boolean);
      if (!spkWords.length) {
        return {
          score: 0,
          breakdown: expWords.map(w => ({ word: w, status: "red", sim: 0, note: "Not heard" }))
        };
      }

      let totalSim = 0;
      const breakdown = expWords.map((expW, idx) => {
        let bestSim = 0;
        let matchedSpk = "";
        spkWords.forEach((spkW, sIdx) => {
          const sim = wordSimilarity(expW, spkW);
          // slight position bonus so repeated words align naturally
          const posPenalty = Math.abs(idx - sIdx) > 3 ? 10 : 0;
          const adjSim = Math.max(0, sim - posPenalty);
          if (adjSim > bestSim) {
            bestSim = adjSim;
            matchedSpk = spkW;
          }
        });

        totalSim += bestSim;
        let status = "red";
        let note = matchedSpk ? `Heard "${matchedSpk}" — tap to hear native` : "Missed word — tap to hear";
        if (bestSim >= 85) {
          status = "green";
          note = "Crisp native pronunciation!";
        } else if (bestSim >= 65) {
          status = "yellow";
          note = `Close ("${matchedSpk}") — slight vowel/consonant slur`;
        }
        return { word: expW, status, sim: bestSim, note };
      });

      const score = Math.round(totalSim / expWords.length);
      return { score, breakdown };
    }

    // Built-in Spanish Grammar & Spanglish Rule Engine (Instant + Offline-Ready)
    const GRAMMAR_RULES = [
      { regex: /\byo gusto\b/gi, replacement: "me gusta", reason: "Use 'me gusta' (it pleases me) instead of 'yo gusto'." },
      { regex: /\btu gustas\b/gi, replacement: "te gusta", reason: "Use 'te gusta' to say 'you like'." },
      { regex: /\byo sabo\b/gi, replacement: "yo sé", reason: "'Saber' is irregular in the yo form: 'yo sé'." },
      { regex: /\byo pon[ií]\b/gi, replacement: "yo puse", reason: "'Poner' in the past tense is irregular: 'puse'." },
      { regex: /\byo ten[ií]\b/gi, replacement: "yo tuve", reason: "'Tener' in the past tense is 'tuve' or 'tenía'." },
      { regex: /\byo hac[ií]\b/gi, replacement: "yo hice", reason: "'Hacer' in the preterite past is 'hice'." },
      { regex: /\bla problema\b/gi, replacement: "el problema", reason: "'Problema' ends in -a but is masculine: 'el problema'." },
      { regex: /\bun problema buena\b/gi, replacement: "un buen problema", reason: "'Problema' is masculine." },
      { regex: /\bla dia\b|\bla día\b/gi, replacement: "el día", reason: "'Día' is masculine: 'el día'." },
      { regex: /\bel mano\b/gi, replacement: "la mano", reason: "'Mano' ends in -o but is feminine: 'la mano'." },
      { regex: /\bla agua\b/gi, replacement: "el agua", reason: "Use 'el agua' (singular) to avoid double 'a' sound." },
      { regex: /\bmas mejor\b|\bmás mejor\b/gi, replacement: "mejor", reason: "'Mejor' already means 'better' — don't add 'más'." },
      { regex: /\bmas peor\b|\bmás peor\b/gi, replacement: "peor", reason: "'Peor' already means 'worse' — don't add 'más'." },
      { regex: /\bun otro\b/gi, replacement: "otro", reason: "In Spanish, never put 'un' before 'otro' — just say 'otro'." },
      { regex: /\ouna otra\b/gi, replacement: "otra", reason: "In Spanish, just say 'otra' without 'una'." },
      { regex: /\bbuscando por\b/gi, replacement: "buscando", reason: "'Buscar' already means 'to look for' — drop 'por'." },
      { regex: /\besperando por\b/gi, replacement: "esperando", reason: "'Esperar' already means 'to wait for' — drop 'por'." },
      { regex: /\bpensar de\b/gi, replacement: "pensar en", reason: "Use 'pensar en' to mean 'think about'." },
      { regex: /\bsoñar de\b/gi, replacement: "soñar con", reason: "Use 'soñar con' to mean 'dream about'." },
      { regex: /\bestoy hambre\b|\bsoy hambre\b/gi, replacement: "tengo hambre", reason: "In Spanish you 'have hunger': 'tengo hambre'." },
      { regex: /\bestoy frio\b|\bestoy frío\b/gi, replacement: "tengo frío", reason: "For body temperature, use 'tengo frío'." },
      { regex: /\bestoy calor\b/gi, replacement: "tengo calor", reason: "For feeling hot, use 'tengo calor'." },
      { regex: /\bsoy (\d+) anos\b|\bsoy (\d+) años\b/gi, replacement: "tengo $1 años", reason: "Use 'tener' for age: 'tengo ... años'." },
      { regex: /\bmucho gente\b/gi, replacement: "mucha gente", reason: "'Gente' is feminine: 'mucha gente'." },
      { regex: /\bla gente son\b|\blas gentes son\b/gi, replacement: "la gente es", reason: "'La gente' is singular in Spanish: 'la gente es'." },
      { regex: /\blos casas\b/gi, replacement: "las casas", reason: "Feminine plural agreement: 'las casas'." },
      { regex: /\blas carros\b|\blas coches\b/gi, replacement: "los carros", reason: "Masculine plural agreement: 'los carros'." }
    ];

    // Grade each word in Free Speaking AI Mode (Green / Yellow / Red)
    function gradeFreeSpeechWords(transcript, rawConfidence, grammarMatches) {
      const words = (transcript || "").trim().split(/\s+/).filter(Boolean);
      const baseConf = rawConfidence && rawConfidence > 0 ? rawConfidence : 0.88;

      // Words flagged by grammar rules
      const yellowOrRedTokens = new Set();
      const redTokens = new Set(["sabo", "poni", "poní", "teni", "tení", "haci", "hací"]);

      (grammarMatches || []).forEach(m => {
        const wrongParts = (m.wrong || "").toLowerCase().split(/\s+/);
        wrongParts.forEach(p => yellowOrRedTokens.add(normalizeText(p)));
      });

      const englishBleedWords = new Set(["the", "and", "because", "with", "about", "what", "where", "fuck", "shit", "money", "friend"]);

      return words.map((w, idx) => {
        const norm = normalizeText(w);
        if (w.includes("*")) {
          return {
            word: w,
            status: "green",
            score: 94,
            reason: "Uncensored street slang recognized!"
          };
        }
        if (redTokens.has(norm) || englishBleedWords.has(norm)) {
          return {
            word: w,
            status: "red",
            score: 48,
            reason: englishBleedWords.has(norm)
              ? `"${w}" is English — use Spanish here!`
              : `"${w}" is a broken conjugation — see grammar fix below.`
          };
        }
        if (yellowOrRedTokens.has(norm)) {
          return {
            word: w,
            status: "yellow",
            score: 76,
            reason: `Pronounced clearly, but "${w}" needs a grammar tweak in this sentence.`
          };
        }
        // Acoustic confidence check
        const wordLenBonus = norm.length >= 4 ? 0.04 : 0;
        const effectiveConf = Math.min(0.99, baseConf + wordLenBonus);
        if (effectiveConf >= 0.82) {
          return {
            word: w,
            status: "green",
            score: Math.round(effectiveConf * 100),
            reason: "Crisp pronunciation & valid Spanish cadence!"
          };
        }
        if (effectiveConf >= 0.65) {
          return {
            word: w,
            status: "yellow",
            score: Math.round(effectiveConf * 100),
            reason: "Slight slur/accent detected — tap to hear native cadence."
          };
        }
        return {
          word: w,
          status: "red",
          score: Math.round(effectiveConf * 100),
          reason: "Unclear pronunciation — tap to hear native audio."
        };
      });
    }

    // Complete Live Grammar + Meaning + Dialect Coach Analyzer
    async function analyzeFreeSpeechAndCorrect(spokenEs, confidence, dialectCode) {
      const cleanSpoken = (spokenEs || "").trim();
      const d = DIALECTS[dialectCode] || DIALECTS["es-CU"];
      let workingCorrected = cleanSpoken;
      const explanations = [];

      // 1. Run local instant Spanish grammar & Spanglish rules
      GRAMMAR_RULES.forEach(rule => {
        const match = workingCorrected.match(rule.regex);
        if (match) {
          const wrongText = match[0];
          workingCorrected = workingCorrected.replace(rule.regex, rule.replacement);
          explanations.push({
            wrong: wrongText,
            right: rule.replacement,
            reason: rule.reason
          });
        }
      });

      // 2. Query Free LanguageTool Spanish Grammar API (no API key required)
      try {
        const params = new URLSearchParams();
        params.append("text", workingCorrected);
        params.append("language", "es");
        const ltRes = await fetch("https://api.languagetool.org/v2/check", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params.toString()
        });
        if (ltRes.ok) {
          const ltData = await ltRes.json();
          if (ltData && Array.isArray(ltData.matches)) {
            // Apply non-overlapping replacements from right to left
            const validMatches = ltData.matches.filter(m =>
              m.replacements &&
              m.replacements.length > 0 &&
              m.rule &&
              m.rule.issueType !== "typographical" &&
              m.rule.id !== "UPPERCASE_SENTENCE_START"
            );
            validMatches.slice(0, 3).forEach(m => {
              const wrongFrag = workingCorrected.substr(m.offset, m.length);
              const bestRep = m.replacements[0].value;
              if (normalizeText(wrongFrag) !== normalizeText(bestRep)) {
                explanations.push({
                  wrong: wrongFrag,
                  right: bestRep,
                  reason: m.message || "Spanish grammar / agreement fix"
                });
              }
            });
            // Apply replacements from end of string to start
            validMatches
              .sort((a, b) => b.offset - a.offset)
              .forEach(m => {
                const bestRep = m.replacements[0].value;
                workingCorrected =
                  workingCorrected.slice(0, m.offset) +
                  bestRep +
                  workingCorrected.slice(m.offset + m.length);
              });
          }
        }
      } catch (e) {
        // Offline or blocked — local grammar engine still works!
      }

      // 3. Get English Meaning via Google GTX
      let englishMeaning = "";
      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=${encodeURIComponent(workingCorrected)}`;
        const gtxRes = await fetch(gtxUrl);
        const gtxData = await gtxRes.json();
        if (gtxData && gtxData[0]) {
          englishMeaning = gtxData[0].map(seg => seg[0]).join("");
        }
      } catch (e) {
        englishMeaning = "Spoken Spanish phrase";
      }

      // Capitalize first letter cleanly
      if (workingCorrected.length > 0) {
        workingCorrected = workingCorrected.charAt(0).toUpperCase() + workingCorrected.slice(1);
      }

      const wordBreakdown = gradeFreeSpeechWords(cleanSpoken, confidence, explanations);
      const avgPronunciationScore = wordBreakdown.length
        ? Math.round(wordBreakdown.reduce((acc, w) => acc + w.score, 0) / wordBreakdown.length)
        : 0;

      // 4. Build Dialect-Native Street Upgrade
      const dialectUpgrades = {
        "es-CU": `Oye ${d.slangWord}, ${workingCorrected.charAt(0).toLowerCase() + workingCorrected.slice(1)}, ¿estás en talla?`,
        "es-MX": `Mira ${d.slangWord}, ${workingCorrected.charAt(0).toLowerCase() + workingCorrected.slice(1)}, la neta.`,
        "es-CO": `Mire ${d.slangWord}, ${workingCorrected.charAt(0).toLowerCase() + workingCorrected.slice(1)}, a lo bien.`,
        "es-ES": `Oye ${d.slangWord}, ${workingCorrected.charAt(0).toLowerCase() + workingCorrected.slice(1)}, ¿sabes?`,
        "es-AR": `Che ${d.slangWord}, ${workingCorrected.charAt(0).toLowerCase() + workingCorrected.slice(1)}, posta.`
      };

      // 5. Generate Dynamic Multi-Turn AI Tutor Reply
      const hasQuestion = cleanSpoken.includes("?") || /\b(que|como|donde|cuando|por que|quien|cual)\b/i.test(normalizeText(cleanSpoken));
      const tutorReplies = {
        "es-CU": {
          es: hasQuestion
            ? `¡Tremenda pregunta, asere! Sobre "${workingCorrected}", te digo que aquí en La Habana todo está en talla. ¿Y tú qué crees de eso?`
            : `¡Te escuché clarito, asere! "${workingCorrected}" suena con tremendo swing. Cuéntame más, ¿qué más tienes pensado hacer hoy?`,
          en: hasQuestion
            ? `Great question, bro! About "${englishMeaning}", here in Havana everything's cool. What do you think about it?`
            : `I heard you loud and clear, bro! "${englishMeaning}" sounds great. Tell me more, what else do you have planned today?`
        },
        "es-MX": {
          es: `¡Órale, carnal! Te entendí perfecto: "${workingCorrected}". Y dime, ¿qué otro plan traes en mente ahorita?`,
          en: `Awesome, bro! I understood you perfectly: "${englishMeaning}". Tell me, what other plan do you have in mind right now?`
        },
        "es-CO": {
          es: `¡Qué chimba escucharte, parcero! Dijiste: "${workingCorrected}". ¿Y qué más me cuenta pues?`,
          en: `So cool hearing you, bro! You said: "${englishMeaning}". What else can you tell me?`
        },
        "es-ES": {
          es: `¡De puta madre, tío! Te he entendido genial: "${workingCorrected}". ¿Qué más me cuentas de eso?`,
          en: `Awesome, man! I understood you great: "${englishMeaning}". What else can you tell me about that?`
        },
        "es-AR": {
          es: `¡Re bien, che! Se entendió clarito: "${workingCorrected}". Contame un poco más, ¿cómo sigue todo?`,
          en: `Super good, mate! Understood clearly: "${englishMeaning}". Tell me a bit more, how's everything going?`
        }
      };

      return {
        originalEs: cleanSpoken,
        correctedEs: workingCorrected,
        isGrammarPerfect: explanations.length === 0 && normalizeText(cleanSpoken) === normalizeText(workingCorrected),
        explanations,
        englishMeaning,
        wordBreakdown,
        avgPronunciationScore,
        dialectUpgrade: dialectUpgrades[dialectCode] || workingCorrected,
        aiReply: tutorReplies[dialectCode] || tutorReplies["es-CU"]
      };
    }

    function looksLikeSpanish(text) {
      const raw = (text || "").trim().toLowerCase();
      if (/[áéíóúñü¿¡]/.test(raw)) return true;
      const tokens = raw.split(/\s+/);
      const spanishMarkers = new Set([
        "el", "la", "los", "las", "un", "una", "yo", "tu", "usted", "que", "como", "donde",
        "cuando", "porque", "para", "por", "con", "sin", "hola", "gracias", "perro", "gato",
        "agua", "casa", "carro", "trabajo", "amigo", "dinero", "comida", "mierda", "puta",
        "puto", "carajo", "coño", "cono", "pinga", "singar", "singao", "comemierda", "chingar",
        "chingado", "chingon", "verga", "pendejo", "cabron", "culero", "pinche", "gonorrea",
        "malparido", "hijueputa", "jueputa", "marica", "pirobo", "joder", "hostia", "gilipollas",
        "capullo", "cojones", "polla", "boludo", "pelotudo", "concha", "quilombo", "forro",
        "cagar", "asere", "parcero", "parce", "chido", "chimba", "bacano", "tio", "guita"
      ]);
      if (tokens.some(t => spanishMarkers.has(normalizeText(t)))) return true;
      if (tokens.length === 1) {
        const w = normalizeText(tokens[0]);
        if (/(cion|siones|miento|dad|dades|ito|ita|ando|iendo|arse|erse|irse)$/.test(w)) return true;
      }
      return false;
    }

    function buildDynamicDialectBreakdown(esText, enText) {
      const cleanEs = esText.split("/")[0].trim();
      const cleanEn = enText.split("/")[0].trim();
      return {
        "es-CU": { term: `${cleanEs} (a lo cubano)`, exEs: `Oye asere, "${cleanEs}" está en talla, no cojas lucha.`, exEn: `Hey bro, "${cleanEn}" is all good, don't stress.` },
        "es-MX": { term: `${cleanEs} (en México)`, exEs: `No mames carnal, lo de "${cleanEs}" está bien chingón.`, exEn: `No way bro, "${cleanEn}" is super badass.` },
        "es-CO": { term: `${cleanEs} (en Colombia)`, exEs: `Quiubo parcero, "${cleanEs}" es una chimba total.`, exEn: `What's up bro, "${cleanEn}" is totally awesome.` },
        "es-ES": { term: `${cleanEs} (en España)`, exEs: `Joder tío, lo de "${cleanEs}" está de puta madre.`, exEn: `Damn man, "${cleanEn}" is fucking awesome.` },
        "es-AR": { term: `${cleanEs} (en Argentina)`, exEs: `Che boludo, "${cleanEs}" está re copado mal.`, exEn: `Hey dude, "${cleanEn}" is super cool.` }
      };
    }

    async function autoTranslateWordOrPhrase(rawInput, forcedSourceLang = null) {
      const cleanInput = rawInput.trim();
      const normInput = normalizeText(cleanInput);

      if (!forcedSourceLang) {
        for (const item of MULTI_DIALECT_LEXICON) {
          if (item.keysEn.map(normalizeText).includes(normInput)) {
            return { sourceLang: "en", targetLang: "es", isCurse: item.isCurse, es: item.es, en: item.en, exEs: item.exEs, exEn: item.exEn, byDialect: item.byDialect };
          }
          if (item.keysEs.map(normalizeText).includes(normInput)) {
            return { sourceLang: "es", targetLang: "en", isCurse: item.isCurse, es: item.es, en: item.en, exEs: item.exEs, exEn: item.exEn, byDialect: item.byDialect };
          }
        }
      }

      try {
        let sourceLang = forcedSourceLang;
        if (!sourceLang) {
          const probeUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q=${encodeURIComponent(cleanInput)}`;
          const probeRes = await fetch(probeUrl);
          const probeData = await probeRes.json();
          const detectedCode = (probeData && probeData[2]) ? String(probeData[2]).toLowerCase() : "en";
          const esCandidate = (probeData && probeData[0]) ? probeData[0].map(seg => seg[0]).join("") : "";

          if (detectedCode.startsWith("es") || looksLikeSpanish(cleanInput) || normalizeText(esCandidate) === normInput) {
            sourceLang = "es";
          } else {
            return {
              sourceLang: "en",
              targetLang: "es",
              isCurse: false,
              es: esCandidate,
              en: cleanInput,
              byDialect: buildDynamicDialectBreakdown(esCandidate, cleanInput)
            };
          }
        }

        const targetLang = sourceLang === "es" ? "en" : "es";
        const transUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(cleanInput)}`;
        const transRes = await fetch(transUrl);
        const transData = await transRes.json();
        let translatedText = (transData && transData[0]) ? transData[0].map(seg => seg[0]).join("") : cleanInput;

        if (normalizeText(translatedText) === normInput) {
          const mmRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanInput)}&langpair=${sourceLang}|${targetLang}`);
          const mmData = await mmRes.json();
          if (mmData && mmData.responseData && mmData.responseData.translatedText) {
            translatedText = mmData.responseData.translatedText;
          }
        }

        const finalEs = sourceLang === "es" ? cleanInput : translatedText;
        const finalEn = sourceLang === "en" ? cleanInput : translatedText;

        return {
          sourceLang,
          targetLang,
          isCurse: false,
          es: finalEs,
          en: finalEn,
          byDialect: buildDynamicDialectBreakdown(finalEs, finalEn)
        };
      } catch (err) {
        const sourceLang = forcedSourceLang || (looksLikeSpanish(cleanInput) ? "es" : "en");
        return {
          sourceLang,
          targetLang: sourceLang === "es" ? "en" : "es",
          isCurse: false,
          es: cleanInput,
          en: `${cleanInput} (Offline)`,
          byDialect: buildDynamicDialectBreakdown(cleanInput, cleanInput)
        };
      }
    }

      const [liveInterimText, setLiveInterimText] = useState("");
      const [spokenText, setSpokenText] = useState("");
      const [evalResult, setEvalResult] = useState(null);
      const [selectedWordNote, setSelectedWordNote] = useState(null);
      const [toast, setToast] = useState("");

      // Free Speaking AI State
      const [freeAiAnalyzing, setFreeAiAnalyzing] = useState(false);
      const [freeAiInput, setFreeAiInput] = useState("");
      const [selectedFreeWord, setSelectedFreeWord] = useState(null);
      const [freeSessionTurns, setFreeSessionTurns] = useState(() => [
        {
          id: "welcome",
          role: "ai",
          es: DIALECTS["es-CU"].greeting,
          en: "What's up, bro! Talk to me about whatever you want. I'll listen in real time and grade your pronunciation (Green/Yellow/Red) and fix your grammar on the spot."
        }
      ]);

      // SRS State
      const [cardIdx, setCardIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [cardEval, setCardEval] = useState(null);
      const [srsFilterDue, setSrsFilterDue] = useState(false);

      // Translator State
      const [searchQuery, setSearchQuery] = useState("");
      const [isTranslating, setIsTranslating] = useState(false);
      const [dictResult, setDictResult] = useState(null);
      const [activeContextIdx, setActiveContextIdx] = useState(0);
      const [slangFilter, setSlangFilter] = useState("ALL");
      const [vaultTypeFilter, setVaultTypeFilter] = useState("ALL");

      const chatBottomRef = useRef(null);

      useEffect(() => {
        localStorage.setItem("vozzy_stats_v4", JSON.stringify(stats));
      }, [stats]);

      useEffect(() => {
        localStorage.setItem("vozzy_drills_v4", JSON.stringify(drills));
      }, [drills]);

      useEffect(() => {
        localStorage.setItem("vozzy_cards_v4", JSON.stringify(cards));
      }, [cards]);

      useEffect(() => {
        localStorage.setItem("vozzy_dict_history_v4", JSON.stringify(savedWords));
      }, [savedWords]);

      useEffect(() => {
        const loadVoices = () => {
          if ("speechSynthesis" in window) {
            const available = window.speechSynthesis.getVoices();
            if (available.length) setVoices(available);
          }
        };
        loadVoices();
        if ("speechSynthesis" in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener("online", handleOnline);
        window.addEventListener("offline", handleOffline);
        return () => {
          window.removeEventListener("online", handleOnline);
          window.removeEventListener("offline", handleOffline);
        };
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3200);
      };

      const awardXp = (amount, label) => {
        const today = new Date().toISOString().slice(0, 10);
        setStats(prev => {
          const isNewDay = prev.lastDate !== today;
          const newStreak = isNewDay ? prev.streak + 1 : prev.streak;
          return {
            xp: prev.xp + amount,
            dailyXp: (isNewDay ? 0 : prev.dailyXp) + amount,
            streak: newStreak,
            lastDate: today
          };
        });
        showToast(`⚡ +${amount} XP! ${label || ""}`);
      };

      const speakSpanish = (text, targetLangCode = null) => {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const langToUse = targetLangCode || dialect;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = langToUse;
        u.rate = slowSpeed ? 0.75 : 1.0;

        const exactVoice = voices.find(v => v.lang.replace("_", "-").toLowerCase() === langToUse.toLowerCase());
        const localSpanish = voices.find(v => v.lang.toLowerCase().startsWith("es") && v.localService);
        const anySpanish = voices.find(v => v.lang.toLowerCase().startsWith("es"));
        if (exactVoice) u.voice = exactVoice;
        else if (localSpanish) u.voice = localSpanish;
        else if (anySpanish) u.voice = anySpanish;

        window.speechSynthesis.speak(u);
      };

      // Real-Time Streaming Voice Listener (Shows live interim words as you speak!)
      const listenVoiceRealtime = (onFinalTranscript) => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert("Speech recognition requires Chrome, Samsung Internet, Edge, or Safari.");
          return;
        }
        const rec = new SpeechRec();
        rec.lang = dialect;
        rec.interimResults = true;
        rec.maxAlternatives = 1;

        setIsRecording(true);
        setLiveInterimText("");

        let finalTranscript = "";
        let finalConfidence = 0.88;

        rec.onresult = (e) => {
          let interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const seg = e.results[i][0].transcript;
            if (e.results[i].isFinal) {
              finalTranscript += seg + " ";
              if (e.results[i][0].confidence) {
                finalConfidence = e.results[i][0].confidence;
              }
            } else {
              interim += seg;
            }
          }
          setLiveInterimText((finalTranscript + interim).trim());
        };

        rec.onerror = () => {
          setIsRecording(false);
        };

        rec.onend = () => {
          setIsRecording(false);
          const completedText = (finalTranscript || liveInterimText).trim();
          setLiveInterimText("");
          if (completedText) {
            onFinalTranscript(completedText, finalConfidence);
          }
        };

        rec.start();
      };

      const currentDrill = drills[activeDrillIdx] || drills[0];
      const currentVar = currentDrill.variations[varIdx] || currentDrill.variations[0];

      const handleDrillMic = () => {
        setSelectedWordNote(null);
        listenVoiceRealtime((transcript) => {
          setSpokenText(transcript);
          const res = scorePronunciation(currentVar.es, transcript);
          setEvalResult(res);
          if (res.score >= 90) {
            speakSpanish("¡Excelente!");
            awardXp(25, "Passed 90% Pronunciation Gate!");
          }
        });
      };

      const advanceDrill = () => {
        setEvalResult(null);
        setSpokenText("");
        setSelectedWordNote(null);
        if (stage < 3) {
          setStage(stage + 1);
        } else {
          setStage(1);
          if (varIdx + 1 < currentDrill.variations.length) {
            setVarIdx(varIdx + 1);
          } else {
            setVarIdx(0);
            awardXp(50, "Unit Mastered Bonus!");
          }
        }
      };

      // Handle Free Speaking AI Turn (Voice or Typed)
      const processFreeSpeechTurn = async (rawSpokenText, confidenceScore = 0.9) => {
        const text = (rawSpokenText || "").trim();
        if (!text) return;
        setFreeAiAnalyzing(true);
        setSelectedFreeWord(null);

        const analysis = await analyzeFreeSpeechAndCorrect(text, confidenceScore, dialect);

        const userTurn = {
          id: "u_" + Date.now(),
          role: "user",
          analysis
        };
        const aiTurn = {
          id: "ai_" + (Date.now() + 1),
          role: "ai",
          es: analysis.aiReply.es,
          en: analysis.aiReply.en
        };

        setFreeSessionTurns(prev => [...prev, userTurn, aiTurn]);
        setFreeAiInput("");
        setFreeAiAnalyzing(false);

        speakSpanish(analysis.aiReply.es, dialect);
        awardXp(20, analysis.isGrammarPerfect ? "Clean Grammar & Speech!" : "Speech Graded & Corrected!");
      };

      const now = Date.now();
      const dueCards = cards.filter(c => (c.nextReview || 0) <= now);
      const activeDeck = srsFilterDue && dueCards.length > 0 ? dueCards : cards;
      const currentCard = activeDeck[cardIdx % activeDeck.length] || cards[0];

      const rateCardSRS = (cardId, difficulty) => {
        setCards(prev =>
          prev.map(c => {
            if (c.id !== cardId) return c;
            let newBox = c.box || 1;
            if (difficulty === "hard") newBox = 1;
            else if (difficulty === "good") newBox = Math.min(5, newBox + 1);
            else if (difficulty === "easy") newBox = Math.min(5, newBox + 2);
            const interval = SRS_INTERVALS[newBox] || 0;
            return { ...c, box: newBox, nextReview: Date.now() + interval, reps: (c.reps || 0) + 1 };
          })
        );
        awardXp(difficulty === "easy" ? 20 : 15, "SRS Box Updated!");
        setFlipped(false);
        setCardEval(null);
        setCardIdx((prev) => (prev + 1) % Math.max(1, activeDeck.length));
      };

      const runTranslation = async (rawQuery, forcedSourceLang = null) => {
        const cleanQ = rawQuery.trim();
        if (!cleanQ) return;
        setIsTranslating(true);
        setActiveContextIdx(0);

        const translated = await autoTranslateWordOrPhrase(cleanQ, forcedSourceLang);
        const contexts = generateContextualExamples(translated.es, translated.en, dialect);

        const resultObj = {
          query: cleanQ,
          sourceLang: translated.sourceLang,
          targetLang: translated.targetLang,
          isCurse: translated.isCurse,
          es: translated.es,
          en: translated.en,
          exEs: translated.exEs || contexts[0].es,
          exEn: translated.exEn || contexts[0].en,
          contexts,
          byDialect: translated.byDialect || buildDynamicDialectBreakdown(translated.es, translated.en)
        };

        setDictResult(resultObj);
        setIsTranslating(false);

        setSavedWords(prev => {
          const filtered = prev.filter(item => normalizeText(item.query) !== normalizeText(resultObj.query));
          return [resultObj, ...filtered].slice(0, 30);
        });

        awardXp(10, translated.sourceLang === "es" ? "Translated ES → EN!" : "Translated EN → ES!");
      };

      const handleSearch = (e) => {
        e.preventDefault();
        runTranslation(searchQuery, null);
      };

      const flipTranslationDirection = () => {
        if (!dictResult) return;
        const nextSource = dictResult.sourceLang === "es" ? "en" : "es";
        runTranslation(dictResult.query, nextSource);
      };

      const addWordToFlashcards = (esText, enText, exEs, exEn, tag = "📖 Coach") => {
        const newCard = {
          id: "c_" + Date.now(),
          es: esText,
          en: enText,
          exEs: exEs || `Ejemplo con ${esText}.`,
          exEn: exEn || `Example with ${enText}.`,
          tag,
          box: 1,
          nextReview: 0,
          reps: 0
        };
        setCards([newCard, ...cards]);
        awardXp(15, "Saved to SRS Flashcards!");
      };

      const addWordToDrills = (esText, enText, exEs, exEn) => {
        const cleanPhrase = esText.split("/")[0].replace(/\(.*?\)/g, "").trim();
        const targetSentence = exEs || cleanPhrase;
        const words = targetSentence.split(" ");
        const clozeSentence = words.map((w, i) => (i % 2 === 1 ? "___" : w)).join(" ");
        const newDrill = {
          id: "d_" + Date.now(),
          title: `Drill: ${cleanPhrase.slice(0, 22)}`,
          pattern: cleanPhrase,
          variations: [
            { en: enText || "Say this in Spanish", es: cleanPhrase, cloze: "___" },
            { en: exEn || `Practice: ${enText}`, es: targetSentence, cloze: clozeSentence }
          ]
        };
        setDrills([newDrill, ...drills]);
        setActiveDrillIdx(0);
        setVarIdx(0);
        setStage(1);
        awardXp(15, "Added to Speaking Drills!");
      };

      const levelInfo = getLevelTitle(stats.xp);
      const dailyProgressPct = Math.min(100, Math.round((stats.dailyXp / 100) * 100));

      const getPillColorClasses = (status) => {
        if (status === "green") return "bg-emerald-950/90 text-emerald-300 border-emerald-500/80";
        if (status === "yellow") return "bg-amber-950/90 text-amber-300 border-amber-500/80";
        return "bg-rose-950/90 text-rose-300 border-rose-500/80";
      };

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 pb-24 max-w-md mx-auto px-3.5 pt-3 select-none">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-4 py-2 rounded-full shadow-xl text-xs font-extrabold flex items-center gap-2 animate-bounce">
              {toast}
            </div>
          )}

          {/* Header + Gamification Bar */}
          <div className="bg-slate-900/95 border border-slate-800 rounded-2xl p-3 mb-3 space-y-2.5 shadow-lg">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-xl shadow-lg shadow-purple-600/30">
                  🎙️
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-extrabold text-base tracking-tight">Vozzy</span>
                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
                      🔥 {stats.streak}d
                    </span>
                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-purple-950 text-purple-300 border border-purple-700/50">
                      Lvl {levelInfo.lvl} • {levelInfo.title}
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 mt-0.5">
                    Tutor: {DIALECTS[dialect].tutor} • 🟢🟡🔴 Live Voice AI
                  </p>
                </div>
              </div>

              <div className="flex flex-col items-end gap-1">
                <select
                  value={dialect}
                  onChange={(e) => {
                    const newD = e.target.value;
                    setDialect(newD);
                    if (dictResult) {
                      setDictResult({
                        ...dictResult,
                        contexts: generateContextualExamples(dictResult.es, dictResult.en, newD)
                      });
                    }
                  }}
                  className="bg-slate-800 text-[11px] font-bold rounded-xl px-2 py-1.5 border border-slate-700 text-slate-200 outline-none"
                >
                  {Object.entries(DIALECTS).map(([code, d]) => (
                    <option key={code} value={code}>
                      {d.flag} {d.name}
                    </option>
                  ))}
                </select>
                <button
                  onClick={() => setSlowSpeed(!slowSpeed)}
                  className={`text-[10px] font-bold px-2 py-1 rounded-lg border ${
                    slowSpeed ? "bg-amber-500/20 border-amber-500 text-amber-300" : "bg-slate-800 border-slate-700 text-slate-400"
                  }`}
                >
                  {slowSpeed ? "🐢 0.75x Audio" : "⚡ 1.0x Audio"}
                </button>
              </div>
            </div>

            {/* Daily XP Goal Bar */}
            <div className="bg-slate-950 rounded-xl p-2 border border-slate-800/80">
              <div className="flex justify-between text-[11px] font-bold mb-1">
                <span className="text-slate-300">🎯 Daily Goal: {stats.dailyXp} / 100 XP</span>
                <span className="text-purple-400">Total: {stats.xp} XP</span>
              </div>
              <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                <div
                  className="h-full bg-gradient-to-r from-purple-500 to-emerald-400 transition-all duration-300"
                  style={{ width: `${dailyProgressPct}%` }}
                />
              </div>
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="grid grid-cols-4 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 mb-3 text-xs font-bold">
            <button
              onClick={() => setActiveTab("drills")}
              className={`py-2.5 rounded-xl transition ${activeTab === "drills" ? "bg-purple-600 text-white shadow" : "text-slate-400"}`}
            >
              1. Drills
            </button>
            <button
              onClick={() => setActiveTab("freeai")}
              className={`py-2.5 rounded-xl transition ${activeTab === "freeai" ? "bg-purple-600 text-white shadow" : "text-slate-400"}`}
            >
              2. Free AI 🎙️
            </button>
            <button
              onClick={() => setActiveTab("cards")}
              className={`py-2.5 rounded-xl transition ${activeTab === "cards" ? "bg-purple-600 text-white shadow" : "text-slate-400"}`}
            >
              3. SRS ({dueCards.length})
            </button>
            <button
              onClick={() => setActiveTab("dict")}
              className={`py-2.5 rounded-xl transition ${activeTab === "dict" ? "bg-purple-600 text-white shadow" : "text-slate-400"}`}
            >
              4. Translator
            </button>
          </div>

          {/* TAB 1: SPEAKING DRILLS WITH REAL-TIME STREAMING & GREEN/YELLOW/RED GRADING */}
          {activeTab === "drills" && (
            <div className="space-y-4">
              <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                {drills.map((d, idx) => (
                  <button
                    key={d.id}
                    onClick={() => { setActiveDrillIdx(idx); setVarIdx(0); setStage(1); setEvalResult(null); }}
                    className={`whitespace-nowrap px-3 py-1.5 rounded-xl text-xs font-bold border ${
                      activeDrillIdx === idx ? "bg-purple-600/20 border-purple-500 text-purple-200" : "bg-slate-900 border-slate-800 text-slate-400"
                    }`}
                  >
                    {idx + 1}. {d.title}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-3 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-xs font-bold">
                {[
                  { id: 1, label: "Stage 1: Guided" },
                  { id: 2, label: "Stage 2: Cloze" },
                  { id: 3, label: "Stage 3: Blind" }
                ].map((s) => (
                  <button
                    key={s.id}
                    onClick={() => { setStage(s.id); setEvalResult(null); }}
                    className={`py-2 rounded-xl ${stage === s.id ? "bg-purple-600 text-white" : "text-slate-400"}`}
                  >
                    {s.label}
                  </button>
                ))}
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
                <p className="text-[11px] uppercase tracking-wider text-purple-400 font-bold">
                  Variation {varIdx + 1} of {currentDrill.variations.length} • 🟢🟡🔴 Live Grader
                </p>
                <h2 className="text-xl font-extrabold text-white">"{currentVar.en}"</h2>

                <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-4 my-2">
                  {stage === 1 && (
                    <div>
                      <p className="text-lg font-bold text-emerald-400">{currentVar.es}</p>
                      <p className="text-xs text-slate-400 mt-1">Speak out loud — words grade in Green, Yellow, or Red</p>
                    </div>
                  )}
                  {stage === 2 && (
                    <div>
                      <p className="text-lg font-bold text-amber-300">{currentVar.cloze}</p>
                      <p className="text-xs text-slate-400 mt-1">Fill in the missing blanks from memory!</p>
                    </div>
                  )}
                  {stage === 3 && (
                    <div>
                      <p className="text-sm font-bold text-amber-400">🙈 BLIND REFLEX MODE</p>
                      <p className="text-xs text-slate-400 mt-1">Spanish text hidden. Speak 100% from memory!</p>
                    </div>
                  )}
                </div>

                {/* Real-Time Live Interim Stream Box */}
                {isRecording && (
                  <div className="bg-purple-950/40 border border-purple-500/60 rounded-2xl p-3 text-left animate-pulse">
                    <span className="text-[10px] font-extrabold uppercase text-purple-300 block mb-1">
                      🎙️ Live Real-Time Stream:
                    </span>
                    <p className="text-sm font-extrabold text-white">
                      {liveInterimText || "Speak now..."}
                    </p>
                  </div>
                )}

                <div className="flex justify-center gap-3 pt-1">
                  <button
                    onClick={() => speakSpanish(currentVar.es)}
                    className="px-4 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-sm font-bold flex items-center gap-2"
                  >
                    🔊 Hear Native
                  </button>
                  <button
                    onClick={handleDrillMic}
                    className={`px-6 py-3 rounded-2xl text-sm font-extrabold flex items-center gap-2 shadow-lg ${
                      isRecording ? "bg-rose-600 animate-pulse text-white" : "bg-purple-600 hover:bg-purple-500 text-white"
                    }`}
                  >
                    🎤 {isRecording ? "Listening Live..." : "Tap & Speak"}
                  </button>
                </div>

                {evalResult && (
                  <div className="mt-4 pt-4 border-t border-slate-800 text-left space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-slate-400">Heard: "{spokenText}"</span>
                      <span className={`text-xs font-extrabold px-2.5 py-1 rounded-full ${
                        evalResult.score >= 85
                          ? "bg-emerald-500/20 text-emerald-300"
                          : evalResult.score >= 65
                          ? "bg-amber-500/20 text-amber-300"
                          : "bg-rose-500/20 text-rose-300"
                      }`}>
                        {evalResult.score}% Score
                      </span>
                    </div>

                    <p className="text-[11px] text-slate-400">
                      Tap any word pill to hear its isolated native pronunciation:
                    </p>

                    <div className="flex flex-wrap gap-1.5">
                      {evalResult.breakdown.map((b, i) => (
                        <button
                          key={i}
                          onClick={() => {
                            speakSpanish(b.word);
                            setSelectedWordNote(b);
                          }}
                          className={`px-2.5 py-1.5 rounded-xl text-xs font-extrabold border ${getPillColorClasses(b.status)}`}
                        >
                          {b.status === "green" ? "🟢" : b.status === "yellow" ? "🟡" : "🔴"} {b.word} ({b.sim}%)
                        </button>
                      ))}
                    </div>

                    {selectedWordNote && (
                      <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-300">
                        <b>"{selectedWordNote.word}":</b> {selectedWordNote.note}
                      </div>
                    )}

                    {evalResult.score >= 85 ? (
                      <button
                        onClick={advanceDrill}
                        className="w-full py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-sm"
                      >
                        ✅ Passed Pronunciation Gate! Continue →
                      </button>
                    ) : (
                      <p className="text-xs text-amber-300 font-semibold">
                        Tap any 🟡 Yellow or 🔴 Red word to hear it, then tap "Tap & Speak" again!
                      </p>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 2: FREE SPEAKING AI (REAL-TIME STREAMING + GREEN/YELLOW/RED PRONUNCIATION + GRAMMAR COACH) */}
          {activeTab === "freeai" && (
            <div className="space-y-3">
              {/* Legend Banner */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex items-center justify-between text-[11px]">
                <div className="flex items-center gap-2 font-bold">
                  <span className="text-emerald-400">🟢 Crisp</span>
                  <span className="text-amber-300">🟡 Slur/Tweak</span>
                  <span className="text-rose-400">🔴 Fix</span>
                </div>
                <span className="text-slate-400 font-semibold">Auto Grammar + Dialect Coach</span>
              </div>

              {/* Conversation & Real-Time Feedback Feed */}
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-3.5 flex flex-col h-[62vh]">
                <div className="flex-1 overflow-y-auto space-y-3.5 pr-1">
                  {freeSessionTurns.map((turn) => {
                    if (turn.role === "ai") {
                      return (
                        <div key={turn.id} className="flex justify-start">
                          <div
                            onClick={() => speakSpanish(turn.es, dialect)}
                            className="max-w-[88%] bg-slate-800/90 border border-slate-700 rounded-2xl p-3.5 cursor-pointer space-y-1"
                          >
                            <div className="flex items-center justify-between">
                              <span className="text-[10px] font-extrabold text-purple-300 uppercase">
                                {DIALECTS[dialect].flag} {DIALECTS[dialect].tutor} (Tap to Hear 🔊)

                  ).map((item) => (
                    <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-1.5">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            item.category === "curse" ? "bg-rose-950 text-rose-300 border border-rose-700/50" : "bg-slate-800 text-amber-300"
                          }`}>
                            {item.badge}
                          </span>
                          <h4 className="font-extrabold text-base text-white mt-1">{item.phrase}</h4>
                        </div>
                        <button
                          onClick={() => speakSpanish(item.exEs, item.dialect)}
                          className="px-2.5 py-1.5 bg-slate-800 rounded-xl text-xs font-bold"
                        >
                          🔊 Audio
                        </button>
                      </div>
                      <p className="text-xs text-slate-400"><b>Literal:</b> "{item.literal}" • <b>Meaning:</b> {item.meaning}</p>
                      <p className="text-xs text-emerald-300 font-semibold">"{item.exEs}"</p>
                      <p className="text-xs text-slate-500">"{item.exEn}"</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
