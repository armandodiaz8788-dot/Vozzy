    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim();
    }

    // Heuristic detector for Spanish vs English (including Spanish profanity & slang)
    function looksLikeSpanish(text) {
      const raw = (text || "").trim().toLowerCase();
      if (/[áéíóúñü¿¡]/.test(raw)) return true;
      const tokens = raw.split(/\s+/);
      const spanishMarkers = new Set([
        "el", "la", "los", "las", "un", "una", "yo", "tu", "usted", "que", "como", "donde",
        "cuando", "porque", "para", "por", "con", "sin", "hola", "gracias", "perro", "gato",
        "agua", "casa", "carro", "trabajo", "amigo", "dinero", "comida", "mierda", "puta",
        "puto", "carajo", "coño", "cono", "pinga", "singar", "singao", "comemierda", "chingar",
        "chingado", "chingon", "verga", "pendejo", "cabron", "culero", "pinche", "gonorrea",
        "malparido", "hijueputa", "jueputa", "marica", "pirobo", "joder", "hostia", "gilipollas",
        "capullo", "cojones", "polla", "boludo", "pelotudo", "concha", "quilombo", "forro",
        "cagar", "asere", "parcero", "parce", "chido", "chimba", "bacano", "tio", "guita"
      ]);
      if (tokens.some(t => spanishMarkers.has(normalizeText(t)))) return true;
      if (tokens.length === 1) {
        const w = normalizeText(tokens[0]);
        if (/(cion|siones|miento|dad|dades|ito|ita|ando|iendo|arse|erse|irse)$/.test(w)) return true;
      }
      return false;
    }

    // Live Auto-Detect Translator (Supports All Dialects + Uncensored Profanity)
    async function autoTranslateWordOrPhrase(rawInput, forcedSourceLang = null) {
      const cleanInput = rawInput.trim();
      const normInput = normalizeText(cleanInput);

      // 1. Check Uncensored Multi-Dialect Lexicon first
      if (!forcedSourceLang) {
        for (const item of MULTI_DIALECT_LEXICON) {
          if (item.keysEn.map(normalizeText).includes(normInput)) {
            return {
              sourceLang: "en",
              targetLang: "es",
              isCurse: item.isCurse,
              es: item.es,
              en: item.en,
              exEs: item.exEs,
              exEn: item.exEn,
              byDialect: item.byDialect
            };
          }
          if (item.keysEs.map(normalizeText).includes(normInput)) {
            return {
              sourceLang: "es",
              targetLang: "en",
              isCurse: item.isCurse,
              es: item.es,
              en: item.en,
              exEs: item.exEs,
              exEn: item.exEn,
              byDialect: item.byDialect
            };
          }
        }
      }

      // 2. Live API Translation (Google GTX + MyMemory Backup)
      try {
        let sourceLang = forcedSourceLang;

        if (!sourceLang) {
          const probeUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q=${encodeURIComponent(cleanInput)}`;
          const probeRes = await fetch(probeUrl);
          const probeData = await probeRes.json();
          const detectedCode = (probeData && probeData[2]) ? String(probeData[2]).toLowerCase() : "en";
          const esCandidate = (probeData && probeData[0]) ? probeData[0].map(seg => seg[0]).join("") : "";

          if (
            detectedCode.startsWith("es") ||
            looksLikeSpanish(cleanInput) ||
            normalizeText(esCandidate) === normInput
          ) {
            sourceLang = "es";
          } else {
            sourceLang = "en";
            return {
              sourceLang: "en",
              targetLang: "es",
              isCurse: false,
              es: esCandidate,
              en: cleanInput,
              byDialect: buildDynamicDialectBreakdown(esCandidate, cleanInput)
            };
          }
        }

        const targetLang = sourceLang === "es" ? "en" : "es";
        const transUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(cleanInput)}`;
        const transRes = await fetch(transUrl);
        const transData = await transRes.json();
        let translatedText = (transData && transData[0]) ? transData[0].map(seg => seg[0]).join("") : cleanInput;

        if (normalizeText(translatedText) === normInput) {
          const mmRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanInput)}&langpair=${sourceLang}|${targetLang}`);
          const mmData = await mmRes.json();
          if (mmData && mmData.responseData && mmData.responseData.translatedText) {
            translatedText = mmData.responseData.translatedText;
          }
        }

        const finalEs = sourceLang === "es" ? cleanInput : translatedText;
        const finalEn = sourceLang === "en" ? cleanInput : translatedText;

        return {
          sourceLang,
          targetLang,
          isCurse: false,
          es: finalEs,
          en: finalEn,
          byDialect: buildDynamicDialectBreakdown(finalEs, finalEn)
        };
      } catch (err) {
        const sourceLang = forcedSourceLang || (looksLikeSpanish(cleanInput) ? "es" : "en");
        return {
          sourceLang,
          targetLang: sourceLang === "es" ? "en" : "es",
          isCurse: false,
          es: cleanInput,
          en: `${cleanInput} (Offline)`,
          byDialect: buildDynamicDialectBreakdown(cleanInput, cleanInput)
        };
      }
    }

    // Smart Pronunciation Grader with Anti-Asterisk De-Masking (so Android mic censoring p**** still passes!)
    function scorePronunciation(expected, spoken) {
      const expWords = normalizeText(expected).split(/\s+/).filter(Boolean);
      const spkWords = (spoken || "").toLowerCase().trim().split(/\s+/).filter(Boolean);
      if (!spkWords.length) return { score: 0, breakdown: expWords.map(w => ({ word: w, ok: false })) };

      let matches = 0;
      const breakdown = expWords.map(w => {
        const foundExact = spkWords.some(sw => normalizeText(sw) === w);
        // Check if browser speech-to-text censored a curse word with asterisks (e.g. "p****" or "m*****")
        const foundCensored = spkWords.some(sw => {
          if (!sw.includes("*")) return false;
          const cleanFirst = normalizeText(sw[0] || "");
          return cleanFirst && w.startsWith(cleanFirst) && Math.abs(sw.length - w.length) <= 2;
        });
        const ok = foundExact || foundCensored;
        if (ok) matches++;
        return { word: w, ok };
      });
      const score = Math.round((matches / expWords.length) * 100);
      return { score, breakdown };
    }

      if (xp < 1000) return { lvl: 4, title: "Candela" };
      return { lvl: 5, title: "Maestro" };
    }

                        </div>
                        <p className="text-base font-extrabold text-white">{dictResult.byDialect[dialect].term}</p>
                        <p className="text-xs font-semibold text-emerald-300">"{dictResult.byDialect[dialect].exEs}"</p>
                        <p className="text-[11px] text-slate-400">"{dictResult.byDialect[dialect].exEn}"</p>
                      </div>
                    )}

                    <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5">
                      <span className="text-[10px] uppercase font-extrabold text-blue-400 block">
                        🇺🇸 English Meaning
                      </span>
                      <h4 className="text-lg font-bold text-slate-200 mt-0.5">{dictResult.en}</h4>
                    </div>
                  </div>

                  {/* 1-Tap Add to Drills & SRS Cards */}
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => {
                        const dEntry = dictResult.byDialect && dictResult.byDialect[dialect];
                        addWordToDrills(
                          dEntry ? dEntry.term : dictResult.es,
                          dictResult.en,
                          dEntry ? dEntry.exEs : dictResult.exEs,
                          dEntry ? dEntry.exEn : dictResult.exEn
                        );
                      }}
                      className="py-2.5 px-3 rounded-xl bg-purple-600/20 border border-purple-500 text-purple-200 text-xs font-bold"
                    >
                      + Add to Drills
                    </button>
                    <button
                      onClick={() => {
                        const dEntry = dictResult.byDialect && dictResult.byDialect[dialect];
                        addWordToFlashcards(
                          dEntry ? dEntry.term : dictResult.es,
                          dictResult.en,
                          dEntry ? dEntry.exEs : dictResult.exEs,
                          dEntry ? dEntry.exEn : dictResult.exEn,
                          `${DIALECTS[dialect].flag} ${dictResult.isCurse ? "18+ Curse" : "Translator"}`
                        );
                      }}
                      className="py-2.5 px-3 rounded-xl bg-blue-600/20 border border-blue-500 text-blue-200 text-xs font-bold"
                    >
                      + Add to SRS Cards
                    </button>
                  </div>

                  {/* ALL 5 DIALECTS COMPARISON MATRIX */}
                  {dictResult.byDialect && (
                    <div className="pt-2 border-t border-slate-800 space-y-2">
                      <p className="text-xs font-extrabold text-amber-400">
                        🌎 How All 5 Dialects Say "{dictResult.query}":
                      </p>
                      <div className="space-y-2">
                        {Object.entries(DIALECTS).map(([code, dInfo]) => {
                          const dItem = dictResult.byDialect[code];
                          if (!dItem) return null;
                          return (
                            <div
                              key={code}
                              className={`bg-slate-950 p-3 rounded-2xl border text-xs space-y-1.5 ${
                                code === dialect ? "border-purple-500/60" : "border-slate-800"
                              }`}
                            >
                              <div className="flex justify-between items-center">
                                <span className="font-extrabold text-white">
                                  {dInfo.flag} {dInfo.short}: <span className="text-emerald-400">{dItem.term}</span>
                                </span>
                                <button
                                  onClick={() => speakSpanish(dItem.exEs, code)}
                                  className="px-2 py-1 bg-slate-800 rounded-lg text-purple-300 font-bold"
                                >
                                  🔊 Audio
                                </button>
                              </div>
                              <p className="text-slate-200 font-semibold">"{dItem.exEs}"</p>
                              <p className="text-slate-400">"{dItem.exEn}"</p>
                              <div className="flex gap-2 pt-1">
                                <button
                                  onClick={() => addWordToDrills(dItem.term, `${dictResult.en} (${dInfo.short})`, dItem.exEs, dItem.exEn)}
                                  className="px-2.5 py-1 bg-purple-950/80 border border-purple-700/50 text-purple-300 rounded-lg font-bold text-[11px]"
                                >
                                  + Drill ({dInfo.flag})
                                </button>
                                <button
                                  onClick={() => addWordToFlashcards(dItem.term, `${dictResult.en} (${dInfo.short})`, dItem.exEs, dItem.exEn, `${dInfo.flag} ${dInfo.short}`)}
                                  className="px-2.5 py-1 bg-blue-950/80 border border-blue-700/50 text-blue-300 rounded-lg font-bold text-[11px]"
                                >
                                  + SRS Card ({dInfo.flag})
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* Contextual Example Sentence Generator (with Raw 18+ Mode) */}
                  {dictResult.contexts && (
                    <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] font-extrabold text-emerald-400">✨ Contextual Sentence Generator</span>
                        <span className="text-[10px] text-slate-400">{DIALECTS[dialect].flag} {DIALECTS[dialect].short}</span>
                      </div>
                      <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                        {dictResult.contexts.map((ctx, idx) => (
                          <button
                            key={ctx.id}
                            onClick={() => setActiveContextIdx(idx)}
                            className={`whitespace-nowrap px-2.5 py-1.5 rounded-xl text-[11px] font-bold border ${
                              activeContextIdx === idx
                                ? "bg-purple-600/25 border-purple-500 text-purple-200"
                                : "bg-slate-900 border-slate-800 text-slate-400"
                            }`}
                          >
                            {ctx.label}
                          </button>
                        ))}
                      </div>

                      {dictResult.contexts[activeContextIdx] && (
                        <div className="pt-2 border-t border-slate-800/80 space-y-1.5">
                          <div className="flex justify-between items-start gap-2">
                            <p className="text-sm font-bold text-emerald-300">
                              "{dictResult.contexts[activeContextIdx].es}"
                            </p>
                            <button
                              onClick={() => speakSpanish(dictResult.contexts[activeContextIdx].es)}
                              className="px-2.5 py-1 bg-slate-800 rounded-lg text-xs font-bold shrink-0"
                            >
                              🔊 Hear
                            </button>
                          </div>
                          <p className="text-xs text-slate-400">
                            "{dictResult.contexts[activeContextIdx].en}"
                          </p>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* Saved Personal Dictionary History */}
              {savedWords.length > 0 && (
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-2.5">
                  <div className="flex justify-between items-center">
                    <h3 className="font-extrabold text-xs uppercase tracking-wider text-slate-300">
                      🕘 Recent Lookups ({savedWords.length})
                    </h3>
                    <button
                      onClick={() => setSavedWords([])}
                      className="text-[10px] text-slate-500 hover:text-rose-400 font-bold"
                    >
                      Clear
                    </button>
                  </div>
                  <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                    {savedWords.map((item, idx) => (
                      <div
                        key={idx}
                        onClick={() => setDictResult(item)}
                        className="bg-slate-950 border border-slate-800 hover:border-purple-500/50 rounded-2xl p-3 flex justify-between items-center cursor-pointer"
                      >
                        <div>
                          <p className="text-sm font-extrabold text-emerald-400">{item.es}</p>
                          <p className="text-xs text-slate-400">{item.en}</p>
                        </div>
                        <button
                          onClick={(e) => { e.stopPropagation(); speakSpanish(item.es); }}
                          className="px-2.5 py-1.5 bg-slate-800 rounded-xl text-xs font-bold"
                        >
                          🔊
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Regional Slang & 18+ Curse Vault */}
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-extrabold text-sm text-amber-400">🌶️ Slang & 18+ Curse Vault</h3>
                  <select
                    value={slangFilter}
                    onChange={(e) => setSlangFilter(e.target.value)}
                    className="bg-slate-800 text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-700"
                  >
                    <option value="ALL">🌎 All 5 Dialects</option>
                    <option value="es-CU">🇨🇺 Cuba</option>
                    <option value="es-MX">🇲🇽 Mexico</option>
                    <option value="es-CO">🇨🇴 Colombia</option>
                    <option value="es-ES">🇪🇸 Spain</option>
                    <option value="es-AR">🇦🇷 Argentina</option>
                  </select>
                </div>

                {/* Category Filter Pills */}
                <div className="grid grid-cols-3 gap-1.5 text-xs font-bold">
                  {[
                    { id: "ALL", label: "🔥 All" },
                    { id: "slang", label: "🌶️ Street Slang" },
                    { id: "curse", label: "🤬 18+ Curse" }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setVaultTypeFilter(tab.id)}
                      className={`py-1.5 rounded-xl border ${
                        vaultTypeFilter === tab.id
                          ? "bg-purple-600/25 border-purple-500 text-purple-200"
                          : "bg-slate-950 border-slate-800 text-slate-400"
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                <div className="space-y-2.5">
                  {SLANG_VAULT.filter(s =>
                    (slangFilter === "ALL" || s.dialect === slangFilter) &&
                    (vaultTypeFilter === "ALL" || s.category === vaultTypeFilter)
                  ).map((item) => (
                    <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-1.5">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            item.category === "curse" ? "bg-rose-950 text-rose-300 border border-rose-700/50" : "bg-slate-800 text-amber-300"
                          }`}>
                            {item.badge}
                          </span>
                          <h4 className="font-extrabold text-base text-white mt-1">{item.phrase}</h4>
                        </div>
                        <button
                          onClick={() => speakSpanish(item.exEs, item.dialect)}
                          className="px-2.5 py-1.5 bg-slate-800 rounded-xl text-xs font-bold"
                        >
                          🔊 Audio
                        </button>
                      </div>
                      <p className="text-xs text-slate-400"><b>Literal:</b> "{item.literal}" • <b>Meaning:</b> {item.meaning}</p>
                      <p className="text-xs text-emerald-300 font-semibold">"{item.exEs}"</p>
                      <p className="text-xs text-slate-500">"{item.exEn}"</p>
                      <div className="flex gap-2 pt-2">
                        <button
                          onClick={() => addWordToDrills(item.phrase, item.meaning, item.exEs, item.exEn)}
                          className="flex-1 py-1.5 bg-purple-600/20 border border-purple-500/50 text-purple-300 rounded-xl text-xs font-bold"
                        >
                          + Add to Drills
                        </button>
                        <button
                          onClick={() => addWordToFlashcards(item.phrase, item.meaning, item.exEs, item.exEn, item.badge)}
                          className="flex-1 py-1.5 bg-blue-600/20 border border-blue-500/50 text-blue-300 rounded-xl text-xs font-bold"
                        >
                          + Add to SRS
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
