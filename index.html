<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Yordanis — Live Spanish Tutor</title>
  <!-- React & Babel CDNs for Single-File Browser Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Top Navigation Bar */
    .top-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #0d1322;
      border-bottom: 1px solid #1e293b;
      overflow-x: auto;
      scrollbar-width: none;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      padding: 8px 10px;
      border-radius: 12px;
      background: #131c31;
      border: 1px solid #1e293b;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .nav-tab.active {
      background: #172554;
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.35);
    }

    .nav-tab-icon {
      font-size: 16px;
      margin-bottom: 3px;
    }

    .tabs-pill-btn {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      border-radius: 20px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Main Container */
    .main-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 40px;
    }

    /* Yordanis Response Card */
    .tutor-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .spanish-main-text {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.45;
      color: #ffffff;
      text-align: center;
      margin-bottom: 12px;
    }

    .breakdown-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
    }

    .phonetic-box {
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      line-height: 1.6;
      color: #fb923c;
      text-align: center;
      margin: 12px 0;
      padding: 8px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
    }

    .english-subtext {
      font-size: 14px;
      line-height: 1.45;
      color: #94a3b8;
      text-align: center;
      margin-top: 8px;
    }

    /* Orb Card Area */
    .orb-stage {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .orb-btn {
      width: 126px;
      height: 126px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 35%, #3b82f6, #1d4ed8 70%, #1e3a8a 100%);
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.55), inset 0 2px 6px rgba(255, 255, 255, 0.3);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .orb-btn:active {
      transform: scale(0.95);
    }

    .orb-btn.listening {
      background: radial-gradient(circle at 35% 35%, #22c55e, #15803d 70%, #14532d 100%);
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.65), inset 0 2px 6px rgba(255, 255, 255, 0.35);
      animation: pulseOrb 1.6s infinite ease-in-out;
    }

    .orb-btn.speaking {
      background: radial-gradient(circle at 35% 35%, #8b5cf6, #6d28d9 70%, #4c1d95 100%);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.65);
    }

    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .orb-icon {
      font-size: 30px;
    }

    .orb-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      text-align: center;
      padding: 0 8px;
    }

    /* Ask in English & Text Input Bar */
    .action-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .english-ask-btn {
      flex: 1;
      background: #172036;
      border: 1px solid #2e3f63;
      color: #93c5fd;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .text-input {
      flex: 1;
      background: #111827;
      border: 1px solid #1f2937;
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .text-input:focus {
      border-color: #3b82f6;
    }

    .send-btn {
      background: #4f46e5;
      border: none;
      color: #ffffff;
      padding: 0 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =====================================================
       LIVE TUTOR CALL MODE OVERLAY (Full-Screen Interface)
       ===================================================== */
    .live-overlay {
      position: fixed;
      inset: 0;
      background: #070b14;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .live-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      gap: 8px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111827;
      border: 1px solid #1f2937;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .level-selector {
      display: flex;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    .level-btn {
      background: transparent;
      border: none;
      color: #64748b;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .level-btn.active {
      background: #2563eb;
      color: #ffffff;
    }

    .end-call-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Live Stream Body */
    .live-stream-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px 2px;
    }

    .stream-box {
      border-radius: 16px;
      padding: 15px;
      border: 1px solid #1e293b;
      background: #0f172a;
    }

    .stream-box.user-box {
      background: #111a2e;
      border-color: #1e3a8a;
    }

    .stream-box.ai-box {
      background: #111827;
      border-color: #334155;
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .live-user-transcript {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      color: #f8fafc;
      min-height: 28px;
    }

    .interim-words {
      color: #60a5fa;
      font-style: italic;
    }

    /* Grammar & Fluency Coach Card */
    .coach-card {
      background: linear-gradient(135deg, #172554 0%, #1e1b4b 100%);
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 14px;
    }

    .coach-title {
      font-size: 12px;
      font-weight: 800;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .coach-item {
      font-size: 14px;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .tag-fix {
      color: #fca5a5;
      font-weight: 700;
      margin-right: 6px;
    }

    .tag-fluent {
      color: #86efac;
      font-weight: 700;
      margin-right: 6px;
    }

    .coach-tip {
      font-size: 12px;
      color: #cbd5e1;
      font-style: italic;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Word-by-Word Breakdown Drawer */
    .breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
    }

    .word-chip {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .word-chip-es {
      font-weight: 700;
      color: #ffffff;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-chip-en {
      font-size: 12px;
      color: #94a3b8;
    }

    .srs-add-mini {
      background: #2563eb;
      border: none;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Live Footer Controls */
    .live-footer {
      border-top: 1px solid #1e293b;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .live-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .secondary-circle-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Modal for API Key / Settings */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Default initial greeting matching your exact UI
    const INITIAL_YORDANIS_MESSAGE = {
      replySpanish: "¡Qué bola, asere! Soy Yordanis. Toca el círculo para hablar en español, o usa el botón en inglés abajo si quieres saber cómo se dice una palabra.",
      replyPhonetic: "[keh · boh-lah · ah-seh-reh · sohy · yohr-dah-neh · toh-kah · ehl · keer-koo-loh · pah-rah · ah-blahr · ehn · ehs-pah-nyohl · oh · oo-sah · ehl · boh-tohn · ehn · eeng-lehs · ah-bah-hoh · see · keh-rehs · sah-behr · koh-moh · seh · dee-seh · oo-nah · pah-lah-brah]",
      replyEnglish: "What's up, bro! I'm Yordanis. Tap the orb to speak Spanish, or use the English button below to ask how to say any English word.",
      isNatural: true,
      correction: "",
      moreFluentWay: "",
      coachingTip: "",
      wordBreakdown: [
        { es: "¡Qué bola, asere!", en: "What's up, bro! (Cuban/street greeting)" },
        { es: "Toca el círculo", en: "Tap the circle/orb" },
        { es: "para hablar", en: "in order to speak" },
        { es: "si quieres saber", en: "if you want to know" },
        { es: "cómo se dice", en: "how one says / how to say" }
      ]
    };

    // Helper to read any existing API key stored in browser localStorage
    function getStoredApiKey() {
      const possibleKeys = [
        "gemini_api_key",
        "GEMINI_API_KEY",
        "apiKey",
        "vozzy_api_key",
        "spanish_api_key"
      ];
      for (const k of possibleKeys) {
        const val = localStorage.getItem(k);
        if (val && val.trim().length > 10) return val.trim();
      }
      return "";
    }

    function App() {
      const [activeTab, setActiveTab] = useState("free_ai");
      const [apiKey, setApiKey] = useState(getStoredApiKey);
      const [showSettings, setShowSettings] = useState(false);

      // Main Free AI State
      const [currentMessage, setCurrentMessage] = useState(INITIAL_YORDANIS_MESSAGE);
      const [showBreakdown, setShowBreakdown] = useState(false);
      const [inputText, setInputText] = useState("");
      const [cefrLevel, setCefrLevel] = useState("A2"); // A1, A2, B1, B2

      // Live Call Interface State
      const [isLiveCallOpen, setIsLiveCallOpen] = useState(false);
      const [liveModeType, setLiveModeType] = useState("es"); // "es" (Speak Spanish) or "en" (Ask in English)
      const [callStatus, setCallStatus] = useState("listening"); // "listening" | "thinking" | "speaking" | "paused"
      const [liveFinalText, setLiveFinalText] = useState("");
      const [liveInterimText, setLiveInterimText] = useState("");
      const [streamedAiWords, setStreamedAiWords] = useState(INITIAL_YORDANIS_MESSAGE.replySpanish);

      // SRS Flashcards State
      const [srsCards, setSrsCards] = useState(() => {
        const saved = localStorage.getItem("yordanis_srs_cards");
        return saved ? JSON.parse(saved) : [
          { id: 1, es: "¿Cómo se dice...?", en: "How do you say...?", phonetic: "[koh-moh · seh · dee-seh]" },
          { id: 2, es: "Compartir", en: "To share", phonetic: "[kohm-pahr-teer]" },
          { id: 3, es: "Hasta luego", en: "See you later", phonetic: "[ahs-tah · lweh-goh]" },
          { id: 4, es: "Ahorita vengo", en: "I'll be right back", phonetic: "[ah-oh-ree-tah · behn-goh]" }
        ];
      });

      // Refs for Speech Recognition & Timers
      const recognitionRef = useRef(null);
      const silenceTimerRef = useRef(null);
      const wordStreamTimerRef = useRef(null);
      const accumulatedSpeechRef = useRef("");

      useEffect(() => {
        localStorage.setItem("yordanis_srs_cards", JSON.stringify(srsCards));
      }, [srsCards]);

      const saveApiKey = (newKey) => {
        const cleaned = newKey.trim();
        setApiKey(cleaned);
        localStorage.setItem("gemini_api_key", cleaned);
        setShowSettings(false);
      };

      const addWordToSrs = (es, en) => {
        if (srsCards.some((c) => c.es.toLowerCase() === es.toLowerCase())) return;
        setSrsCards((prev) => [
          ...prev,
          { id: Date.now(), es, en, phonetic: "" }
        ]);
      };

      // =====================================================
      // CORE AI TUTOR CALL (Level-Adaptive + Live Coaching)
      // =====================================================
      const askYordanisAI = async (userSpokenOrTyped, mode = "es") => {
        const levelDescriptions = {
          A1: "Beginner (A1): Use very simple, short present-tense sentences, basic high-frequency words, and speak clearly.",
          A2: "Elementary (A2): Use everyday conversational phrases, basic past/future tenses, and warm encouragement.",
          B1: "Intermediate (B1): Use natural conversational speed, common idioms, and connected sentences.",
          B2: "Upper-Intermediate (B2): Speak like a native friend using rich expressions, subjunctive where natural, and nuanced phrasing."
        };

        const systemInstruction = `
You are Yordanis, an intuitive, warm, street-smart personal Spanish tutor having a live real-time voice conversation with your student.
Target Student Level: ${levelDescriptions[cefrLevel]}
Input Mode: ${mode === "en" ? "The student is asking a question in English (e.g., how to say something in Spanish)." : "The student is practicing speaking Spanish with you."}

Respond ONLY in valid JSON matching this exact schema (no markdown backticks):
{
  "userOriginal": "exact text the user said",
  "isNatural": true,
  "correction": "If the user made a grammar/vocab mistake in Spanish, write the corrected Spanish sentence here. Otherwise empty string.",
  "moreFluentWay": "Show a natural, native way to say what the user wanted to say in Spanish.",
  "coachingTip": "1 brief, friendly sentence in English explaining the correction or why the native phrase works well.",
  "replySpanish": "Your direct conversational reply in Spanish keeping the back-and-forth tutor conversation flowing naturally (1-2 sentences).",
  "replyPhonetic": "Syllable-by-syllable phonetic guide in brackets with middots, e.g. [keh · boh-lah · ah-seh-reh]",
  "replyEnglish": "Natural English translation of your replySpanish.",
  "wordBreakdown": [
    { "es": "Spanish word/phrase from your reply", "en": "English meaning" }
  ]
}`;

        if (!apiKey) {
          // Helpful fallback response if user hasn't entered their Gemini key yet
          return {
            userOriginal: userSpokenOrTyped,
            isNatural: false,
            correction: "¡Hola Yordanis! Quiero practicar español.",
            moreFluentWay: "¡Qué tal, Yordanis! Vamos a practicar un rato.",
            coachingTip: "Tap the ⚙️ Tabs / Key button in the top right to paste your Gemini API key for unlimited live AI responses!",
            replySpanish: `¡Claro que sí! Escuché que dijiste: "${userSpokenOrTyped}". Agrega tu clave API arriba en ⚙️ Tabs para conversar sin límites.`,
            replyPhonetic: "[klah-roh · keh · see · ehs-koo-cheh · keh · dee-hees-teh]",
            replyEnglish: `Of course! I heard you say: "${userSpokenOrTyped}". Add your API key in ⚙️ Tabs above for unlimited live conversation.`,
            wordBreakdown: [
              { es: "¡Claro que sí!", en: "Of course!" },
              { es: "Escuché", en: "I heard" },
              { es: "Vamos a practicar", en: "Let's practice" }
            ]
          };
        }

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstruction }] },
            contents: [{ role: "user", parts: [{ text: userSpokenOrTyped }] }],
            generationConfig: {
              temperature: 0.7,
              responseMimeType: "application/json"
            }
          })
        });

        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
        const cleanedJson = rawText.replace(/```json|```/g, "").trim();
        return JSON.parse(cleanedJson);
      };

      // =====================================================
      // REAL-TIME SPEECH RECOGNITION & LIVE CALL FLOW
      // =====================================================
      const stopEverything = () => {
        if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
        if (wordStreamTimerRef.current) clearInterval(wordStreamTimerRef.current);
        if (recognitionRef.current) {
          recognitionRef.current.onend = null;
          recognitionRef.current.onerror = null;
          try { recognitionRef.current.stop(); } catch (e) {}
        }
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
      };

      const launchLiveTutorCall = (mode = "es") => {
        setLiveModeType(mode);
        setIsLiveCallOpen(true);
        startMicrophoneStream(mode);
      };

      const closeLiveTutorCall = () => {
        stopEverything();
        setIsLiveCallOpen(false);
        setCallStatus("paused");
      };

      const startMicrophoneStream = (mode = liveModeType) => {
        stopEverything();
        setLiveFinalText("");
        setLiveInterimText("");
        accumulatedSpeechRef.current = "";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Speech Recognition is not supported in this browser. Please use Chrome on Android or Desktop.");
          setCallStatus("paused");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = mode === "en" ? "en-US" : "es-MX";
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
          setCallStatus("listening");
        };

        recognition.onresult = (event) => {
          let interim = "";
          let finalChunk = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalChunk += transcript + " ";
            } else {
              interim += transcript;
            }
          }

          if (finalChunk) {
            accumulatedSpeechRef.current = (accumulatedSpeechRef.current + " " + finalChunk).trim();
            setLiveFinalText(accumulatedSpeechRef.current);
          }
          setLiveInterimText(interim);

          // Automatic turn-taking after 1.8 seconds of silence
          if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
          const combined = (accumulatedSpeechRef.current + " " + interim).trim();
          if (combined.length > 1) {
            silenceTimerRef.current = setTimeout(() => {
              finishUserTurnAndRespond(combined, mode);
            }, 1800);
          }
        };

        recognition.onerror = (event) => {
          if (event.error !== "aborted") {
            setCallStatus("paused");
          }
        };

        recognitionRef.current = recognition;
        try {
          recognition.start();
        } catch (err) {
          console.warn(err);
        }
      };

      const finishUserTurnAndRespond = async (overrideText, mode = liveModeType) => {
        if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
        if (recognitionRef.current) {
          recognitionRef.current.onend = null;
          try { recognitionRef.current.stop(); } catch (e) {}
        }

        const finalSpoken = (
          overrideText ||
          (accumulatedSpeechRef.current + " " + liveInterimText)
        ).trim();

        if (!finalSpoken) {
          setCallStatus("paused");
          return;
        }

        setLiveFinalText(finalSpoken);
        setLiveInterimText("");
        setCallStatus("thinking");

        try {
          const tutorReply = await askYordanisAI(finalSpoken, mode);
          setCurrentMessage(tutorReply);
          speakAndStreamWords(tutorReply.replySpanish, true);
        } catch (err) {
          console.error(err);
          setCallStatus("paused");
        }
      };

      // Speaks Spanish aloud and streams words onto the screen in real time
      const speakAndStreamWords = (spanishText, autoResumeMic = false, customRate = null) => {
        if (wordStreamTimerRef.current) clearInterval(wordStreamTimerRef.current);
        if (window.speechSynthesis) window.speechSynthesis.cancel();

        const words = spanishText.split(" ");
        let index = 0;
        setStreamedAiWords("");
        setCallStatus("speaking");

        const speedByLevel = { A1: 0.85, A2: 0.92, B1: 0.98, B2: 1.03 };
        const chosenRate = customRate || speedByLevel[cefrLevel] || 0.95;

        const utterance = new SpeechSynthesisUtterance(spanishText);
        utterance.lang = "es-MX";
        utterance.rate = chosenRate;

        const startWordTicker = () => {
          if (wordStreamTimerRef.current) clearInterval(wordStreamTimerRef.current);
          const msPerWord = Math.round(310 / chosenRate);
          wordStreamTimerRef.current = setInterval(() => {
            index++;
            setStreamedAiWords(words.slice(0, index).join(" "));
            if (index >= words.length) {
              clearInterval(wordStreamTimerRef.current);
            }
          }, msPerWord);
        };

        utterance.onstart = startWordTicker;

        utterance.onend = () => {
          if (wordStreamTimerRef.current) clearInterval(wordStreamTimerRef.current);
          setStreamedAiWords(spanishText);
          if (autoResumeMic && isLiveCallOpen) {
            setTimeout(() => {
              startMicrophoneStream("es");
            }, 450);
          } else {
            setCallStatus("paused");
          }
        };

        utterance.onerror = () => {
          if (wordStreamTimerRef.current) clearInterval(wordStreamTimerRef.current);
          setStreamedAiWords(spanishText);
          setCallStatus("paused");
        };

        window.speechSynthesis.speak(utterance);
        // Immediate fallback ticker in case mobile browser delays onstart
        startWordTicker();
      };

      const handleManualTextSend = async () => {
        if (!inputText.trim()) return;
        const textToSend = inputText.trim();
        setInputText("");
        setIsLiveCallOpen(true);
        setLiveFinalText(textToSend);
        setLiveInterimText("");
        setCallStatus("thinking");

        try {
          const tutorReply = await askYordanisAI(textToSend, "es");
          setCurrentMessage(tutorReply);
          speakAndStreamWords(tutorReply.replySpanish, false);
        } catch (err) {
          setCallStatus("paused");
        }
      };

      return (
        <div>
          {/* TOP NAVIGATION BAR */}
          <nav className="top-nav">
            <button
              className={`nav-tab ${activeTab === "lens" ? "active" : ""}`}
              onClick={() => setActiveTab("lens")}
            >
              <span className="nav-tab-icon">📸</span>
              <span>Lens/Sl...</span>
            </button>

            <button
              className={`nav-tab ${activeTab === "free_ai" ? "active" : ""}`}
              onClick={() => setActiveTab("free_ai")}
            >
              <span className="nav-tab-icon">🎙️</span>
              <span>Free AI</span>
            </button>

            <button
              className={`nav-tab ${activeTab === "media" ? "active" : ""}`}
              onClick={() => setActiveTab("media")}
            >
              <span className="nav-tab-icon">🎧</span>
              <span>Media/...</span>
            </button>

            <button
              className={`nav-tab ${activeTab === "srs" ? "active" : ""}`}
              onClick={() => setActiveTab("srs")}
            >
              <span className="nav-tab-icon">🧠</span>
              <span>SRS ({srsCards.length})</span>
            </button>

            <button
              className={`nav-tab ${activeTab === "drills" ? "active" : ""}`}
              onClick={() => setActiveTab("drills")}
            >
              <span className="nav-tab-icon">🎯</span>
              <span>Drills</span>
            </button>

            <button className="tabs-pill-btn" onClick={() => setShowSettings(true)}>
              <span>⚙️</span>
              <span>Tabs</span>
            </button>
          </nav>

          {/* =====================================================
              TAB 1: FREE AI HUB
             ===================================================== */}
          {activeTab === "free_ai" && (
            <main className="main-container">
              {/* Yordanis Latest Message Card */}
              <section className="tutor-card">
                <div className="spanish-main-text">
                  {currentMessage.replySpanish}
                  <button
                    className="breakdown-btn"
                    onClick={() => setShowBreakdown(!showBreakdown)}
                  >
                    🔍 Breakdown
                  </button>
                </div>

                <div className="phonetic-box">
                  🔊 {currentMessage.replyPhonetic}
                </div>

                <div className="english-subtext">
                  {currentMessage.replyEnglish}
                </div>

                {/* Expandable Word Breakdown */}
                {showBreakdown && currentMessage.wordBreakdown && (
                  <div className="breakdown-grid">
                    {currentMessage.wordBreakdown.map((item, idx) => (
                      <div key={idx} className="word-chip">
                        <div className="word-chip-es">
                          <span>{item.es}</span>
                          <button
                            className="srs-add-mini"
                            onClick={() => addWordToSrs(item.es, item.en)}
                            title="Save to SRS"
                          >
                            +SRS
                          </button>
                        </div>
                        <div className="word-chip-en">{item.en}</div>
                      </div>
                    ))}
                  </div>
                )}
              </section>

              {/* Center Orb Button — Immediately Opens Live Call Interface */}
              <section className="orb-stage">
                <button
                  className="orb-btn"
                  onClick={() => launchLiveTutorCall("es")}
                >
                  <span className="orb-icon">🎙️</span>
                  <span className="orb-label">SPEAK SPANISH</span>
                </button>
              </section>

              {/* Ask in English Button */}
              <div className="action-row">
                <button
                  className="english-ask-btn"
                  onClick={() => launchLiveTutorCall("en")}
                >
                  <span>🇺🇸</span>
                  <span>Ask in English ("How do I say...")</span>
                </button>
              </div>

              {/* Bottom Text Question Input */}
              <div className="input-row">
                <input
                  type="text"
                  className="text-input"
                  placeholder="Or type Spanish / English question here"
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && handleManualTextSend()}
                />
                <button className="send-btn" onClick={handleManualTextSend}>
                  Send
                </button>
              </div>
            </main>
          )}

          {/* =====================================================
              LIVE TUTOR CALL MODE OVERLAY (Triggered on Orb Tap)
             ===================================================== */}
          {isLiveCallOpen && (
            <div className="live-overlay">
              {/* Top Bar: Live Status + Level Selector + Close */}
              <div className="live-header">
                <div className="status-pill">
                  <span
                    className="status-dot"
                    style={{
                      backgroundColor:
                        callStatus === "listening"
                          ? "#22c55e"
                          : callStatus === "speaking"
                          ? "#8b5cf6"
                          : callStatus === "thinking"
                          ? "#f59e0b"
                          : "#64748b"
                    }}
                  />
                  <span>
                    {callStatus === "listening" &&
                      (liveModeType === "en" ? "Listening (English)..." : "Listening (Español)...")}
                    {callStatus === "thinking" && "Yordanis is thinking..."}
                    {callStatus === "speaking" && "Yordanis is speaking..."}
                    {callStatus === "paused" && "Tap orb to talk"}
                  </span>
                </div>

                {/* Adaptive Level Pills */}
                <div className="level-selector">
                  {["A1", "A2", "B1", "B2"].map((lvl) => (
                    <button
                      key={lvl}
                      className={`level-btn ${cefrLevel === lvl ? "active" : ""}`}
                      onClick={() => setCefrLevel(lvl)}
                    >
                      {lvl}
                    </button>
                  ))}
                </div>

                <button className="end-call-btn" onClick={closeLiveTutorCall}>
                  ✕ End
                </button>
              </div>

              {/* Center Live Conversation Transcript Stream */}
              <div className="live-stream-body">
                {/* 1. User's Live Speech-to-Text Stream */}
                <div className="stream-box user-box">
                  <div className="box-header">
                    <span>🎙️ YOU ({cefrLevel} STUDENT)</span>
                    <span>{callStatus === "listening" ? "LIVE MIC ON" : "TRANSCRIPT"}</span>
                  </div>
                  <div className="live-user-transcript">
                    <span>{liveFinalText} </span>
                    <span className="interim-words">{liveInterimText}</span>
                    {!liveFinalText && !liveInterimText && (
                      <span style={{ color: "#475569", fontStyle: "italic", fontSize: "16px" }}>
                        {liveModeType === "en"
                          ? 'Say what you want to translate (e.g. "How do I order tacos?")...'
                          : "Empieza a hablar en español... tus palabras aparecerán aquí en vivo."}
                      </span>
                    )}
                  </div>
                </div>

                {/* 2. Live Fluency & Grammar Coaching Box */}
                {(currentMessage.correction || currentMessage.moreFluentWay) && (
                  <div className="coach-card">
                    <div className="coach-title">
                      <span>
                        {currentMessage.isNatural
                          ? "✅ Native & Natural!"
                          : "💡 Live Grammar & Fluency Coach"}
                      </span>
                      {currentMessage.moreFluentWay && (
                        <button
                          className="srs-add-mini"
                          onClick={() =>
                            speakAndStreamWords(currentMessage.moreFluentWay, false, 0.85)
                          }
                        >
                          🔊 Hear Native
                        </button>
                      )}
                    </div>

                    {!currentMessage.isNatural && currentMessage.correction && (
                      <div className="coach-item">
                        <span className="tag-fix">Correction:</span>
                        <span>{currentMessage.correction}</span>
                      </div>
                    )}

                    {currentMessage.moreFluentWay && (
                      <div className="coach-item">
                        <span className="tag-fluent">More Fluent:</span>
                        <strong style={{ color: "#ffffff" }}>
                          "{currentMessage.moreFluentWay}"
                        </strong>
                      </div>
                    )}

                    {currentMessage.coachingTip && (
                      <div className="coach-tip">{currentMessage.coachingTip}</div>
                    )}
                  </div>
                )}

                {/* 3. Yordanis Live Word-by-Word Response Stream */}
                <div className="stream-box ai-box">
                  <div className="box-header">
                    <span>🧑‍🏫 YORDANIS (LIVE TUTOR)</span>
                    <button
                      className="breakdown-btn"
                      onClick={() => setShowBreakdown(!showBreakdown)}
                    >
                      🔍 Breakdown
                    </button>
                  </div>

                  <div
                    className="spanish-main-text"
                    style={{ textAlign: "left", marginBottom: "10px" }}
                  >
                    {streamedAiWords || currentMessage.replySpanish}
                  </div>

                  <div className="phonetic-box" style={{ textAlign: "left" }}>
                    🔊 {currentMessage.replyPhonetic}
                  </div>

                  <div className="english-subtext" style={{ textAlign: "left" }}>
                    {currentMessage.replyEnglish}
                  </div>

                  {showBreakdown && currentMessage.wordBreakdown && (
                    <div className="breakdown-grid">
                      {currentMessage.wordBreakdown.map((item, idx) => (
                        <div key={idx} className="word-chip">
                          <div className="word-chip-es">
                            <span>{item.es}</span>
                            <button
                              className="srs-add-mini"
                              onClick={() => addWordToSrs(item.es, item.en)}
                            >
                              +SRS
                            </button>
                          </div>
                          <div className="word-chip-en">{item.en}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              {/* Bottom Interactive Call Controls */}
              <div className="live-footer">
                <div className="live-controls-row">
                  <button
                    className="secondary-circle-btn"
                    onClick={() =>
                      speakAndStreamWords(currentMessage.replySpanish, false, 0.75)
                    }
                  >
                    🐢 Slow (0.75x)
                  </button>

                  <button
                    className={`orb-btn ${
                      callStatus === "listening"
                        ? "listening"
                        : callStatus === "speaking"
                        ? "speaking"
                        : ""
                    }`}
                    style={{ width: "104px", height: "104px" }}
                    onClick={() => {
                      if (callStatus === "listening") {
                        finishUserTurnAndRespond();
                      } else {
                        startMicrophoneStream("es");
                      }
                    }}
                  >
                    <span className="orb-icon">🎙️</span>
                    <span className="orb-label">
                      {callStatus === "listening" ? "TAP IF DONE" : "SPEAK SPANISH"}
                    </span>
                  </button>

                  <button
                    className="secondary-circle-btn"
                    onClick={() => startMicrophoneStream("en")}
                  >
                    🇺🇸 Ask English
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =====================================================
              OTHER TABS (SRS, DRILLS, MEDIA, LENS)
             ===================================================== */}
          {activeTab === "srs" && (
            <main className="main-container">
              <div className="tutor-card">
                <h3 style={{ marginBottom: "12px" }}>🧠 Spaced Repetition Deck ({srsCards.length})</h3>
                <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                  {srsCards.map((card) => (
                    <div key={card.id} className="word-chip" style={{ padding: "12px" }}>
                      <div className="word-chip-es" style={{ fontSize: "17px" }}>
                        <span>{card.es}</span>
                        <button
                          className="srs-add-mini"
                          onClick={() => speakAndStreamWords(card.es, false)}
                        >
                          🔊 Play
                        </button>
                      </div>
                      <div className="word-chip-en" style={{ fontSize: "14px", marginTop: "4px" }}>
                        {card.en}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {(activeTab === "lens" || activeTab === "media" || activeTab === "drills") && (
            <main className="main-container">
              <div className="tutor-card" style={{ textAlign: "center" }}>
                <h3 style={{ marginBottom: "8px" }}>
                  {activeTab === "lens" && "📸 Lens & Street Slang"}
                  {activeTab === "media" && "🎧 Media & Song Translator"}
                  {activeTab === "drills" && "🎯 Verb Matrix & Fluency Drills"}
                </h3>
                <p className="english-subtext" style={{ marginBottom: "16px" }}>
                  Use the Free AI tab or launch Live Call Mode to practice these phrases aloud with Yordanis.
                </p>
                <button
                  className="send-btn"
                  style={{ padding: "12px 20px" }}
                  onClick={() => {
                    setActiveTab("free_ai");
                    launchLiveTutorCall("es");
                  }}
                >
                  🎙️ Practice Live with Yordanis
                </button>
              </div>
            </main>
          )}

          {/* =====================================================
              SETTINGS / API KEY MODAL (⚙️ Tabs Button)
             ===================================================== */}
          {showSettings && (
            <div className="modal-backdrop" onClick={() => setShowSettings(false)}>
              <div className="modal-card" onClick={(e) => e.stopPropagation()}>
                <h3>⚙️ Tutor Settings & Gemini API Key</h3>
                <p style={{ fontSize: "13px", color: "#94a3b8" }}>
                  Your API key is stored locally on your phone inside your browser (`localStorage`).
                </p>
                <input
                  type="password"
                  className="text-input"
                  placeholder="Paste Gemini API Key (AIzaSy...)"
                  defaultValue={apiKey}
                  id="api-key-input"
                />
                <div style={{ display: "flex", gap: "10px", justifyContent: "flex-end" }}>
                  <button
                    className="secondary-circle-btn"
                    onClick={() => setShowSettings(false)}
                  >
                    Cancel
                  </button>
                  <button
                    className="send-btn"
                    style={{ padding: "10px 18px" }}
                    onClick={() => {
                      const val = document.getElementById("api-key-input").value;
                      saveApiKey(val);
                    }}
                  >
                    Save Key
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
