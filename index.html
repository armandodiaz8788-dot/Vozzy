    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim();
    }

    function generatePhoneticGuide(spanishText, dialectCode = "es-CU") {
      if (!spanishText) return "";
      const words = spanishText
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      const convertWord = (rawW) => {
        let w = rawW.toLowerCase();
        if (dialectCode === "es-CU") {
          w = w.replace(/ado$/, "ao").replace(/ada$/, "á");
          w = w.replace(/s([tpckfbgd])/g, "h$1").replace(/s$/, "h");
        } else if (dialectCode === "es-AR") {
          w = w.replace(/ll/g, "sh").replace(/\by([aeiouáéíóú])/g, "sh$1");
        } else if (dialectCode === "es-ES") {
          w = w.replace(/z/g, "th").replace(/ce/g, "the").replace(/ci/g, "thi");
        }
        w = w
          .replace(/qué/g, "KEH")
          .replace(/que/g, "keh")
          .replace(/qu([eiéí])/g, "k$1")
          .replace(/gue/g, "geh")
          .replace(/gui/g, "gee")
          .replace(/ñ/g, "ny")
          .replace(/ll/g, "y")
          .replace(/j/g, "kh")
          .replace(/ge/g, "kheh")
          .replace(/gi/g, "khee")
          .replace(/ce/g, "seh")
          .replace(/ci/g, "see")
          .replace(/z/g, "s")
          .replace(/^h/g, "")
          .replace(/v/g, "b");
        return w;
      };

      return words.map(convertWord).join(" · ");
    }

    function wordSimilarity(a, b) {
      const s1 = normalizeText(a);
      const s2 = normalizeText(b);
      if (!s1 || !s2) return 0;
      if (s1 === s2) return 100;
      if (b.includes("*") && s1[0] === s2[0] && Math.abs(b.length - s1.length) <= 2) return 95;
      const phoneticNorm = (w) => w.replace(/v/g, "b").replace(/z/g, "s").replace(/ll/g, "y").replace(/s$/, "");
      if (phoneticNorm(s1) === phoneticNorm(s2)) return 82;

      const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
      for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
      for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;
      for (let j = 1; j <= s2.length; j += 1) {
        for (let i = 1; i <= s1.length; i += 1) {
          const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
          track[j][i] = Math.min(
            track[j][i - 1] + 1,
            track[j - 1][i] + 1,
            track[j - 1][i - 1] + indicator
          );
        }
      }
      const distance = track[s2.length][s1.length];
      const maxLen = Math.max(s1.length, s2.length);
      return Math.round(((maxLen - distance) / maxLen) * 100);
    }

    function scorePronunciation(expected, spoken) {
      const expWords = (expected || "").trim().split(/\s+/).filter(Boolean);
      const spkWords = (spoken || "").trim().split(/\s+/).filter(Boolean);
      if (!spkWords.length) {
        return {
          score: 0,
          breakdown: expWords.map(w => ({ word: w, status: "red", sim: 0, note: "Not heard" }))
        };
      }
      let totalSim = 0;
      const breakdown = expWords.map((expW, idx) => {
        let bestSim = 0;
        let matchedSpk = "";
        spkWords.forEach((spkW, sIdx) => {
          const sim = wordSimilarity(expW, spkW);
          const posPenalty = Math.abs(idx - sIdx) > 3 ? 10 : 0;
          const adjSim = Math.max(0, sim - posPenalty);
          if (adjSim > bestSim) {
            bestSim = adjSim;
            matchedSpk = spkW;
          }
        });
        totalSim += bestSim;
        let status = "red";
        let note = matchedSpk ? `Heard "${matchedSpk}" — tap for X-Ray & audio` : "Missed word";
        if (bestSim >= 85) {
          status = "green";
          note = "Perfect pronunciation!";
        } else if (bestSim >= 65) {
          status = "yellow";
          note = `Medium ("${matchedSpk}") — slight slur`;
        }
        return { word: expW, status, sim: bestSim, note };
      });
      const score = Math.round(totalSim / expWords.length);
      return { score, breakdown };
    }

      { regex: /\bla agua\b/gi, replacement: "el agua", reason: "Use 'el agua' in the singular." },
      { regex: /\bmas mejor\b|\bmás mejor\b/gi, replacement: "mejor", reason: "'Mejor' already means 'better' — drop 'más'." },
      { regex: /\bun otro\b/gi, replacement: "otro", reason: "Never put 'un' before 'otro' in Spanish." },
      { regex: /\bbuscando por\b/gi, replacement: "buscando", reason: "'Buscar' already means 'to look for' — drop 'por'." },
      { regex: /\besperando por\b/gi, replacement: "esperando", reason: "'Esperar' already means 'to wait for' — drop 'por'." },
      { regex: /\bestoy hambre\b|\bsoy hambre\b/gi, replacement: "tengo hambre", reason: "Use 'tener' for hunger: 'tengo hambre'." },
      { regex: /\bestoy frio\b|\bestoy frío\b/gi, replacement: "tengo frío", reason: "Use 'tengo frío' for feeling cold." },
      { regex: /\bestoy calor\b/gi, replacement: "tengo calor", reason: "Use 'tengo calor' for feeling hot." },
      { regex: /\bsoy (\d+) anos\b|\bsoy (\d+) años\b/gi, replacement: "tengo $1 años", reason: "Use 'tengo ... años' to state your age." },
      { regex: /\bmi nombre soy\b/gi, replacement: "mi nombre es", reason: "Use 'mi nombre es' or 'me llamo'." },
      { regex: /\bme llama\b/gi, replacement: "me llamo", reason: "For 'I call myself', use 'me llamo' (ending in -o)." },
      { regex: /\bestoy bien y tu\b/gi, replacement: "estoy bien, ¿y tú?", reason: "Add a comma and inverted question mark: '¿y tú?'." }
    ];

    // Add Proper Spanish Punctuation (¿ ? ¡ ! commas & accents)
    function restoreSpanishPunctuation(rawText) {
      let s = (rawText || "").trim();
      if (!s) return "";

      // Common accent restorations if speech-to-text stripped them
      s = s
        .replace(/\bcomo estas\b/gi, "¿cómo estás?")
        .replace(/\bque tal\b/gi, "¿qué tal?")
        .replace(/\bque bola\b/gi, "¿qué bolá?")
        .replace(/\by tu\b$/gi, "¿y tú?")
        .replace(/\btambien\b/gi, "también")
        .replace(/\bmas\b/gi, "más");

      // Capitalize first letter
      s = s.charAt(0).toUpperCase() + s.slice(1);

      // Add comma after greeting if followed by more words (e.g. "Hola me llamo Armando" -> "Hola, me llamo Armando.")
      s = s.replace(/^(Hola|Buenas|Oye|Che|Quiubo)\s+(?=[a-záéíóúñ])/i, "$1, ");

      // Detect if sentence is a question without question marks
      const isQuestion = /^(Que|Qué|Como|Cómo|Donde|Dónde|Cuando|Cuándo|Por que|Por qué|Quien|Quién|Cual|Cuál)\b/i.test(s);
      if (isQuestion && !s.includes("?")) {
        s = "¿" + s.charAt(0).toLowerCase() + s.slice(1) + "?";
        s = s.charAt(0) + s.charAt(1).toUpperCase() + s.slice(2);
      } else if (!/[.?!]$/.test(s)) {
        s = s + ".";
      }
      return s;
    }

    // Grade every word in Green (Perfect), Yellow (Medium), or Red (Bad)
    function gradeFreeSpeechWords(originalText, correctedText, rawConfidence, grammarMatches) {
      const origWords = (originalText || "").trim().split(/\s+/).filter(Boolean);
      const corrWords = (correctedText || "").replace(/[¿?¡!.,;:"]/g, "").trim().split(/\s+/).filter(Boolean);
      const baseConf = rawConfidence && rawConfidence > 0 ? rawConfidence : 0.88;

      const wrongWordSet = new Set();
      (grammarMatches || []).forEach(m => {
        (m.wrong || "").toLowerCase().split(/\s+/).forEach(w => wrongWordSet.add(normalizeText(w)));
      });

      const hardRedSet = new Set(["sabo", "poni", "poní", "teni", "tení", "haci", "hací", "the", "and", "with", "what", "where", "because"]);

      return origWords.map((w, idx) => {
        const norm = normalizeText(w);
        const alignedCorr = corrWords[idx] || w;

        if (hardRedSet.has(norm)) {
          return {
            word: w,
            status: "red",
            label: "Bad / Fix",
            score: 45,
            reason: `Grammar/Language error on "${w}" — use Spanish "${alignedCorr}".`
          };
        }

        if (wrongWordSet.has(norm)) {
          return {
            word: w,
            status: "yellow",
            label: "Medium",
            score: 74,
            reason: `Understandable, but "${w}" needs a grammar or agreement adjustment.`
          };
        }

        // Check if accent was missing compared to corrected word
        const cleanOrig = w.replace(/[¿?¡!.,;:"]/g, "").toLowerCase();
        const cleanCorr = alignedCorr.toLowerCase();
        if (cleanOrig !== cleanCorr && normalizeText(cleanOrig) === normalizeText(cleanCorr)) {
          return {
            word: w,
            status: "yellow",
            label: "Medium (Accent)",
            score: 80,
            reason: `Good sound! Written with an accent mark: "${alignedCorr}".`
          };
        }

        if (baseConf >= 0.80) {
          return {
            word: w,
            status: "green",
            label: "Perfect",
            score: Math.min(99, Math.round(baseConf * 100) + 4),
            reason: "Perfect pronunciation & grammar!"
          };
        }

        if (baseConf >= 0.65) {
          return {
            word: w,
            status: "yellow",
            label: "Medium",
            score: Math.round(baseConf * 100),
            reason: "Medium pronunciation — slight slur or hesitation detected."
          };
        }

        return {
          word: w,
          status: "red",
          label: "Needs Work",
          score: Math.round(baseConf * 100),
          reason: "Unclear pronunciation — tap to hear native speaker."
        };
      });
    }

    // Complete Live Analyzer: Pronunciation (Green/Yellow/Red) + Grammar + Punctuation + Conversational AI Reply
    async function analyzeFreeSpeechAndCorrect(spokenEs, confidence, dialectCode, turnCount = 0) {
      const cleanSpoken = (spokenEs || "").trim();
      const d = DIALECTS[dialectCode] || DIALECTS["es-CU"];
      let workingCorrected = cleanSpoken;
      const explanations = [];

      // 1. Local Instant Grammar Rules
      GRAMMAR_RULES.forEach(rule => {
        const match = workingCorrected.match(rule.regex);
        if (match) {
          const wrongText = match[0];
          workingCorrected = workingCorrected.replace(rule.regex, rule.replacement);
          explanations.push({ wrong: wrongText, right: rule.replacement, reason: rule.reason });
        }
      });

      // 2. Fast LanguageTool Grammar Check (1.5s timeout so it never hangs)
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 1500);
        const params = new URLSearchParams();
        params.append("text", workingCorrected);
        params.append("language", "es");
        const ltRes = await fetch("https://api.languagetool.org/v2/check", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          signal: controller.signal,
          body: params.toString()
        });
        clearTimeout(timer);
        if (ltRes.ok) {
          const ltData = await ltRes.json();
          if (ltData && Array.isArray(ltData.matches)) {
            const validMatches = ltData.matches.filter(m =>
              m.replacements && m.replacements.length > 0 && m.rule &&
              m.rule.issueType !== "typographical" && m.rule.id !== "UPPERCASE_SENTENCE_START"
            );
            validMatches.slice(0, 3).forEach(m => {
              const wrongFrag = workingCorrected.substr(m.offset, m.length);
              const bestRep = m.replacements[0].value;
              if (normalizeText(wrongFrag) !== normalizeText(bestRep)) {
                explanations.push({ wrong: wrongFrag, right: bestRep, reason: m.message || "Spanish grammar fix" });
              }
            });
            validMatches
              .sort((a, b) => b.offset - a.offset)
              .forEach(m => {
                const bestRep = m.replacements[0].value;
                workingCorrected = workingCorrected.slice(0, m.offset) + bestRep + workingCorrected.slice(m.offset + m.length);
              });
          }
        }
      } catch (e) {}

      // 3. Restore Spanish Punctuation & Accents
      const punctuatedCorrected = restoreSpanishPunctuation(workingCorrected);
      const punctuationChanged = punctuatedCorrected !== cleanSpoken;

      // 4. English Translation + Conversational AI Reply in Parallel
      let englishMeaning = "";
      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=${encodeURIComponent(punctuatedCorrected)}`;
        const gtxRes = await fetch(gtxUrl);
        const gtxData = await gtxRes.json();
        if (gtxData && gtxData[0]) {
          englishMeaning = gtxData[0].map(seg => seg[0]).join("");
        }
      } catch (e) {
        englishMeaning = "Spoken Spanish phrase";
      }

      const wordBreakdown = gradeFreeSpeechWords(cleanSpoken, punctuatedCorrected, confidence, explanations);
      const avgPronunciationScore = wordBreakdown.length
        ? Math.round(wordBreakdown.reduce((acc, w) => acc + w.score, 0) / wordBreakdown.length)
        : 0;

      const aiReply = await generateContextualTutorReply(punctuatedCorrected, englishMeaning, dialectCode, turnCount);

      return {
        originalEs: cleanSpoken,
        correctedEs: punctuatedCorrected,
        isGrammarPerfect: explanations.length === 0,
        punctuationChanged,
        explanations,
        englishMeaning,
        wordBreakdown,
        avgPronunciationScore,
        aiReply
      };
    }

    function looksLikeSpanish(text) {
      const raw = (text || "").trim().toLowerCase();
      if (/[áéíóúñü¿¡]/.test(raw)) return true;
      const tokens = raw.split(/\s+/);
      const spanishMarkers = new Set([
        "el", "la", "los", "las", "un", "una", "yo", "tu", "usted", "que", "como", "donde",
        "cuando", "porque", "para", "por", "con", "sin", "hola", "gracias", "perro", "gato",
        "agua", "casa", "carro", "trabajo", "amigo", "dinero", "comida", "mierda", "puta",
        "carajo", "coño", "pinga", "singar", "comemierda", "chingar", "verga", "pendejo",
        "cabron", "gonorrea", "joder", "hostia", "gilipollas", "boludo", "pelotudo", "asere"
      ]);
      return tokens.some(t => spanishMarkers.has(normalizeText(t)));
    }

    function buildDynamicDialectBreakdown(esText, enText) {
      const cleanEs = esText.split("/")[0].trim();
      const cleanEn = enText.split("/")[0].trim();
      return {
        "es-CU": { term: `${cleanEs} (a lo cubano)`, exEs: `Oye asere, "${cleanEs}" está en talla, no cojas lucha.`, exEn: `Hey bro, "${cleanEn}" is all good, don't stress.` },
        "es-MX": { term: `${cleanEs} (en México)`, exEs: `No mames carnal, lo de "${cleanEs}" está bien chingón.`, exEn: `No way bro, "${cleanEn}" is super badass.` },
        "es-CO": { term: `${cleanEs} (en Colombia)`, exEs: `Quiubo parcero, "${cleanEs}" es una chimba total.`, exEn: `What's up bro, "${cleanEn}" is totally awesome.` },
        "es-ES": { term: `${cleanEs} (en España)`, exEs: `Joder tío, lo de "${cleanEs}" está de puta madre.`, exEn: `Damn man, "${cleanEn}" is fucking awesome.` },
        "es-AR": { term: `${cleanEs} (en Argentina)`, exEs: `Che boludo, "${cleanEs}" está re copado mal.`, exEn: `Hey dude, "${cleanEn}" is super cool.` }
      };
    }

    async function autoTranslateWordOrPhrase(rawInput, forcedSourceLang = null) {
      const cleanInput = rawInput.trim();
      const normInput = normalizeText(cleanInput);

      if (!forcedSourceLang) {
        for (const item of MULTI_DIALECT_LEXICON) {
          if (item.keysEn.map(normalizeText).includes(normInput)) {
            return { sourceLang: "en", targetLang: "es", isCurse: item.isCurse, es: item.es, en: item.en, exEs: item.exEs, exEn: item.exEn, byDialect: item.byDialect };
          }
          if (item.keysEs.map(normalizeText).includes(normInput)) {
            return { sourceLang: "es", targetLang: "en", isCurse: item.isCurse, es: item.es, en: item.en, exEs: item.exEs, exEn: item.exEn, byDialect: item.byDialect };
          }
        }
      }

      try {
        let sourceLang = forcedSourceLang;
        if (!sourceLang) {
          const probeUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q=${encodeURIComponent(cleanInput)}`;
          const probeRes = await fetch(probeUrl);
          const probeData = await probeRes.json();
          const detectedCode = (probeData && probeData[2]) ? String(probeData[2]).toLowerCase() : "en";
          const esCandidate = (probeData && probeData[0]) ? probeData[0].map(seg => seg[0]).join("") : "";

          if (detectedCode.startsWith("es") || looksLikeSpanish(cleanInput) || normalizeText(esCandidate) === normInput) {
            sourceLang = "es";
          } else {
            return {
              sourceLang: "en",
              targetLang: "es",
              isCurse: false,
              es: esCandidate,
              en: cleanInput,
              byDialect: buildDynamicDialectBreakdown(esCandidate, cleanInput)
            };
          }
        }

        const targetLang = sourceLang === "es" ? "en" : "es";
        const transUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(cleanInput)}`;
        const transRes = await fetch(transUrl);
        const transData = await transRes.json();
        const translatedText = (transData && transData[0]) ? transData[0].map(seg => seg[0]).join("") : cleanInput;

        const finalEs = sourceLang === "es" ? cleanInput : translatedText;
        const finalEn = sourceLang === "en" ? cleanInput : translatedText;

        return {
          sourceLang,
          targetLang,
          isCurse: false,
          es: finalEs,
          en: finalEn,
          byDialect: buildDynamicDialectBreakdown(finalEs, finalEn)
        };
      } catch (err) {
        const sourceLang = forcedSourceLang || (looksLikeSpanish(cleanInput) ? "es" : "en");
        return {
          sourceLang,
          targetLang: sourceLang === "es" ? "en" : "es",
          isCurse: false,
          es: cleanInput,
          en: `${cleanInput} (Offline)`,
          byDialect: buildDynamicDialectBreakdown(cleanInput, cleanInput)
        };
      }
    }

      const [xrayWord, setXrayWord] = useState(null);
      const [xrayLoading, setXrayLoading] = useState(false);

      // Free Speaking AI State
      const [activeMissionId, setActiveMissionId] = useState("free");
      const [completedGoals, setCompletedGoals] = useState({});
      const [freeAiAnalyzing, setFreeAiAnalyzing] = useState(false);
      const [freeAiInput, setFreeAiInput] = useState("");
      const [selectedFreeWord, setSelectedFreeWord] = useState(null);
      const [freeSessionTurns, setFreeSessionTurns] = useState(() => [
        {
          id: "welcome",
          role: "ai",
          es: DIALECTS["es-CU"].greeting,
          en: "What's up, bro! I'm Yordanis. Introduce yourself or tell me how your day is going to start chatting."
        }
      ]);

      // SRS State
      const [cardIdx, setCardIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [cardEval, setCardEval] = useState(null);
      const [srsFilterDue, setSrsFilterDue] = useState(false);

      // Translator State
      const [searchQuery, setSearchQuery] = useState("");
      const [isTranslating, setIsTranslating] = useState(false);
      const [dictResult, setDictResult] = useState(null);
      const [slangFilter, setSlangFilter] = useState("ALL");

      const activeRecognitionRef = useRef(null);
      const chatBottomRef = useRef(null);

      useEffect(() => {
        localStorage.setItem("vozzy_stats_v6", JSON.stringify(stats));
      }, [stats]);

      useEffect(() => {
        localStorage.setItem("vozzy_drills_v6", JSON.stringify(drills));
      }, [drills]);

      useEffect(() => {
        localStorage.setItem("vozzy_cards_v6", JSON.stringify(cards));
      }, [cards]);

      useEffect(() => {
        const loadVoices = () => {
          if ("speechSynthesis" in window) {
            const available = window.speechSynthesis.getVoices();
            if (available.length) setVoices(available);
          }
        };
        loadVoices();
        if ("speechSynthesis" in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      }, []);

      useEffect(() => {
        if (chatBottomRef.current) {
          chatBottomRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [freeSessionTurns, isRecording, freeAiAnalyzing]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3200);
      };

      const awardXp = (amount, label) => {
        const today = new Date().toISOString().slice(0, 10);
        setStats(prev => {
          const isNewDay = prev.lastDate !== today;
          const newStreak = isNewDay ? prev.streak + 1 : prev.streak;
          return {
            xp: prev.xp + amount,
            dailyXp: (isNewDay ? 0 : prev.dailyXp) + amount,
            streak: newStreak,
            lastDate: today
          };
        });
        showToast(`⚡ +${amount} XP! ${label || ""}`);
      };

      const cycleSpeedLadder = () => {
        if (speechRate === 1.0) setSpeechRate(1.25);
        else if (speechRate === 1.25) setSpeechRate(0.75);
        else setSpeechRate(1.0);
      };

      // Reliable Mobile Text-to-Speech (Waits for mic release so Android never mutes the reply!)
      const speakSpanish = (text, targetLangCode = null, onEndCallback = null) => {
        if (!("speechSynthesis" in window) || !text) {
          if (onEndCallback) onEndCallback();
          return;
        }
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();
        } catch (e) {}

        setTimeout(() => {
          const langToUse = targetLangCode || dialect;
          const u = new SpeechSynthesisUtterance(text);
          u.lang = langToUse;
          u.rate = speechRate;

          const currentVoices = window.speechSynthesis.getVoices();
          const pool = currentVoices.length ? currentVoices : voices;
          const exactVoice = pool.find(v => v.lang.replace("_", "-").toLowerCase() === langToUse.toLowerCase());
          const localSpanish = pool.find(v => v.lang.toLowerCase().startsWith("es") && v.localService);
          const anySpanish = pool.find(v => v.lang.toLowerCase().startsWith("es"));

          if (exactVoice) u.voice = exactVoice;
          else if (localSpanish) u.voice = localSpanish;
          else if (anySpanish) u.voice = anySpanish;

          u.onstart = () => setIsAiSpeaking(true);
          u.onend = () => {
            setIsAiSpeaking(false);
            if (onEndCallback) onEndCallback();
          };
          u.onerror = () => {
            setIsAiSpeaking(false);
            if (onEndCallback) onEndCallback();
          };

          window.speechSynthesis.speak(u);
        }, 280);
      };

      // Tap-Any-Word Instant X-Ray
      const inspectWordXray = async (rawToken) => {
        const cleaned = (rawToken || "").replace(/[¿?¡!.,;:"()]/g, "").trim();
        if (!cleaned) return;
        setXrayLoading(true);
        setXrayWord({
          word: cleaned,
          phonetic: generatePhoneticGuide(cleaned, dialect),
          en: "Translating...",
          exEs: "",
          exEn: ""
        });
        speakSpanish(cleaned, dialect);

        const res = await autoTranslateWordOrPhrase(cleaned, "es");
        const dEntry = res.byDialect && res.byDialect[dialect];
        setXrayWord({
          word: cleaned,
          phonetic: generatePhoneticGuide(cleaned, dialect),
          en: res.en,
          exEs: dEntry ? dEntry.exEs : `Quiero usar "${cleaned}" en una oración.`,
          exEn: dEntry ? dEntry.exEn : `I want to use "${res.en}" in a sentence.`
        });
        setXrayLoading(false);
      };

      const renderClickableSpanish = (sentence, textClass = "text-lg font-bold text-emerald-400") => {
        const tokens = (sentence || "").split(/\s+/).filter(Boolean);
        return (
          <div className="space-y-1">
            <div className="flex flex-wrap gap-x-1.5 gap-y-1">
              {tokens.map((tok, i) => (
                <span
                  key={i}
                  onClick={(e) => {
                    e.stopPropagation();
                    inspectWordXray(tok);
                  }}
                  className={`${textClass} underline decoration-dotted decoration-purple-400/60 underline-offset-4 cursor-pointer hover:text-purple-300`}
                >
                  {tok}
                </span>
              ))}
            </div>
            {showPhonetics && (
              <p className="text-[11px] font-mono text-amber-300/90">
                🗣️ [{generatePhoneticGuide(sentence, dialect)}]
              </p>
            )}
          </div>
        );
      };

      // FIXED Real-Time Voice Listener (Uses mutable ref-safe variables so interim speech is NEVER lost!)
      const listenVoiceRealtime = (onFinalTranscript) => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert("Speech recognition requires Chrome, Samsung Internet, Edge, or Safari.");
          return;
        }

        // If already recording, stopping it will trigger onend and submit what was spoken!
        if (isRecording && activeRecognitionRef.current) {
          try {
            activeRecognitionRef.current.stop();
          } catch (e) {}
          return;
        }

        // Unlock mobile audio synthesis during user tap gesture
        try {
          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();
          }
        } catch (e) {}

        const rec = new SpeechRec();
        activeRecognitionRef.current = rec;
        rec.lang = dialect;
        rec.interimResults = true;
        rec.continuous = false;
        rec.maxAlternatives = 1;

        setIsRecording(true);
        setLiveInterimText("");

        let capturedFinal = "";
        let capturedInterim = "";
        let bestConfidence = 0.88;
        let hasSubmitted = false;

        rec.onresult = (e) => {
          let currentInterim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const seg = e.results[i][0].transcript;
            if (e.results[i].isFinal) {
              capturedFinal += seg + " ";
              if (e.results[i][0].confidence) {
                bestConfidence = e.results[i][0].confidence;
              }
            } else {
              currentInterim += seg;
            }
          }
          capturedInterim = currentInterim;
          const combined = (capturedFinal + currentInterim).trim();
          setLiveInterimText(combined);
        };

        rec.onerror = () => {
          setIsRecording(false);
          const fallbackText = (capturedFinal + " " + capturedInterim).trim();
          if (fallbackText && !hasSubmitted) {
            hasSubmitted = true;
            setLiveInterimText("");
            onFinalTranscript(fallbackText, bestConfidence);
          }
        };

        rec.onend = () => {
          setIsRecording(false);
          activeRecognitionRef.current = null;
          const completedText = (capturedFinal + " " + capturedInterim).trim();
          setLiveInterimText("");
          if (completedText && !hasSubmitted) {
            hasSubmitted = true;
            onFinalTranscript(completedText, bestConfidence);
          }
        };

        try {
          rec.start();
        } catch (err) {
          setIsRecording(false);
        }
      };

      const currentDrill = drills[activeDrillIdx] || drills[0];
      const currentVar = currentDrill.variations[varIdx] || currentDrill.variations[0];

      const advanceDrill = (fromAutoLoop = false) => {
        setEvalResult(null);
        setSpokenText("");
        let nextVarIdx = varIdx;

        if (stage < 3) {
          setStage(stage + 1);
        } else {
          setStage(1);
          if (varIdx + 1 < currentDrill.variations.length) {
            nextVarIdx = varIdx + 1;
            setVarIdx(nextVarIdx);
          } else {
            nextVarIdx = 0;
            setVarIdx(0);
            awardXp(50, "Unit Mastered Bonus!");
          }
        }

        if (fromAutoLoop || autoCoachLoop) {
          const nextVariation = currentDrill.variations[nextVarIdx] || currentDrill.variations[0];
          setTimeout(() => {
            speakSpanish(nextVariation.es, dialect, () => {
              setTimeout(() => handleDrillMic(nextVariation.es), 400);
            });
          }, 500);
        }
      };

      const handleDrillMic = (overrideExpectedEs = null) => {
        const targetEs = overrideExpectedEs || currentVar.es;
        listenVoiceRealtime((transcript) => {
          setSpokenText(transcript);
          const res = scorePronunciation(targetEs, transcript);
          setEvalResult(res);
          if (res.score >= 85) {
            awardXp(25, "Passed Pronunciation Gate!");
            if (autoCoachLoop) {
              speakSpanish("¡Excelente! Seguimos.", dialect, () => advanceDrill(true));
            } else {
              speakSpanish("¡Excelente!");
            }
          }
        });
      };

      const currentMission = SCENARIO_MISSIONS.find(m => m.id === activeMissionId) || SCENARIO_MISSIONS[0];

      const selectMission = (mission) => {
        setActiveMissionId(mission.id);
        setFreeSessionTurns([
          {
            id: "m_" + Date.now(),
            role: "ai",
            es: mission.starterEs,
            en: mission.starterEn
          }
        ]);
        speakSpanish(mission.starterEs, dialect);
      };

      // Process Free Speaking Turn -> Show Green/Yellow/Red Pills + Grammar/Punctuation Fix + Speak AI Reply Out Loud!
      const processFreeSpeechTurn = async (rawSpokenText, confidenceScore = 0.9) => {
        const text = (rawSpokenText || "").trim();
        if (!text) return;
        setFreeAiAnalyzing(true);
        setSelectedFreeWord(null);

        const newlyChecked = { ...completedGoals };
        let goalJustHit = false;
        currentMission.goals.forEach(g => {
          const key = `${currentMission.id}_${g.id}`;
          if (!newlyChecked[key] && g.check(text)) {
            newlyChecked[key] = true;
            goalJustHit = true;
          }
        });
        if (goalJustHit) setCompletedGoals(newlyChecked);

        const analysis = await analyzeFreeSpeechAndCorrect(
          text,
          confidenceScore,
          dialect,
          freeSessionTurns.length
        );

        const userTurn = { id: "u_" + Date.now(), role: "user", analysis };
        const aiTurn = {
          id: "ai_" + (Date.now() + 1),
          role: "ai",
          es: analysis.aiReply.es,
          en: analysis.aiReply.en
        };

        setFreeSessionTurns(prev => [...prev, userTurn, aiTurn]);
        setFreeAiInput("");
        setFreeAiAnalyzing(false);

        awardXp(goalJustHit ? 35 : 20, goalJustHit ? "Mission Goal Completed! 🎯" : "Graded & Replied!");

        // Speak the AI Tutor's reply out loud automatically!
        speakSpanish(analysis.aiReply.es, dialect, () => {
          if (handsFreeCallMode) {
            setTimeout(() => {
              listenVoiceRealtime((nextText, nextConf) => processFreeSpeechTurn(nextText, nextConf));
            }, 450);
          }
        });
      };

      const now = Date.now();
      const dueCards = cards.filter(c => (c.nextReview || 0) <= now);
      const activeDeck = srsFilterDue && dueCards.length > 0 ? dueCards : cards;
      const currentCard = activeDeck[cardIdx % activeDeck.length] || cards[0];

      const rateCardSRS = (cardId, difficulty) => {
        setCards(prev =>
          prev.map(c => {
            if (c.id !== cardId) return c;
            let newBox = c.box || 1;
            if (difficulty === "hard") newBox = 1;
            else if (difficulty === "good") newBox = Math.min(5, newBox + 1);
            else if (difficulty === "easy") newBox = Math.min(5, newBox + 2);
            const interval = SRS_INTERVALS[newBox] || 0;
            return { ...c, box: newBox, nextReview: Date.now() + interval, reps: (c.reps || 0) + 1 };
          })
        );
        awardXp(difficulty === "easy" ? 20 : 15, "SRS Box Updated!");
        setFlipped(false);
        setCardEval(null);
        setCardIdx((prev) => (prev + 1) % Math.max(1, activeDeck.length));
      };

      const runTranslation = async (rawQuery, forcedSourceLang = null) => {
        const cleanQ = rawQuery.trim();
        if (!cleanQ) return;
        setIsTranslating(true);
        const translated = await autoTranslateWordOrPhrase(cleanQ, forcedSourceLang);
        const resultObj = {
          query: cleanQ,
          sourceLang: translated.sourceLang,
          targetLang: translated.targetLang,
          isCurse: translated.isCurse,
          es: translated.es,
          en: translated.en,
          byDialect: translated.byDialect || buildDynamicDialectBreakdown(translated.es, translated.en)
        };
        setDictResult(resultObj);
        setIsTranslating(false);
        speakSpanish(resultObj.es, dialect);
        awardXp(10, "Translated & Spoken!");
      };

      const handleSearch = (e) => {
        e.preventDefault();
        runTranslation(searchQuery, null);
      };

      const addWordToFlashcards = (esText, enText, exEs, exEn, tag = "📖 Coach") => {
        const newCard = {
          id: "c_" + Date.now(),
          es: esText,
          en: enText,
          exEs: exEs || `Ejemplo con ${esText}.`,
          exEn: exEn || `Example with ${enText}.`,
          tag,
          box: 1,
          nextReview: 0,
          reps: 0
        };
        setCards([newCard, ...cards]);
        awardXp(15, "Saved to SRS Flashcards!");
      };

      const addWordToDrills = (esText, enText, exEs, exEn) => {
        const cleanPhrase = esText.split("/")[0].replace(/\(.*?\)/g, "").trim();
        const targetSentence = exEs || cleanPhrase;
        const words = targetSentence.split(" ");
        const clozeSentence = words.map((w, i) => (i % 2 === 1 ? "___" : w)).join(" ");
        const newDrill = {
          id: "d_" + Date.now(),
          title: `Drill: ${cleanPhrase.slice(0, 22)}`,
          pattern: cleanPhrase,
          variations: [
            { en: enText || "Say this in Spanish", es: cleanPhrase, cloze: "___" },
            { en: exEn || `Practice: ${enText}`, es: targetSentence, cloze: clozeSentence }
          ]
        };
        setDrills([newDrill, ...drills]);
        setActiveDrillIdx(0);
        setVarIdx(0);
        setStage(1);
        awardXp(15, "Added to Speaking Drills!");
      };

      const triggerGlobalQuickMic = () => {
        if (activeTab === "drills") {
          handleDrillMic();
        } else if (activeTab === "freeai") {
          listenVoiceRealtime((text, conf) => processFreeSpeechTurn(text, conf));
        } else if (activeTab === "cards" && currentCard) {
          listenVoiceRealtime((t) => {
            const res = scorePronunciation(currentCard.es, t);
            setCardEval({ spoken: t, score: res.score, breakdown: res.breakdown });
            setFlipped(true);
            if (res.score >= 85) rateCardSRS(currentCard.id, "good");
          });
        } else if (activeTab === "dict") {
          listenVoiceRealtime((t) => {
            setSearchQuery(t);
            runTranslation(t, null);
          });
        }
      };

      const levelInfo = getLevelTitle(stats.xp);
      const dailyProgressPct = Math.min(100, Math.round((stats.dailyXp / 100) * 100));

      const getPillColorClasses = (status) => {
        if (status === "green") return "bg-emerald-950/90 text-emerald-300 border-emerald-500/80";
        if (status === "yellow") return "bg-amber-950/90 text-amber-300 border-amber-500/80";
        return "bg-rose-950/90 text-rose-300 border-rose-500/80";
      };

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 pb-28 max-w-md mx-auto px-3.5 pt-3 select-none">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-4 py-2 rounded-full shadow-xl text-xs font-extrabold flex items-center gap-2 animate-bounce">
              {toast}
            </div>
          )}

          {/* TAP-ANY-WORD INSTANT X-RAY MODAL */}
          {xrayWord && (
            <div
              onClick={() => setXrayWord(null)}
              className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center p-3"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-md bg-slate-900 border-2 border-purple-500 rounded-3xl p-4 space-y-3 shadow-2xl"
              >
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase text-purple-400">
                      🔍 Instant Word X-Ray ({DIALECTS[dialect].flag} {DIALECTS[dialect].short})
                    </span>
                    <h3 className="text-2xl font-extrabold text-white">{xrayWord.word}</h3>
                    <p className="text-xs font-mono text-amber-300">
                      🗣️ Sounds like: [{xrayWord.phonetic}]
                    </p>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => speakSpanish(xrayWord.word, dialect)}
                      className="px-3 py-2 bg-purple-600 text-white rounded-xl text-xs font-extrabold"
                    >
                      🔊 Hear
                    </button>
                    <button
                      onClick={() => setXrayWord(null)}
                      className="px-2.5 py-2 bg-slate-800 text-slate-400 rounded-xl text-xs font-bold"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                <div className="bg-slate-950 rounded-2xl p-3 border border-slate-800 space-y-1">
                  <span className="text-[10px] uppercase font-bold text-blue-400">🇺🇸 Meaning</span>
                  <p className="text-base font-bold text-white">
                    {xrayLoading ? "Translating..." : xrayWord.en}
                  </p>
                  {xrayWord.exEs && (
                    <div className="pt-1.5 border-t border-slate-800/80 text-xs">
                      <p className="text-emerald-300 font-semibold">"{xrayWord.exEs}"</p>
                      <p className="text-slate-400">"{xrayWord.exEn}"</p>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => {
                      addWordToDrills(xrayWord.word, xrayWord.en, xrayWord.exEs, xrayWord.exEn);
                      setXrayWord(null);
                    }}
                    className="py-2.5 bg-purple-600/25 border border-purple-500 text-purple-200 rounded-xl text-xs font-extrabold"
                  >
                    + Add to Drills
                  </button>
                  <button
                    onClick={() => {
                      addWordToFlashcards(xrayWord.word, xrayWord.en, xrayWord.exEs, xrayWord.exEn, "🔍 X-Ray");
                      setXrayWord(null);
                    }}
                    className="py-2.5 bg-blue-600/25 border border-blue-500 text-blue-200 rounded-xl text-xs font-extrabold"
                  >
                    + Save to SRS Cards
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Header */}
          <div className="bg-slate-900/95 border border-slate-800 rounded-2xl p-3 mb-3 space-y-2 shadow-lg">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-xl shadow-lg shadow-purple-600/30">
                  🎙️
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-extrabold text-base tracking-tight">Vozzy</span>
                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
                      🔥 {stats.streak}d
                    </span>
                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-purple-950 text-purple-300 border border-purple-700/50">
                      Lvl {levelInfo.lvl}
                    </span>
                  </div>
                  <p className="text-[10px] text-slate-400 mt-0.5">
                    {isAiSpeaking ? "🔊 Tutor Speaking Out Loud..." : "🟢 Perfect • 🟡 Medium • 🔴 Bad"}
                  </p>
                </div>
              </div>

              <div className="flex flex-col items-end gap-1">
                <select
                  value={dialect}
                  onChange={(e) => setDialect(e.target.value)}
                  className="bg-slate-800 text-[11px] font-bold rounded-xl px-2 py-1.5 border border-slate-700 text-slate-200 outline-none"
                >
                  {Object.entries(DIALECTS).map(([code, d]) => (
                    <option key={code} value={code}>
                      {d.flag} {d.short} ({d.tutor})
                    </option>
                  ))}
                </select>

                <div className="flex items-center gap-1">
                  <button
                    onClick={() => setShowPhonetics(!showPhonetics)}
                    className={`text-[10px] font-bold px-2 py-0.5 rounded-lg border ${
                      showPhonetics ? "bg-purple-600/20 border-purple-500 text-purple-200" : "bg-slate-800 border-slate-700 text-slate-400"
                    }`}
                  >
                    🗣️ Phonetics
                  </button>
                  <button
                    onClick={cycleSpeedLadder}
                    className={`text-[10px] font-bold px-2 py-0.5 rounded-lg border ${
                      speechRate === 0.75
                        ? "bg-amber-500/20 border-amber-500 text-amber-300"
                        : speechRate === 1.25
                        ? "bg-rose-500/20 border-rose-500 text-rose-300"
                        : "bg-slate-800 border-slate-700 text-slate-300"
                    }`}
                  >
                    {speechRate === 0.75 ? "🐢 0.75x" : speechRate === 1.25 ? "🔥 1.25x" : "⚡ 1.0x"}
                  </button>
                </div>
              </div>
            </div>

            <div className="bg-slate-950 rounded-xl p-2 border border-slate-800/80">
              <div className="flex justify-between text-[11px] font-bold mb-1">
                <span className="text-slate-300">🎯 Daily Goal: {stats.dailyXp} / 100 XP</span>
                <span className="text-purple-400">Total: {stats.xp} XP</span>
              </div>
              <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                <div
                  className="h-full bg-gradient-to-r from-purple-500 to-emerald-400 transition-all duration-300"
                  style={{ width: `${dailyProgressPct}%` }}
                />
              </div>
            </div>
          </div>

          {/* TAB 1: SPEAKING DRILLS */}
          {activeTab === "drills" && (
            <div className="space-y-3.5">
              <div className="flex items-center justify-between gap-2">
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                  {drills.map((d, idx) => (
                    <button
                      key={d.id}
                      onClick={() => { setActiveDrillIdx(idx); setVarIdx(0); setStage(1); setEvalResult(null); }}
                      className={`whitespace-nowrap px-3 py-1.5 rounded-xl text-xs font-bold border ${
                        activeDrillIdx === idx ? "bg-purple-600/20 border-purple-500 text-purple-200" : "bg-slate-900 border-slate-800 text-slate-400"
                      }`}
                    >
                      {idx + 1}. {d.title}
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => {
                    const nextState = !autoCoachLoop;
                    setAutoCoachLoop(nextState);
                    if (nextState) {
                      showToast("🔄 Auto-Loop ON!");
                      speakSpanish(currentVar.es, dialect, () => {
                        setTimeout(() => handleDrillMic(currentVar.es), 350);
                      });
                    }
                  }}
                  className={`shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold border ${
                    autoCoachLoop ? "bg-emerald-600 text-white border-emerald-400 animate-pulse" : "bg-slate-900 border-slate-800 text-slate-400"
                  }`}
                >
                  {autoCoachLoop ? "🔄 Loop ON" : "🔄 Auto-Loop"}
                </button>
              </div>

              <div className="grid grid-cols-3 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-xs font-bold">
                {[
                  { id: 1, label: "Stage 1: Guided" },
                  { id: 2, label: "Stage 2: Cloze" },
                  { id: 3, label: "Stage 3: Blind" }
                ].map((s) => (
                  <button
                    key={s.id}
                    onClick={() => { setStage(s.id); setEvalResult(null); }}
                    className={`py-2 rounded-xl ${stage === s.id ? "bg-purple-600 text-white" : "text-slate-400"}`}
                  >
                    {s.label}
                  </button>
                ))}
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
                <p className="text-[11px] uppercase tracking-wider text-purple-400 font-bold">
                  Variation {varIdx + 1} of {currentDrill.variations.length}
                </p>
                <h2 className="text-xl font-extrabold text-white">"{currentVar.en}"</h2>

                <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-4 my-2">
                  {stage === 1 && renderClickableSpanish(currentVar.es)}
                  {stage === 2 && <p className="text-lg font-bold text-amber-300">{currentVar.cloze}</p>}
                  {stage === 3 && <p className="text-sm font-bold text-amber-400">🙈 BLIND REFLEX MODE — Speak from memory!</p>}
                </div>

                {isRecording && (
                  <div className="bg-purple-950/40 border border-purple-500/60 rounded-2xl p-3 text-left animate-pulse">
                    <span className="text-[10px] font-extrabold uppercase text-purple-300 block mb-1">
                      🎙️ Hearing You Live:
                    </span>
                    <p className="text-sm font-extrabold text-white">{liveInterimText || "Speak now..."}</p>
                  </div>
                )}

                <div className="flex justify-center gap-2.5 pt-1">
                  <button
                    onClick={() => speakSpanish(currentVar.es)}
                    className="px-4 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xs font-extrabold"
                  >
                    🔊 Hear Native
                  </button>
                  <button
                    onClick={() => handleDrillMic()}
                    className={`px-5 py-3 rounded-2xl text-xs font-extrabold shadow-lg ${
                      isRecording ? "bg-emerald-600 text-white" : "bg-purple-600 text-white"
                    }`}
                  >
                    {isRecording ? "✅ Done / Grade" : "🎤 Tap & Speak"}
                  </button>
                </div>

                {evalResult && (
                  <div className="mt-4 pt-4 border-t border-slate-800 text-left space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-slate-400">Heard: "{spokenText}"</span>
                      <span className="text-xs font-extrabold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300">
                        {evalResult.score}% Score
                      </span>
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                      {evalResult.breakdown.map((b, i) => (
                        <button
                          key={i}
                          onClick={() => inspectWordXray(b.word)}
                          className={`px-2.5 py-1.5 rounded-xl text-xs font-extrabold border ${getPillColorClasses(b.status)}`}
                        >
                          {b.status === "green" ? "🟢" : b.status === "yellow" ? "🟡" : "🔴"} {b.word}
                        </button>
                      ))}
                    </div>
                    {evalResult.score >= 85 && (
                      <button
                        onClick={() => advanceDrill(false)}
                        className="w-full py-3 rounded-2xl bg-emerald-600 text-white font-extrabold text-sm"
                      >
                        ✅ Passed Gate! Continue →
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 2: LIVE CONVERSATIONAL FREE AI (SPEAKS BACK + GREEN/YELLOW/RED + GRAMMAR & PUNCTUATION) */}
          {activeTab === "freeai" && (
            <div className="space-y-2.5">
              {/* Top Mission Row + Hands-Free Call Mode Toggle */}
              <div className="flex items-center justify-between gap-2">
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                  {SCENARIO_MISSIONS.map((m) => (
                    <button
                      key={m.id}
                      onClick={() => selectMission(m)}
                      className={`whitespace-nowrap px-3 py-1.5 rounded-xl text-xs font-extrabold border transition ${
                        activeMissionId === m.id
                          ? "bg-purple-600 text-white border-purple-400 shadow"
                          : "bg-slate-900 border-slate-800 text-slate-400"
                      }`}
                    >
                      {m.title}
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => {
                    const next = !handsFreeCallMode;
                    setHandsFreeCallMode(next);
                    showToast(next ? "📞 Hands-Free Call Mode ON!" : "📞 Manual Mic Mode");
                  }}
                  className={`shrink-0 px-2.5 py-1.5 rounded-xl text-[11px] font-extrabold border ${
                    handsFreeCallMode
                      ? "bg-emerald-600 text-white border-emerald-400"
                      : "bg-slate-900 border-slate-800 text-slate-400"
                  }`}
                >
                  {handsFreeCallMode ? "📞 Auto-Mic ON" : "📞 Auto-Mic"}
                </button>
              </div>

              {/* Conversation & Real-Time Grading Feed */}
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-3.5 flex flex-col h-[62vh]">
                <div className="flex-1 overflow-y-auto space-y-3.5 pr-1">
                  {freeSessionTurns.map((turn) => {
                    if (turn.role === "ai") {
                      return (
                        <div key={turn.id} className="flex justify-start">
                          <div className="max-w-[92%] bg-slate-800/95 border border-purple-500/40 rounded-2xl p-3.5 space-y-1.5 shadow-md">
                            <div className="flex items-center justify-between">
                              <span className="text-[10px] font-extrabold text-purple-300 uppercase">
                                {DIALECTS[dialect].flag} {DIALECTS[dialect].tutor} • Live Tutor
                              </span>
                              <button
                                onClick={() => speakSpanish(turn.es, dialect)}
                                className="text-[11px] font-extrabold px-2.5 py-1 bg-purple-600 text-white rounded-lg"
                              >
                                🔊 Speak Again
                              </button>
                            </div>
                            {renderClickableSpanish(turn.es, "text-sm font-bold text-white")}
                            {turn.en && <p className="text-xs text-slate-400">{turn.en}</p>}
                          </div>
                        </div>
                      );
                    }

                    const a = turn.analysis;
                    return (
                      <div key={turn.id} className="space-y-2">
                        <div className="bg-slate-950 border border-emerald-500/40 rounded-2xl p-3.5 space-y-2.5">
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-extrabold uppercase text-slate-300">
                              🎤 Your Speech (🟢 Perfect • 🟡 Medium • 🔴 Bad)
                            </span>
                            <span className={`text-[11px] font-extrabold px-2 py-0.5 rounded-full ${
                              a.avgPronunciationScore >= 85
                                ? "bg-emerald-500/20 text-emerald-300"
                                : a.avgPronunciationScore >= 65
                                ? "bg-amber-500/20 text-amber-300"
                                : "bg-rose-500/20 text-rose-300"
                            }`}>
                              {a.avgPronunciationScore}% Score
                            </span>
                          </div>

                          {/* Color-Coded Word Pills */}
                          <div className="flex flex-wrap gap-1.5">
                            {a.wordBreakdown.map((wObj, idx) => (
                              <button
                                key={idx}
                                onClick={() => {
                                  speakSpanish(wObj.word, dialect);
                                  setSelectedFreeWord(wObj);
                                }}
                                className={`px-2.5 py-1 rounded-xl text-xs font-extrabold border transition ${getPillColorClasses(wObj.status)}`}
                              >
                                {wObj.status === "green" ? "🟢" : wObj.status === "yellow" ? "🟡" : "🔴"} {wObj.word}
                              </button>
                            ))}
                          </div>

                          {selectedFreeWord && (
                            <div className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-[11px] text-slate-300">
                              <b>"{selectedFreeWord.word}" ({selectedFreeWord.label}):</b> {selectedFreeWord.reason}
                            </div>
                          )}

                          {/* Grammar & Punctuation Correction Box */}
                          <div className={`p-3 rounded-xl border text-xs space-y-1.5 ${
                            a.isGrammarPerfect
                              ? "bg-emerald-950/30 border-emerald-700/50"
                              : "bg-amber-950/30 border-amber-600/60"
                          }`}>
                            <div className="flex items-center justify-between">
                              <span className="font-extrabold text-[11px] uppercase text-emerald-300">
                                {a.isGrammarPerfect
                                  ? "✅ Grammar & Punctuation:"
                                  : "🛠️ Grammar & Punctuation Correction:"}
                              </span>
                              <button
                                onClick={() => speakSpanish(a.correctedEs, dialect)}
                                className="text-[11px] font-extrabold text-emerald-300 bg-slate-900 px-2 py-0.5 rounded-lg"
                              >
                                🔊 Hear Correct
                              </button>
                            </div>

                            <p className="text-sm font-extrabold text-white">
                              "{a.correctedEs}"
                            </p>
                            <p className="text-[11px] text-slate-400">
                              🇺🇸 <i>"{a.englishMeaning}"</i>
                            </p>

                            {a.explanations.map((exp, i) => (
                              <div key={i} className="text-[11px] text-amber-200">
                                • <span className="line-through text-rose-400">{exp.wrong}</span> → <b className="text-emerald-300">{exp.right}</b> ({exp.reason})
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    );
                  })}

                  {/* LIVE REAL-TIME STREAMING BUBBLE WHILE USER IS SPEAKING */}
                  {isRecording && (
                    <div className="bg-purple-950/70 border-2 border-purple-400 rounded-2xl p-3.5 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-extrabold uppercase text-purple-200 animate-pulse">
                          🔴 Listening Live... (Pause or tap "✅ Done" to send)
                        </span>
                        <button
                          onClick={() => {
                            if (activeRecognitionRef.current) activeRecognitionRef.current.stop();
                          }}
                          className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-extrabold"
                        >
                          ✅ Done / Send
                        </button>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {(liveInterimText ? liveInterimText.split(/\s+/) : ["Speak", "now..."]).map((w, idx) => (
                          <span
                            key={idx}
                            className="px-2.5 py-1 rounded-xl text-xs font-extrabold bg-emerald-950 text-emerald-300 border border-emerald-500/60"
                          >
                            🟢 {w}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  {freeAiAnalyzing && (
                    <div className="text-xs text-purple-300 font-bold animate-pulse px-2">
                      ⚡ Grading pronunciation, fixing punctuation & generating {DIALECTS[dialect].tutor}'s voice reply...
                    </div>
                  )}
                  <div ref={chatBottomRef} />
                </div>

                {/* Bottom Voice & Text Bar */}
                <div className="pt-2.5 mt-2 border-t border-slate-800 space-y-2">
                  <div className="flex gap-2">
                    <button
                      onClick={() => listenVoiceRealtime((text, conf) => processFreeSpeechTurn(text, conf))}
                      className={`px-4 py-3 rounded-2xl font-extrabold text-xs flex items-center gap-1.5 shadow-lg shrink-0 ${
                        isRecording ? "bg-emerald-600 text-white" : "bg-purple-600 hover:bg-purple-500 text-white"
                      }`}
                    >
                      {isRecording ? "✅ Done / Send" : "🎤 Speak"}
                    </button>
                    <input
                      value={freeAiInput}
                      onChange={(e) => setFreeAiInput(e.target.value)}
                      placeholder="Or type (e.g. Hola me llamo Armando)..."
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-3 text-xs outline-none text-white"
                    />
                    <button
                      onClick={() => processFreeSpeechTurn(freeAiInput, 0.92)}
                      className="px-3.5 py-3 bg-emerald-600 rounded-2xl font-extrabold text-xs shrink-0"
                    >
                      Send
                    </button>
                  </div>

                  {/* Quick 1-Tap Conversation Starters */}
                  <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                    <span className="text-[10px] text-slate-400 font-bold shrink-0">Try saying:</span>
                    {[
                      "Hola me llamo Armando cómo estás",
                      "Yo gusto la comida cubana mucho",
                      "Hoy tuve mucho trabajo pero estoy en talla",
                      "Yo sabo que tenemos un problema buena"
                    ].map((sample, i) => (
                      <button
                        key={i}
                        onClick={() => processFreeSpeechTurn(sample, 0.90)}
                        className="text-[10px] font-bold px-2.5 py-1 rounded-full bg-slate-950 hover:bg-purple-950 text-slate-300 border border-slate-800 whitespace-nowrap shrink-0"
                      >
                        "{sample}"
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: SRS FLASHCARDS */}
          {activeTab === "cards" && currentCard && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
              <div className="flex justify-between items-center text-xs text-slate-400">
                <span className="px-2.5 py-1 rounded-full bg-slate-800 text-purple-300 font-bold">
                  {currentCard.tag}
                </span>
                <span className="px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-300 font-bold border border-amber-500/30">
                  SRS Box {currentCard.box || 1} / 5
                </span>
              </div>

              <div
                onClick={() => { setFlipped(!flipped); setCardEval(null); }}
                className="min-h-[180px] flex flex-col items-center justify-center bg-slate-950 border border-slate-800 rounded-2xl p-5 cursor-pointer"
              >
                {!flipped ? (
                  <>
                    <p className="text-xs uppercase text-slate-400 mb-2">Tap Card to Flip</p>
                    <h2 className="text-2xl font-extrabold text-white">{currentCard.en}</h2>
                  </>
                ) : (
                  <div className="space-y-2">
                    {renderClickableSpanish(currentCard.es, "text-2xl font-extrabold text-emerald-400")}
                    <p className="text-sm text-slate-200 pt-2 font-semibold">"{currentCard.exEs}"</p>
                    <p className="text-xs text-slate-400">"{currentCard.exEn}"</p>
                  </div>
                )}
              </div>

              <div className="grid grid-cols-3 gap-2 text-xs font-extrabold">
                <button onClick={() => rateCardSRS(currentCard.id, "hard")} className="py-2.5 rounded-xl bg-rose-950 border border-rose-700 text-rose-300">
                  🔴 Hard
                </button>
                <button onClick={() => rateCardSRS(currentCard.id, "good")} className="py-2.5 rounded-xl bg-amber-950 border border-amber-700 text-amber-300">
                  🟡 Good
                </button>
                <button onClick={() => rateCardSRS(currentCard.id, "easy")} className="py-2.5 rounded-xl bg-emerald-950 border border-emerald-700 text-emerald-300">
                  🟢 Easy
                </button>
              </div>
            </div>
          )}

          {/* TAB 4: ALL-DIALECTS UNCENSORED TRANSLATOR */}
          {activeTab === "dict" && (
            <div className="space-y-4">
              <form onSubmit={handleSearch} className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-bold text-purple-300 uppercase">
                    🌍 All-Dialects Translator (Speaks Back 🔊)
                  </label>
                  <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300">
                    🤬 18+ Uncensored
                  </span>
                </div>
                <div className="flex gap-2">
                  <input
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Type or speak ANY word or curse word..."
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm outline-none text-white"
                  />
                  <button
                    type="submit"
                    disabled={isTranslating}
                    className="bg-purple-600 px-4 py-2.5 rounded-2xl font-extrabold text-sm shrink-0"
                  >
                    {isTranslating ? "..." : "Translate"}
                  </button>
                </div>
              </form>

              {dictResult && (
                <div className="bg-slate-900 border border-purple-500/40 rounded-3xl p-4 space-y-3 shadow-xl">
                  <div className="bg-slate-950 border border-emerald-500/30 rounded-2xl p-3.5 flex justify-between items-center">
                    <div>
                      <span className="text-[10px] uppercase font-extrabold text-emerald-400 block">Spanish</span>
                      <h3 className="text-xl font-extrabold text-white">{dictResult.es}</h3>
                      <p className="text-xs text-blue-300 mt-1">🇺🇸 {dictResult.en}</p>
                    </div>
                    <button
                      onClick={() => speakSpanish(dictResult.es)}
                      className="px-3.5 py-2 bg-emerald-600/20 border border-emerald-500/50 text-emerald-300 rounded-xl text-xs font-extrabold"
                    >
                      🔊 Hear
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* THUMB-ZONE FIXED BOTTOM NAVIGATION DOCK */}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-3 py-2">
            <div className="max-w-md mx-auto grid grid-cols-5 items-center gap-1 text-[11px] font-extrabold">
              <button
                onClick={() => setActiveTab("drills")}
                className={`flex flex-col items-center py-1.5 rounded-xl ${activeTab === "drills" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">🎯</span>
                <span>Drills</span>
              </button>

              <button
                onClick={() => setActiveTab("freeai")}
                className={`flex flex-col items-center py-1.5 rounded-xl ${activeTab === "freeai" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">💬</span>
                <span>Free AI</span>
              </button>

              <div className="flex justify-center -mt-6">
                <button
                  onClick={triggerGlobalQuickMic}
                  className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-xl border-4 border-[#090d16] transition active:scale-95 ${
                    isRecording
                      ? "bg-emerald-600 text-white shadow-emerald-600/50"
                      : "bg-gradient-to-tr from-purple-600 to-emerald-500 text-white shadow-purple-600/40"
                  }`}
                >
                  {isRecording ? "✅" : "🎤"}
                </button>
              </div>

              <button
                onClick={() => setActiveTab("cards")}
                className={`flex flex-col items-center py-1.5 rounded-xl ${activeTab === "cards" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">🧠</span>
                <span>SRS ({dueCards.length})</span>
              </button>

              <button
                onClick={() => setActiveTab("dict")}
                className={`flex flex-col items-center py-1.5 rounded-xl ${activeTab === "dict" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">🌍</span>
                <span>Translator</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
