    function syllableToEnglishPhonetic(syl, dialectCode = "es-MX") {
      let s = (syl || "").toLowerCase();
      if (!s) return "";

      if (dialectCode === "es-CU") {
        s = s.replace(/s$/, "h");
      } else if (dialectCode === "es-AR") {
        s = s.replace(/ll/g, "sh").replace(/^y([aeiouáéíóú])/, "sh$1");
      } else if (dialectCode === "es-ES") {
        s = s.replace(/z/g, "th").replace(/ce/g, "the").replace(/ci/g, "thi");
      }

      s = s
        .replace(/^h/, "")
        .replace(/qu([eé])/g, "keh")
        .replace(/qu([ií])/g, "kee")
        .replace(/gue/g, "geh")
        .replace(/gui/g, "gee")
        .replace(/ch/g, "ch")
        .replace(/ll/g, "y")
        .replace(/ñ/g, "ny")
        .replace(/j/g, "h")
        .replace(/ge/g, "heh")
        .replace(/gi/g, "hee")
        .replace(/ce/g, "seh")
        .replace(/ci/g, "see")
        .replace(/z/g, "s")
        .replace(/v/g, "b")
        .replace(/c([aouáóú])/g, "k$1")
        .replace(/c([ptkbdg])/g, "k$1")
        .replace(/^c/, "k");

      s = s
        .replace(/[aá]/g, "ah")
        .replace(/[eé]/g, "eh")
        .replace(/[ií]/g, "ee")
        .replace(/[oó]/g, "oh")
        .replace(/[uú]/g, "oo")
        .replace(/ahah/g, "ah")
        .replace(/eheh/g, "eh")
        .replace(/ohoh/g, "oh");

      return s;
    }

    function splitSpanishWordIntoSyllables(rawWord, dialectCode = "es-MX") {
      const clean = (rawWord || "").replace(/[¿?¡!.,;:"()]/g, "").trim();
      if (!clean) return [];
      const lower = clean.toLowerCase();

      if (EXACT_PHONETIC_OVERRIDES[lower]) {
        return EXACT_PHONETIC_OVERRIDES[lower].map((item, idx) => ({
          ...item,
          id: `${lower}_${idx}`
        }));
      }

      const vowelRegex = /[aeiouáéíóúü]/i;
      const chunks = [];
      let current = "";

      for (let i = 0; i < lower.length; i++) {
        const ch = lower[i];
        current += ch;

        if (vowelRegex.test(ch)) {
          const next1 = lower[i + 1] || "";
          const next2 = lower[i + 2] || "";
          const next3 = lower[i + 3] || "";

          if (/[iuü]/.test(ch) && vowelRegex.test(next1)) continue;
          if (vowelRegex.test(ch) && /[iu]/.test(next1) && !/[íú]/.test(next1)) continue;

          if (!next1) {
            chunks.push(current);
            current = "";
          } else if (!vowelRegex.test(next1)) {
            const pair = next1 + next2;
            const inseparable = /^(ch|ll|rr|pl|pr|bl|br|cl|cr|dr|fl|fr|gl|gr|tr)$/;

            if (!next2) {
              current += next1;
              i++;
              chunks.push(current);
              current = "";
            } else if (vowelRegex.test(next2)) {
              chunks.push(current);
              current = "";
            } else if (inseparable.test(pair)) {
              chunks.push(current);
              current = "";
            } else if (!vowelRegex.test(next2) && vowelRegex.test(next3)) {
              current += next1;
              i++;
              chunks.push(current);
              current = "";
            }
          }
        }
      }
      if (current) {
        if (chunks.length > 0 && !vowelRegex.test(current)) {
          chunks[chunks.length - 1] += current;
        } else {
          chunks.push(current);
        }
      }

      let stressedIdx = chunks.findIndex(c => /[áéíóú]/.test(c));
      if (stressedIdx === -1) {
        if (chunks.length === 1) {
          stressedIdx = 0;
        } else if (/[aeiouáéíóúns]$/.test(lower)) {
          stressedIdx = Math.max(0, chunks.length - 2);
        } else {
          stressedIdx = chunks.length - 1;
        }
      }

      return chunks.map((syl, idx) => ({
        id: `${lower}_${idx}`,
        raw: syl,
        phon: syllableToEnglishPhonetic(syl, dialectCode),
        stressed: idx === stressedIdx && chunks.length > 1
      }));
    }

    function buildPhraseSyllableStructure(spanishSentence, dialectCode = "es-MX") {
      const rawWords = (spanishSentence || "")
        .replace(/[¿?¡!.,;:"()]/g, "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      let flatIndex = 0;
      const wordGroups = rawWords.map((w, wIdx) => {
        const syls = splitSpanishWordIntoSyllables(w, dialectCode).map(s => {
          const item = { ...s, globalIdx: flatIndex, wordIdx: wIdx, parentWord: w };
          flatIndex++;
          return item;
        });
        return { word: w, syllables: syls };
      });

      const allSyllables = wordGroups.flatMap(g => g.syllables);
      return { wordGroups, allSyllables };
    }

    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim();

    function isMostlyEnglishInput(text) {
      const tokens = normalizeText(text).split(/\s+/).filter(Boolean);
      if (!tokens.length) return false;
      const englishStopWords = new Set([
        "how", "do", "you", "say", "what", "is", "the", "word", "for", "example", "in", "spanish",
        "mean", "means", "can", "tell", "me", "i", "want", "to", "know", "need", "more",
        "practice", "proof", "hello", "hi", "my", "name", "good", "morning", "night",
        "where", "when", "why", "who", "this", "that", "it", "with", "from", "about", "if",
        "computer", "water", "coffee", "pot", "bro", "cool", "damn", "fuck", "shit"
      ]);
      let engCount = 0;
      tokens.forEach(t => {
        if (englishStopWords.has(t)) engCount++;
      });
      if (/^(how|what|can you|do you|i want|i need|tell me|where is|for example)\b/i.test(text.trim())) return true;
      if (tokens.length === 1 && englishStopWords.has(tokens[0])) return true;
      return (engCount / tokens.length) >= 0.45;
    }

    function generatePhoneticGuide(spanishText, dialectCode = "es-CU") {
      if (!spanishText) return "";
      const { wordGroups } = buildPhraseSyllableStructure(spanishText, dialectCode);

        .map(wg => wg.syllables.map(s => s.phon).join("-"))
        .join(" · ");

    function wordSimilarity(a, b) {
      const s1 = normalizeText(a);
      const s2 = normalizeText(b);
      if (!s1 || !s2) return 0;
      if (s1 === s2) return 100;
      const phoneticNorm = (w) => w.replace(/v/g, "b").replace(/z/g, "s").replace(/ll/g, "y").replace(/s$/, "");
      if (phoneticNorm(s1) === phoneticNorm(s2)) return 84;

      const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
      for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
      for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;
      for (let j = 1; j <= s2.length; j += 1) {
        for (let i = 1; i <= s1.length; i += 1) {
          const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
          track[j][i] = Math.min(
            track[j][i - 1] + 1,
            track[j - 1][i] + 1,
            track[j - 1][i - 1] + indicator
          );
        }
      }
      const distance = track[s2.length][s1.length];
      const maxLen = Math.max(s1.length, s2.length);
      return Math.round(((maxLen - distance) / maxLen) * 100);
    }

    function scorePronunciation(expected, spoken) {
      const expWords = (expected || "").trim().split(/\s+/).filter(Boolean);
      const spkWords = (spoken || "").trim().split(/\s+/).filter(Boolean);
      if (!spkWords.length) {
        return {
          score: 0,
          breakdown: expWords.map(w => ({ word: w, status: "red", sim: 0, note: "Not heard" }))
        };
      }
      let totalSim = 0;
      const breakdown = expWords.map((expW, idx) => {
        let bestSim = 0;
        let matchedSpk = "";
        spkWords.forEach((spkW, sIdx) => {
          const sim = wordSimilarity(expW, spkW);
          const posPenalty = Math.abs(idx - sIdx) > 3 ? 10 : 0;
          const adjSim = Math.max(0, sim - posPenalty);
          if (adjSim > bestSim) {
            bestSim = adjSim;
            matchedSpk = spkW;
          }
        });
        totalSim += bestSim;
        let status = "red";
        let note = matchedSpk ? `Heard "${matchedSpk}"` : "Missed word";
        if (bestSim >= 85) {
          status = "green";
          note = "Perfect pronunciation!";
        } else if (bestSim >= 65) {
          status = "yellow";
          note = `Medium ("${matchedSpk}")`;
        }
        return { word: expW, status, sim: bestSim, note };
      });
      const score = Math.round(totalSim / expWords.length);
      return { score, breakdown };
    }

    function buildMoreNaturalPhrasing(correctedSpanish, dialectCode, userTier) {
      const norm = normalizeText(correctedSpanish);
      const d = DIALECTS[dialectCode] || DIALECTS["es-CU"];
      const isBeginner = userTier.startsWith("A1");

      if (/\b(hola|buenos dias|buenas tardes)\b/.test(norm) && norm.split(/\s+/).length <= 4) {

        const nameMatch = correctedSpanish.match(/(?:mi nombre es|me llamo|yo soy)\s+([a-zA-ZáéíóúÁÉÍÓÚñÑ]+)/i);

            es: `Mucho gusto, soy ${name}. ¿Y tú?`,
            en: `Nice to meet you, I'm ${name}. And you?`,
            why: "In everyday conversation, 'Soy [Name]' sounds smoother than 'Mi nombre es'."
          };
        }
        return {
          es: `¡Un placer, ${d.slangWord}! Soy ${name}, ¿cómo te va?`,
          en: `A pleasure, bro! I'm ${name}, how's it going?`,
          why: "Drops textbook phrasing for warm, natural native flow."
        };
      }

      if (/\b(quiero practicar|quiero aprender|aprender espanol|hablar espanol)\b/.test(norm)) {
        return {
          es: isBeginner
            ? "Quiero mejorar mi español contigo hoy."

        const withoutYo = restoreSpanishPunctuation(correctedSpanish.replace(/^yo\s+/i, ""));

          es: withoutYo,
          en: "Same meaning, smoother native rhythm (dropping 'yo')",
          why: "Native speakers usually drop 'yo' because the verb ending already shows you're talking about yourself."

    function restoreSpanishPunctuation(rawText) {
      let s = (rawText || "").trim();
      if (!s) return "";
      s = s.replace(/\bmucho gusto\s+(?=[a-záéíóúñ])/gi, "mucho gusto, ");
      s = s
        .replace(/\bcomo estas\b/gi, "¿cómo estás?")
        .replace(/\bcomo se dice\b/gi, "¿cómo se dice")
        .replace(/\bque tal\b/gi, "¿qué tal?")
        .replace(/\bque bola\b/gi, "¿qué bolá?")
        .replace(/\by tu\b$/gi, "¿y tú?")
        .replace(/\btambien\b/gi, "también")
        .replace(/\bmas\b/gi, "más");
      s = s.charAt(0).toUpperCase() + s.slice(1);
      s = s.replace(/^(Hola|Buenas|Oye|Che|Quiubo)\s+(?=[a-záéíóúñ])/i, "$1, ");

      const isQuestion = /^(¿|Que|Qué|Como|Cómo|Donde|Dónde|Cuando|Cuándo|Por que|Por qué|Quien|Quién|Cual|Cuál)\b/i.test(s);
      if (isQuestion && !s.includes("?")) {
        if (!s.startsWith("¿")) {
          s = "¿" + s.charAt(0).toLowerCase() + s.slice(1) + "?";
          s = s.charAt(0) + s.charAt(1).toUpperCase() + s.slice(2);
        } else {
          s = s + "?";
        }
      } else if (!/[.?!]$/.test(s)) {
        s = s + ".";
      }
      return s;
    }

    function extractHowToSayQuery(text) {
      const cleaned = (text || "").replace(/[¿?¡!.,"]/g, "").trim();
      const patterns = [
        /(?:como se dice|cómo se dice|que significa|qué significa|como digo|cómo digo)\s+(.+)$/i,
        /(?:how do you say|how do i say|how to say|what is the word for|what's the word for|what is|translate)\s+(.+?)(?:\s+in spanish|\s+en espanol|\s+en español)?$/i
      ];
      for (const pat of patterns) {
        const m = cleaned.match(pat);
        if (m && m[1]) {
          return m[1].replace(/\b(en espanol|en español|in spanish|por favor|please)\b/gi, "").trim();
        }
      }
      return null;
    }

    async function translateTextReliable(query, sourceLang = "en", targetLang = "es") {
      const clean = (query || "").trim();
      if (!clean) return "";
      const lower = clean.toLowerCase();

      if (OFFLINE_WORD_FALLBACK[lower]) {
        return OFFLINE_WORD_FALLBACK[lower];
      }

      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(clean)}`;
        const res = await fetch(gtxUrl);
        if (res.ok) {
          const data = await res.json();
          if (data && data[0]) {
            const joined = data[0].map(seg => seg[0]).join("");
            if (joined && joined.toLowerCase() !== lower) {
              return joined;
            }
          }
        }
      } catch (err) {}

      try {
        const mmUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${sourceLang}|${targetLang}`;
        const mmRes = await fetch(mmUrl);
        if (mmRes.ok) {
          const mmData = await mmRes.json();
          if (mmData && mmData.responseData && mmData.responseData.translatedText) {
            return mmData.responseData.translatedText;
          }
        }
      } catch (e) {}

      return OFFLINE_WORD_FALLBACK[lower] || clean;
    }

          if (Array.isArray(lrcData)) {

              const artist = item.artistName || "Unknown Artist";
              const key = `${title.toLowerCase()}|${artist.toLowerCase()}`;
              if (seenKeys.has(key)) continue;
              seenKeys.add(key);

              let snippetEs = clean;
              if (item.plainLyrics) {
                const lines = item.plainLyrics.split("\n").map(l => l.trim()).filter(Boolean);
                const normQueryWords = normalizeText(clean).split(/\s+/).filter(w => w.length > 2);
                const matchedLineIdx = lines.findIndex(line =>
                  normQueryWords.some(w => normalizeText(line).includes(w))
                );
                if (matchedLineIdx !== -1) {
                  snippetEs = lines.slice(matchedLineIdx, matchedLineIdx + 2).join(" / ");
                } else if (lines.length > 0) {
                  snippetEs = lines.slice(0, 2).join(" / ");
                }
              }

              results.push({
                id: "lrc_" + (item.id || Math.random()),
                title,
                artist,
                album: item.albumName || "",
                artwork: null,
                previewUrl: null,
                lyricEs: snippetEs,
                fullLyrics: item.plainLyrics || ""
              });
            }
          }
        }
      } catch (e) {}

      try {
        const itunesSearchTerm = results.length > 0
          ? `${results[0].title} ${results[0].artist}`
          : clean;
        const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(itunesSearchTerm)}&entity=song&limit=5`;
        const itRes = await fetch(itunesUrl);
        if (itRes.ok) {
          const itData = await itRes.json();
          if (itData && Array.isArray(itData.results)) {
            for (const track of itData.results) {
              const title = track.trackName || "Unknown Track";
              const artist = track.artistName || "Unknown Artist";
              const key = `${title.toLowerCase()}|${artist.toLowerCase()}`;

              const existing = results.find(
                r =>
                  normalizeText(r.title) === normalizeText(title) ||
                  normalizeText(r.artist) === normalizeText(artist)
              );
              if (existing && !existing.previewUrl) {
                existing.artwork = track.artworkUrl100;
                existing.previewUrl = track.previewUrl;
                if (!existing.album) existing.album = track.collectionName;
              } else if (!seenKeys.has(key) && results.length < 5) {
                seenKeys.add(key);
                results.push({
                  id: "it_" + track.trackId,
                  title,
                  artist,
                  album: track.collectionName || "",
                  artwork: track.artworkUrl100 || null,
                  previewUrl: track.previewUrl || null,
                  lyricEs: clean,
                  fullLyrics: ""
                });
              }
            }
          }
        }
      } catch (e) {}

      for (const r of results.slice(0, 3)) {
        r.lyricEn = await translateTextReliable(r.lyricEs, "es", "en");
      }

      return results;
    }

    function gradeFreeSpeechWords(originalText, correctedText, rawConfidence, grammarMatches) {
      const origWords = (originalText || "").trim().split(/\s+/).filter(Boolean);
      const corrWords = (correctedText || "").replace(/[¿?¡!.,;:"]/g, "").trim().split(/\s+/).filter(Boolean);
      const baseConf = rawConfidence && rawConfidence > 0 ? rawConfidence : 0.88;

      const wrongWordSet = new Set();
      (grammarMatches || []).forEach(m => {
        (m.wrong || "").toLowerCase().split(/\s+/).forEach(w => wrongWordSet.add(normalizeText(w)));
      });

      const hardRedSet = new Set(["sabo", "poni", "poní", "teni", "tení", "haci", "hací", "gustario", "gustarío"]);

      return origWords.map((w, idx) => {
        const norm = normalizeText(w);
        const alignedCorr = corrWords[idx] || w;

        if (hardRedSet.has(norm)) {
          return {
            word: w,
            status: "red",
            label: "Grammar Error",
            score: 45,
            reason: `"${w}" is not a valid conjugation — see the tutor's fix below.`
          };
        }

        if (wrongWordSet.has(norm)) {
          return {
            word: w,
            status: "yellow",
            label: "Needs Small Fix",
            score: 74,
            reason: `Good effort on "${w}", check the tutor's phrasing upgrade below.`
          };
        }

        const cleanOrig = w.replace(/[¿?¡!.,;:"]/g, "").toLowerCase();
        const cleanCorr = alignedCorr.toLowerCase();
        if (cleanOrig !== cleanCorr && normalizeText(cleanOrig) === normalizeText(cleanCorr)) {
          return {
            word: w,
            status: "yellow",
            label: "Accent Note",
            score: 82,
            reason: `Good sound! Written with an accent mark: "${alignedCorr}".`
          };
        }

        if (baseConf >= 0.80) {
          return {
            word: w,
            status: "green",
            label: "Clear",
            score: Math.min(99, Math.round(baseConf * 100) + 4),
            reason: "Clear pronunciation & grammar!"
          };
        }

        return {
          word: w,
          status: "yellow",
          label: "Practice",
          score: Math.round(baseConf * 100),
          reason: "Tap to hear native syllable breakdown."
        };
      });
    }

    // LEVEL-MATCHED AI TUTOR REPLY GENERATOR (A1 vs A2 vs B1 vs B2)
    async function generateContextualTutorReply(userText, englishMeaning, dialectCode, userTier, wasEnglishInput = false, hasCorrection = false, correctedEs = "") {
      const d = DIALECTS[dialectCode] || DIALECTS["es-CU"];
      const norm = normalizeText(userText);
      const isA1 = userTier.startsWith("A1");
      const isA2 = userTier.startsWith("A2");
      const isB1 = userTier.startsWith("B1");

      const wordToTranslate = extractHowToSayQuery(userText);
      if (wordToTranslate) {
        const cleanQuery = wordToTranslate.toLowerCase().trim();
        const translatedEs = await translateTextReliable(cleanQuery, "en", "es");
        if (isA1) {
          return {
            es: `Se dice "${translatedEs}". Repite conmigo: "${translatedEs}".`,
            en: `You say "${translatedEs}". Repeat with me: "${translatedEs}".`
          };
        }
        return {
          es: `¡Buena pregunta, ${d.slangWord}! "${cleanQuery}" se dice "${translatedEs}". Por ejemplo: "Hoy necesito ${translatedEs}."`,
          en: `Great question, bro! "${cleanQuery}" is "${translatedEs}". For example: "Today I need ${translatedEs}."`
        };
      }

      if (wasEnglishInput) {
        const spanishVersion = await translateTextReliable(userText, "en", "es");
        if (isA1) {
          return {
            es: `En español es: "${spanishVersion}". ¡Dilo tú ahora!`,
            en: `In Spanish it is: "${spanishVersion}". Say it now!`
          };
        }
        return {
          es: `¡En español decimos: "${spanishVersion}"! Intenta decirlo en voz alta.`,
          en: `In Spanish we say: "${spanishVersion}"! Try saying it out loud.`
        };
      }

      // If the user made a grammar mistake, the tutor gently echoes the corrected version like a real human tutor!
      const tutorCorrectionPrefixEs = hasCorrection
        ? isA1
          ? `¡Casi! Es mejor decir: "${correctedEs}" `
          : `¡Muy bien! Solo un detalle, suena más natural decir: "${correctedEs}" `
        : "";
      const tutorCorrectionPrefixEn = hasCorrection
        ? isA1
          ? `Almost! It's better to say: "${correctedEs}" `
          : `Very good! Just one detail, it sounds more natural to say: "${correctedEs}" `
        : "";

      const nameMatch = userText.match(/(?:me llamo|soy|mi nombre es)\s+([a-zA-ZáéíóúÁÉÍÓÚñÑ]+)/i);
      if (nameMatch) {
        const userName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
        if (isA1) {
          return {
            es: `${tutorCorrectionPrefixEs}¡Mucho gusto, ${userName}! ¿Cómo estás hoy?`,
            en: `${tutorCorrectionPrefixEn}Nice to meet you, ${userName}! How are you today?`
          };
        }
        if (isA2) {
          return {
            es: `${tutorCorrectionPrefixEs}¡Mucho gusto, ${userName}! Qué alegría hablar contigo. ¿Qué haces hoy?`,
            en: `${tutorCorrectionPrefixEn}Nice to meet you, ${userName}! So glad to talk with you. What are you doing today?`
          };
        }
        return {
          es: `${tutorCorrectionPrefixEs}¡El gusto es mío, ${userName}, ${d.slangWord}! ¿Cómo va tu día hoy o qué quieres practicar?`,
          en: `${tutorCorrectionPrefixEn}The pleasure is mine, ${userName}, bro! How's your day going or what do you want to practice?`
        };
      }

      if (/\b(hola|buenas|que bola|como estas|que tal|todo bien|mucho gusto)\b/.test(norm)) {
        if (isA1) {
          return {
            es: `${tutorCorrectionPrefixEs}¡Hola! Estoy muy bien, gracias. ¿Y tú, cómo estás?`,
            en: `${tutorCorrectionPrefixEn}Hello! I am very well, thank you. And you, how are you?`
          };
        }
        if (isA2) {
          return {
            es: `${tutorCorrectionPrefixEs}¡Todo muy bien por aquí! ¿Cómo va tu día hoy?`,
            en: `${tutorCorrectionPrefixEn}Everything is very good over here! How is your day going today?`
          };
        }
        if (isB1) {
          return {
            es: `${tutorCorrectionPrefixEs}¡Todo excelente por aquí, ${d.slangWord}! ¿Qué planes tienes para hoy?`,
            en: `${tutorCorrectionPrefixEn}Everything's great over here, bro! What plans do you have for today?`
          };
        }
        return {
          es: `${tutorCorrectionPrefixEs}¡Todo ${d.coolWord} por aquí, ${d.slangWord}, sin coger lucha! ¿Qué me cuentas de bueno hoy?`,
          en: `${tutorCorrectionPrefixEn}Everything's awesome over here, bro, stress-free! What good news do you have for me today?`
        };
      }

      // Default adaptive conversational reply matched to A1, A2, B1, or B2
      if (isA1) {
        return {
          es: `${tutorCorrectionPrefixEs}¡Muy bien! Me gusta hablar contigo. ¿Qué más quieres decir en español?`,
          en: `${tutorCorrectionPrefixEn}Very good! I like talking with you. What else do you want to say in Spanish?`
        };
      }
      if (isA2) {
        return {
          es: `${tutorCorrectionPrefixEs}¡Qué bien lo dijiste! ¿Quieres practicar otra frase o aprender una palabra nueva?`,
          en: `${tutorCorrectionPrefixEn}You said that so well! Do you want to practice another phrase or learn a new word?`
        };
      }
      if (isB1) {
        return {
          es: `${tutorCorrectionPrefixEs}¡Eso sonó súper bien, ${d.slangWord}! Cuéntame un poco más sobre eso.`,
          en: `${tutorCorrectionPrefixEn}That sounded super good, bro! Tell me a little more about that.`
        };
      }
      return {
        es: `${tutorCorrectionPrefixEs}¡Durísimo, ${d.slangWord}! Eso sonó ${d.coolWord}, como un nativo. ¿Seguimos dándole?`,
        en: `${tutorCorrectionPrefixEn}Spot on, bro! That sounded awesome, just like a native. Shall we keep rolling?`
      };
    }

    async function analyzeFreeSpeechAndCorrect(spokenRaw, confidence, dialectCode, userTier = "A1 Beginner", forcedEnglishMode = false) {
      const cleanSpoken = (spokenRaw || "").trim();
      const detectedEnglish = forcedEnglishMode || isMostlyEnglishInput(cleanSpoken);

      if (detectedEnglish) {
        const extractedWord = extractHowToSayQuery(cleanSpoken);
        const queryToTranslate = extractedWord || cleanSpoken;
        const translatedToSpanish = await translateTextReliable(queryToTranslate, "en", "es");
        const cleanSpanishTarget = restoreSpanishPunctuation(translatedToSpanish);
        const naturalUpgrade = buildMoreNaturalPhrasing(cleanSpanishTarget, dialectCode, userTier);
        const aiReply = await generateContextualTutorReply(cleanSpoken, cleanSpoken, dialectCode, userTier, true, false, cleanSpanishTarget);

        const engWords = cleanSpoken.split(/\s+/).filter(Boolean).map(w => ({
          word: w,
          status: "english",
          label: "🇺🇸 English Spoken",
          score: 100,
          reason: `Translated "${w}" into Spanish below.`
        }));

        return {
          originalEs: cleanSpoken,
          correctedEs: cleanSpanishTarget,
          spanishTargetOnly: cleanSpanishTarget,
          isGrammarPerfect: true,
          wasEnglish: true,
          explanations: [
            {
              wrong: cleanSpoken,
              right: cleanSpanishTarget,
              reason: "Translated from English into Spanish so you can say it out loud!"
            }
          ],
          naturalUpgrade,
          englishMeaning: cleanSpoken,
          wordBreakdown: engWords,
          avgPronunciationScore: null,
          aiReply
        };
      }

      let workingCorrected = cleanSpoken;
      const explanations = [];

      GRAMMAR_RULES.forEach(rule => {
        const match = workingCorrected.match(rule.regex);
        if (match) {
          const wrongText = match[0];
          const replacedText = workingCorrected.replace(rule.regex, rule.replacement);
          workingCorrected = replacedText;
          explanations.push({
            wrong: wrongText,
            right: wrongText.replace(rule.regex, rule.replacement),
            reason: rule.reason
          });
        }
      });

      const punctuatedCorrected = restoreSpanishPunctuation(workingCorrected);
      const englishMeaning = await translateTextReliable(punctuatedCorrected, "es", "en");
      const wordBreakdown = gradeFreeSpeechWords(cleanSpoken, punctuatedCorrected, confidence, explanations);
      const avgPronunciationScore = wordBreakdown.length
        ? Math.round(wordBreakdown.reduce((acc, w) => acc + w.score, 0) / wordBreakdown.length)
        : 0;

      const naturalUpgrade = buildMoreNaturalPhrasing(punctuatedCorrected, dialectCode, userTier);
      const aiReply = await generateContextualTutorReply(
        punctuatedCorrected,
        englishMeaning,
        dialectCode,
        userTier,
        false,
        explanations.length > 0,
        punctuatedCorrected
      );

      return {
        originalEs: cleanSpoken,
        correctedEs: punctuatedCorrected,
        spanishTargetOnly: punctuatedCorrected,
        isGrammarPerfect: explanations.length === 0,
        wasEnglish: false,
        explanations,
        naturalUpgrade,
        englishMeaning,
        wordBreakdown,
        avgPronunciationScore,
        aiReply
      };
    }

    // =========================================================================
    // COMPONENT: ANIMATED SYLLABLE & SPEED PRONUNCIATION BREAKDOWN
    // =========================================================================
    function AnimatedSyllableVisualizer({ spanishText, dialect, onSpeakWithRate }) {
      const [activeGlobalIdx, setActiveGlobalIdx] = useState(null);
      const [activeSpeedTheme, setActiveSpeedTheme] = useState("yellow");
      const [isPlayingSeq, setIsPlayingSeq] = useState(false);
      const [speedBadge, setSpeedBadge] = useState("");
      const timersRef = useRef([]);

      const cleanTarget = (spanishText || "").split("/")[0].trim();
      const { wordGroups, allSyllables } = buildPhraseSyllableStructure(cleanTarget, dialect);

      const clearAllTimers = () => {
        timersRef.current.forEach(t => clearTimeout(t));
        timersRef.current = [];
      };

      useEffect(() => {
        return () => clearAllTimers();
      }, [spanishText, dialect]);

      const animatePass = (rate, themeColor, label, onPassComplete) => {
        clearAllTimers();
        setIsPlayingSeq(true);
        setActiveSpeedTheme(themeColor);
        setSpeedBadge(label);

        const msPerSyllable = rate < 0.75 ? 430 : 230;
        onSpeakWithRate(cleanTarget, rate, dialect);

        allSyllables.forEach((syl, idx) => {
          const t = setTimeout(() => {
            setActiveGlobalIdx(syl.globalIdx);
          }, idx * msPerSyllable);
          timersRef.current.push(t);
        });

        const endTimer = setTimeout(() => {
          setActiveGlobalIdx(null);
          setIsPlayingSeq(false);
          setSpeedBadge("");
          if (onPassComplete) onPassComplete();
        }, allSyllables.length * msPerSyllable + 280);
        timersRef.current.push(endTimer);
      };

      const playDualSpeedBreakdown = (e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        animatePass(1.0, "green", "⚡ Normal Speed (1.0x)", () => {
          const pauseTimer = setTimeout(() => {
            animatePass(0.52, "yellow", "🐢 Slow-Mo Breakdown (0.5x)", null);
          }, 400);
          timersRef.current.push(pauseTimer);
        });
      };

      const playSingleSpeed = (e, rate, theme, label) => {
        if (e && e.stopPropagation) e.stopPropagation();
        animatePass(rate, theme, label, null);
      };

      if (!allSyllables.length) return null;

      return (
        <div
          onClick={(e) => e.stopPropagation()}
          className="bg-[#070b12] border-2 border-yellow-400/50 rounded-2xl p-3 space-y-2.5 shadow-xl"
        >
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-1.5">
              <span className="text-[10px] font-extrabold uppercase tracking-wider text-yellow-400">
                ⚡ Animated Syllable Breakdown
              </span>
              {isPlayingSeq && (
                <div className="flex items-end gap-0.5 h-4 px-1">
                  <span className="w-1 bg-yellow-400 rounded-full eq-bar" style={{ animationDelay: "0ms" }}></span>
                  <span className="w-1 bg-emerald-400 rounded-full eq-bar" style={{ animationDelay: "120ms" }}></span>
                  <span className="w-1 bg-yellow-400 rounded-full eq-bar" style={{ animationDelay: "240ms" }}></span>
                </div>
              )}
            </div>
            {speedBadge ? (
              <span
                className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full ${
                  activeSpeedTheme === "yellow"
                    ? "bg-yellow-400 text-slate-950"
                    : "bg-emerald-400 text-slate-950"
                }`}
              >
                {speedBadge}
              </span>
            ) : (
              <span className="text-[10px] text-slate-400 font-bold">
                Tap any syllable or button
              </span>
            )}
          </div>

          <div className="flex flex-wrap items-center justify-center gap-y-2.5 gap-x-3 py-1.5">
            {wordGroups.map((wg, wIdx) => (
              <div key={wIdx} className="flex items-center flex-wrap gap-1">
                {wg.syllables.map((syl, sIdx) => {
                  const isActive = activeGlobalIdx === syl.globalIdx;
                  const activeClass = isActive
                    ? activeSpeedTheme === "yellow"
                      ? "syl-active-yellow"
                      : "syl-active-green"
                    : syl.stressed
                    ? "bg-slate-900 text-yellow-300 border-yellow-400/80"
                    : "bg-slate-900/90 text-emerald-300 border-slate-700";

                  return (
                    <React.Fragment key={syl.id}>
                      <button
                        type="button"
                        onClick={() => {
                          setActiveSpeedTheme("yellow");
                          setActiveGlobalIdx(syl.globalIdx);
                          onSpeakWithRate(syl.raw, 0.75, dialect);
                          setTimeout(() => setActiveGlobalIdx(null), 500);
                        }}
                        className={`px-2.5 py-1.5 rounded-xl border-2 transition-all duration-200 flex flex-col items-center min-w-[42px] ${activeClass}`}
                      >
                        <span
                          className={`text-sm font-extrabold tracking-wide ${
                            syl.stressed ? "underline decoration-2 underline-offset-4" : ""
                          }`}
                        >
                          {syl.phon}
                        </span>
                        <span className="text-[9px] opacity-75 font-bold mt-0.5">
                          {syl.raw}
                        </span>
                      </button>
                      {sIdx < wg.syllables.length - 1 && (
                        <span className="text-slate-500 font-extrabold text-xs select-none">-</span>
                      )}
                    </React.Fragment>
                  );
                })}
              </div>
            ))}
          </div>

          <div className="grid grid-cols-3 gap-1.5 pt-0.5">
            <button
              type="button"
              onClick={playDualSpeedBreakdown}
              className="py-2 px-2 rounded-xl bg-gradient-to-r from-emerald-400 to-yellow-400 text-slate-950 font-extrabold text-[11px] shadow-md active:scale-95 flex items-center justify-center gap-1"
            >
              🔊 Fast ➔ Slow
            </button>
            <button
              type="button"
              onClick={(e) => playSingleSpeed(e, 1.0, "green", "⚡ Normal (1.0x)")}
              className="py-2 px-2 rounded-xl bg-emerald-950/90 border border-emerald-400/70 text-emerald-300 font-extrabold text-[11px] hover:bg-emerald-900 active:scale-95"
            >
              ⚡ Fast (1x)
            </button>
            <button
              type="button"
              onClick={(e) => playSingleSpeed(e, 0.52, "yellow", "🐢 Slow-Mo (0.5x)")}
              className="py-2 px-2 rounded-xl bg-yellow-950/90 border border-yellow-400/80 text-yellow-300 font-extrabold text-[11px] hover:bg-yellow-900 active:scale-95"
            >
              🐢 Slow (0.5x)
            </button>
          </div>
        </div>
      );
    }

          u.rate = customRate;

          const currentVoices = window.speechSynthesis.getVoices();
          const pool = currentVoices.length ? currentVoices : voices;
          const exactVoice = pool.find(v => v.lang.replace("_", "-").toLowerCase() === langToUse.toLowerCase());
          const localSpanish = pool.find(v => v.lang.toLowerCase().startsWith("es") && v.localService);
          const anySpanish = pool.find(v => v.lang.toLowerCase().startsWith("es"));

          if (exactVoice) u.voice = exactVoice;
          else if (localSpanish) u.voice = localSpanish;
          else if (anySpanish) u.voice = anySpanish;

          let boundaryFired = false;

          u.onstart = () => {
            setIsAiSpeaking(true);
            setStreamingAiWordIdx(0);
            // Fallback word-by-word streamer in case mobile browser voice doesn't emit onboundary

            if (ev.name === "word" || typeof ev.charIndex === "number") {
              boundaryFired = true;
              const prefix = text.slice(0, ev.charIndex);
              const wordCountBefore = prefix.trim() ? prefix.trim().split(/\s+/).length : 0;
              setStreamingAiWordIdx(Math.min(words.length - 1, wordCountBefore));
            }

            clearAiWordStreamTimer();
            setStreamingAiWordIdx(words.length - 1);
            setIsAiSpeaking(false);
            if (onEndCallback) onEndCallback();
          };

            setIsAiSpeaking(false);
            if (onEndCallback) onEndCallback();
