<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DIALECTS = {
      "es-CU": { name: "Cuba (La Habana)", flag: "🇨🇺", tutor: "Yordanis", langCode: "es-CU", slangWord: "asere", coolWord: "en talla", greeting: "¡Qué bolá, asere! Vamos a meterle duro al español hoy. ¿Estás en talla?" },
      "es-MX": { name: "Mexico (CDMX)", flag: "🇲🇽", tutor: "Mateo", langCode: "es-MX", slangWord: "compa", coolWord: "bien chido", greeting: "¡Qué onda! ¿Listo para practicar tu español bien chido hoy?" },
      "es-CO": { name: "Colombia (Bogotá)", flag: "🇨🇴", tutor: "Valentina", langCode: "es-CO", slangWord: "parcero", coolWord: "qué chimba", greeting: "¡Quiubo, parcero! Qué chimba que estés aquí para practicar." },
      "es-ES": { name: "Spain (Madrid)", flag: "🇪🇸", tutor: "Alejandro", langCode: "es-ES", slangWord: "tío", coolWord: "mola mazo", greeting: "¡Buenas! Vamos a darle caña al español hoy, ¿vale?" },
      "es-AR": { name: "Argentina (BsAs)", flag: "🇦🇷", tutor: "Camila", langCode: "es-AR", slangWord: "che", coolWord: "re copado", greeting: "¡Che, todo bien! Vamos a hablar un rato bien copado." }
    };

    const INITIAL_DRILLS = [
      {
        id: "d1",
        title: "Everyday Casual Invitations",
        pattern: "¿Qué tal si vamos por...?",
        variations: [
          { en: "How about we go get some tacos?", es: "¿Qué tal si vamos por unos tacos?", cloze: "¿Qué ___ si ___ por unos tacos?" },
          { en: "How about we go get a coffee?", es: "¿Qué tal si vamos por un café?", cloze: "¿Qué ___ si vamos ___ un café?" },
          { en: "How about we go get something to eat?", es: "¿Qué tal si vamos por algo de comer?", cloze: "¿Qué tal ___ vamos por ___ de comer?" }
        ]
      },
      {
        id: "d2",
        title: "Cuban & Caribbean Street Greetings",
        pattern: "¿Qué bolá? / Todo en talla",
        variations: [
          { en: "What's up my friend, is everything good?", es: "¿Qué bolá asere, todo en talla?", cloze: "¿Qué ___ asere, todo en ___?" },
          { en: "Everything is great, let's go right now.", es: "Todo en talla, dale vamos ahora mismo.", cloze: "Todo en ___, dale ___ ahora mismo." },
          { en: "Don't worry, take it easy my brother.", es: "No cojas lucha, tranquilo mi hermano.", cloze: "No ___ lucha, ___ mi hermano." }
        ]

    // SRS intervals in milliseconds (Box 1: Immediate, Box 2: 10m, Box 3: 1h, Box 4: 1d, Box 5: 3d)
    const SRS_INTERVALS = {
      1: 0,
      2: 10 * 60 * 1000,
      3: 60 * 60 * 1000,
      4: 24 * 60 * 60 * 1000,
      5: 72 * 60 * 60 * 1000
    };

    const INITIAL_CARDS = [
      { id: "c1", es: "¿Qué bolá?", en: "What's up? / How's it going?", exEs: "¿Qué bolá asere, cómo está la familia?", exEn: "What's up bro, how is the family?", tag: "🇨🇺 Cuba Slang", box: 1, nextReview: 0, reps: 0 },
      { id: "c2", es: "Estar en talla", en: "To be cool / ready / in good shape", exEs: "Avísame cuando estés en talla para salir.", exEn: "Let me know when you're ready to head out.", tag: "🇨🇺 Cuba Idiom", box: 1, nextReview: 0, reps: 0 },
      { id: "c3", es: "No coger lucha", en: "Don't stress / Don't sweat it", exEs: "Tranquilo, no cojas lucha por eso.", exEn: "Relax, don't stress over that.", tag: "🇨🇺 Cuba Idiom", box: 1, nextReview: 0, reps: 0 },
      { id: "c4", es: "¡Qué padre! / ¡Qué chido!", en: "That's awesome! / How cool!", exEs: "¡Qué chido que viniste a la fiesta!", exEn: "How cool that you came to the party!", tag: "🇲🇽 Mexico Slang", box: 2, nextReview: 0, reps: 1 },
      { id: "c5", es: "Tomar el pelo", en: "To pull someone's leg / joke around", exEs: "¿Hablas en serio o me estás tomando el pelo?", exEn: "Are you serious or pulling my leg?", tag: "🌎 Universal Idiom", box: 1, nextReview: 0, reps: 0 }
    ];

    const SLANG_VAULT = [
      { id: "s1", dialect: "es-CU", badge: "🇨🇺 Cuba", phrase: "Asere / Consorte", literal: "Friend / Buddy", meaning: "Close friend, bro, mate (classic Havana street greeting)", exEs: "¡Qué bolá, asere! Tanto tiempo sin verte.", exEn: "What's up, bro! Long time no see." },
      { id: "s2", dialect: "es-CU", badge: "🇨🇺 Cuba", phrase: "Ponerse las pilas", literal: "Put in the batteries", meaning: "Step it up, focus, get energized", exEs: "Tienes que ponerte las pilas con el español.", exEn: "You have to step it up with Spanish." },
      { id: "s3", dialect: "es-CU", badge: "🇨🇺 Cuba", phrase: "Tirar un cabo", literal: "Throw a rope", meaning: "Lend a hand / help someone out", exEs: "Oye, tírame un cabo con esta caja.", exEn: "Hey, give me a hand with this box." },
      { id: "s4", dialect: "es-MX", badge: "🇲🇽 Mexico", phrase: "No manches", literal: "Don't stain", meaning: "No way! / You're kidding me!", exEs: "¡No manches, ganaste el premio!", exEn: "No way, you won the prize!" },
      { id: "s5", dialect: "es-MX", badge: "🇲🇽 Mexico", phrase: "Aguas", literal: "Waters", meaning: "Watch out! / Be careful!", exEs: "¡Aguas con el perro!", exEn: "Watch out for the dog!" },
      { id: "s6", dialect: "es-CO", badge: "🇨🇴 Colombia", phrase: "Dar papaya", literal: "Give papaya", meaning: "Leave yourself vulnerable / an easy target", exEs: "No des papaya con el celular en la calle.", exEn: "Don't leave yourself vulnerable with your phone out on the street." },
      { id: "s7", dialect: "es-ES", badge: "🇪🇸 Spain", phrase: "Flipar en colores", literal: "Flip in colors", meaning: "To be blown away / amazed", exEs: "Vas a flipar en colores con esta comida.", exEn: "You're going to be blown away by this food." },
      { id: "s8", dialect: "es-AR", badge: "🇦🇷 Argentina", phrase: "Ni a palos", literal: "Not even with sticks", meaning: "No way / Not a chance", exEs: "Ni a palos salgo con esta lluvia.", exEn: "No way I'm going out in this rain." }
    ];

    const BUILTIN_DICTIONARY = {
      "money": {
        es: "el dinero / la plata",
        en: "money / cash",
        exEs: "No tengo mucho dinero encima ahora mismo.",
        exEn: "I don't have much money on me right now.",
        slang: [
          { badge: "🇨🇺 Cuba", term: "el fula / el guanikiki", exEs: "Hace falta buscar el guanikiki, asere.", exEn: "We gotta go make that cash, bro." },
          { badge: "🇲🇽 Mexico", term: "la lana / el varo", exEs: "Ahorré una buena lana este mes.", exEn: "I saved up good money this month." }
        ]
      },
      "friend": {
        es: "el amigo / la amiga",
        en: "friend",
        exEs: "Él es mi mejor amigo desde niño.",
        exEn: "He is my best friend since childhood.",
        slang: [
          { badge: "🇨🇺 Cuba", term: "asere / yunta / ecobio", exEs: "Él es mi yunta de toda la vida.", exEn: "He's my ride-or-die friend for life." },
          { badge: "🇲🇽 Mexico", term: "carnal / compa / cuate", exEs: "¿Qué pasó, mi buen compa?", exEn: "What happened, my good buddy?" },
          { badge: "🇨🇴 Colombia", term: "parcero / parce", exEs: "Hágale pues, mi parcero.", exEn: "Go for it, my friend." }
        ]
      },
      "work": {
        es: "el trabajo / trabajar",
        en: "work / job",
        exEs: "Salgo del trabajo a las cinco de la tarde.",
        exEn: "I get off work at five in the afternoon.",
        slang: [
          { badge: "🇨🇺 Cuba", term: "el pincho / pinchar", exEs: "Estoy en el pincho ahora mismo.", exEn: "I'm at work right now." },
          { badge: "🇲🇽 Mexico", term: "la chamba / chambear", exEs: "Ya encontré una buena chamba.", exEn: "I already found a great job." },
          { badge: "🇪🇸 Spain", term: "el curro / currar", exEs: "Tengo mucho curro hoy.", exEn: "I have a lot of work today." }
        ]
      },
      "cool": {
        es: "genial / estupendo",
        en: "cool / awesome / great",
        exEs: "Esa película estuvo genial.",
        exEn: "That movie was awesome.",
        slang: [
          { badge: "🇨🇺 Cuba", term: "en talla / escapao / volao", exEs: "Ese carro está volao, asere.", exEn: "That car is super cool, bro." },
          { badge: "🇲🇽 Mexico", term: "chido / padre", exEs: "Qué padre está tu camisa.", exEn: "Your shirt is so cool." },
          { badge: "🇨🇴 Colombia", term: "chimba / bacano", exEs: "¡Qué chimba de viaje!", exEn: "What an awesome trip!" }
        ]
      },
      "food": {
        es: "la comida",
        en: "food / meal",
        exEs: "La comida casera es la mejor.",
        exEn: "Home-cooked food is the best.",
        slang: [
          { badge: "🇨🇺 Cuba", term: "la jama / jamar", exEs: "Vamos a preparar la jama temprano.", exEn: "Let's make the food early." },
          { badge: "🇲🇽 Mexico", term: "el bajón / la garnacha", exEs: "Vamos por unos tacos para el bajón.", exEn: "Let's get some tacos for the munchies." }
        ]
      }
    };

    // Contextual Sentence Generator Engine
    function generateContextualExamples(esWord, enMeaning, dialectCode) {
      const d = DIALECTS[dialectCode] || DIALECTS["es-CU"];
      const cleanEs = esWord.split("/")[0].trim();
      const cleanEn = enMeaning.split("/")[0].trim();
      return [
        {
          id: "street",
          label: `🌆 ${d.flag} Street & Casual`,
          es: `Oye ${d.slangWord}, hablar de "${cleanEs}" siempre está ${d.coolWord}.`,
          en: `Hey friend, talking about "${cleanEn}" is always super cool.`
        },
        {
          id: "social",
          label: "🍽️ Social & Hangout",
          es: `Cuando nos veamos más tarde, tenemos que conversar sobre ${cleanEs}.`,
          en: `When we meet up later, we have to chat about ${cleanEn}.`
        },
        {
          id: "work",
          label: "💼 Work & Daily Life",
          es: `Hoy en el trabajo todo el mundo estaba preguntando por ${cleanEs}.`,
          en: `Today at work everyone was asking about ${cleanEn}.`
        },
        {
          id: "travel",
          label: "✈️ Travel & On the Go",
          es: `Disculpe, ¿me puede explicar dónde consigo ${cleanEs} por aquí cerca?`,
          en: `Excuse me, can you explain where I can find ${cleanEn} near here?`
        }
      ];
    }

    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim();
    }

    function scorePronunciation(expected, spoken) {
      const expWords = normalizeText(expected).split(/\s+/).filter(Boolean);
      const spkWords = normalizeText(spoken).split(/\s+/).filter(Boolean);
      if (!spkWords.length) return { score: 0, breakdown: expWords.map(w => ({ word: w, ok: false })) };
      let matches = 0;
      const breakdown = expWords.map(w => {
        const found = spkWords.includes(w);
        if (found) matches++;
        return { word: w, ok: found };
      });
      const score = Math.round((matches / expWords.length) * 100);
      return { score, breakdown };
    }

    function getLevelTitle(xp) {
      if (xp < 100) return { lvl: 1, title: "Novato" };
      if (xp < 250) return { lvl: 2, title: "Callejero" };
      if (xp < 500) return { lvl: 3, title: "En Talla" };
      if (xp < 1000) return { lvl: 4, title: "Candela" };
      return { lvl: 5, title: "Maestro" };
    }

    function App() {
      const [activeTab, setActiveTab] = useState("drills");
      const [dialect, setDialect] = useState("es-CU");
      const [slowSpeed, setSlowSpeed] = useState(false);

      // Gamification State (XP, Daily Goal, Streak)
      const [stats, setStats] = useState(() => {
        const saved = localStorage.getItem("vozzy_stats_v2");
        const today = new Date().toISOString().slice(0, 10);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.lastDate !== today) {
            return { ...parsed, dailyXp: 0, lastDate: today };
          }
          return parsed;
        }
        return { xp: 40, dailyXp: 40, streak: 7, lastDate: today };
      });

      // Drills & SRS Flashcards State
      const [drills, setDrills] = useState(() => {
        const saved = localStorage.getItem("vozzy_drills_v2");
        return saved ? JSON.parse(saved) : INITIAL_DRILLS;
      });
      const [cards, setCards] = useState(() => {
        const saved = localStorage.getItem("vozzy_cards_v2");
        if (saved) {
          return JSON.parse(saved).map(c => ({
            ...c,
            box: c.box || 1,
            nextReview: c.nextReview || 0,
            reps: c.reps || 0
          }));
        }
        return INITIAL_CARDS;
      });

      // Offline Voice Caching State
      const [voices, setVoices] = useState([]);
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      // Drills State
      const [activeDrillIdx, setActiveDrillIdx] = useState(0);
      const [varIdx, setVarIdx] = useState(0);
      const [stage, setStage] = useState(1);
      const [isRecording, setIsRecording] = useState(false);
      const [spokenText, setSpokenText] = useState("");
      const [evalResult, setEvalResult] = useState(null);
      const [toast, setToast] = useState("");

      // SRS Flashcards State
      const [cardIdx, setCardIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [cardEval, setCardEval] = useState(null);
      const [srsFilterDue, setSrsFilterDue] = useState(false);

      // Dictionary & Context Generator State
      const [searchQuery, setSearchQuery] = useState("");
      const [dictResult, setDictResult] = useState(null);
      const [activeContextIdx, setActiveContextIdx] = useState(0);
      const [slangFilter, setSlangFilter] = useState("ALL");

      // Roleplay State
      const [messages, setMessages] = useState([
        { role: "ai", es: DIALECTS["es-CU"].greeting, en: "What's up, bro! Let's hit Spanish hard today. Are you ready?" }
      ]);
      const [rpInput, setRpInput] = useState("");

      useEffect(() => {
        localStorage.setItem("vozzy_stats_v2", JSON.stringify(stats));
      }, [stats]);

      useEffect(() => {
        localStorage.setItem("vozzy_drills_v2", JSON.stringify(drills));
      }, [drills]);

      useEffect(() => {
        localStorage.setItem("vozzy_cards_v2", JSON.stringify(cards));
      }, [cards]);

      // Load & Cache Offline Speech Synthesis Voices
      useEffect(() => {
        const loadVoices = () => {
          if ("speechSynthesis" in window) {
            const available = window.speechSynthesis.getVoices();
            if (available.length) setVoices(available);
          }
        };
        loadVoices();
        if ("speechSynthesis" in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener("online", handleOnline);
        window.addEventListener("offline", handleOffline);
        return () => {
          window.removeEventListener("online", handleOnline);
          window.removeEventListener("offline", handleOffline);
        };
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3200);
      };

      const awardXp = (amount, label) => {
        const today = new Date().toISOString().slice(0, 10);
        setStats(prev => {
          const isNewDay = prev.lastDate !== today;
          const newStreak = isNewDay ? prev.streak + 1 : prev.streak;
          return {
            xp: prev.xp + amount,
            dailyXp: (isNewDay ? 0 : prev.dailyXp) + amount,
            streak: newStreak,
            lastDate: today
          };
        });
        showToast(`⚡ +${amount} XP! ${label || ""}`);
      };

      // Offline-Smart Spanish Audio Speaker
      const speakSpanish = (text) => {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = dialect;
        u.rate = slowSpeed ? 0.75 : 1.0;

        const exactVoice = voices.find(v => v.lang.replace("_", "-").toLowerCase() === dialect.toLowerCase());
        const localSpanish = voices.find(v => v.lang.toLowerCase().startsWith("es") && v.localService);
        const anySpanish = voices.find(v => v.lang.toLowerCase().startsWith("es"));
        if (exactVoice) u.voice = exactVoice;
        else if (localSpanish) u.voice = localSpanish;
        else if (anySpanish) u.voice = anySpanish;

        window.speechSynthesis.speak(u);
      };

      const hasOfflineSpanishVoice = voices.some(v => v.lang.toLowerCase().startsWith("es"));

      const listenVoice = (onTranscript) => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert("Speech recognition requires Chrome, Edge, or Safari over HTTPS.");
          return;
        }
        const rec = new SpeechRec();
        rec.lang = dialect;
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        setIsRecording(true);
        rec.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          onTranscript(transcript);
          setIsRecording(false);
        };
        rec.onerror = () => setIsRecording(false);
        rec.onend = () => setIsRecording(false);
        rec.start();
      };

      const currentDrill = drills[activeDrillIdx] || drills[0];
      const currentVar = currentDrill.variations[varIdx] || currentDrill.variations[0];

      const handleDrillMic = () => {
        listenVoice((transcript) => {
          setSpokenText(transcript);
          const res = scorePronunciation(currentVar.es, transcript);
          setEvalResult(res);
          if (res.score >= 90) {
            speakSpanish("¡Excelente!");
            awardXp(25, "Passed 90% Pronunciation Gate!");
          }
        });
      };

      const advanceDrill = () => {
        setEvalResult(null);
        setSpokenText("");
        if (stage < 3) {
          setStage(stage + 1);
        } else {
          setStage(1);
          if (varIdx + 1 < currentDrill.variations.length) {
            setVarIdx(varIdx + 1);
          } else {
            setVarIdx(0);
            awardXp(50, "Unit Mastered Bonus!");
          }
        }
      };

      // Spaced Repetition System (SRS) Helper Functions
      const now = Date.now();
      const dueCards = cards.filter(c => (c.nextReview || 0) <= now);
      const activeDeck = srsFilterDue && dueCards.length > 0 ? dueCards : cards;
      const currentCard = activeDeck[cardIdx % activeDeck.length] || cards[0];

      const rateCardSRS = (cardId, difficulty) => {
        setCards(prev =>
          prev.map(c => {
            if (c.id !== cardId) return c;
            let newBox = c.box || 1;
            if (difficulty === "hard") newBox = 1;
            else if (difficulty === "good") newBox = Math.min(5, newBox + 1);
            else if (difficulty === "easy") newBox = Math.min(5, newBox + 2);
            const interval = SRS_INTERVALS[newBox] || 0;
            return {
              ...c,
              box: newBox,
              nextReview: Date.now() + interval,
              reps: (c.reps || 0) + 1
            };
          })
        );
        const xpGain = difficulty === "easy" ? 20 : 15;
        awardXp(xpGain, `SRS Box Updated!`);
        setFlipped(false);
        setCardEval(null);
        setCardIdx((prev) => (prev + 1) % Math.max(1, activeDeck.length));
      };

      // Dictionary + Contextual Sentence Generator Handler
      const handleSearch = (e) => {
        e.preventDefault();
        const q = searchQuery.trim().toLowerCase();
        if (!q) return;

        setActiveContextIdx(0);
        if (BUILTIN_DICTIONARY[q]) {
          const entry = BUILTIN_DICTIONARY[q];
          const contexts = generateContextualExamples(entry.es, entry.en, dialect);
          setDictResult({ query: searchQuery.trim(), ...entry, contexts });
          awardXp(10, "Word Explored!");
          return;
        }

        const cleanQ = searchQuery.trim();
        const contexts = generateContextualExamples(cleanQ, cleanQ, dialect);
        setDictResult({
          query: cleanQ,
          es: cleanQ,
          en: `Conversational usage for "${cleanQ}"`,
          exEs: contexts[0].es,
          exEn: contexts[0].en,
          contexts,
          slang: [
            {
              badge: `${DIALECTS[dialect].flag} ${DIALECTS[dialect].name.split(" ")[0]}`,
              term: `${cleanQ} (${DIALECTS[dialect].coolWord})`,
              exEs: `Oye ${DIALECTS[dialect].slangWord}, dime cómo se usa "${cleanQ}" aquí en la calle.`,
              exEn: `Hey friend, tell me how you use "${cleanQ}" here on the street.`
            }
          ]
        });
        awardXp(10, "Custom Word Generated!");
      };

      const addWordToFlashcards = (esText, enText, exEs, exEn, tag = "📖 Dictionary") => {
        const newCard = {
          id: "c_" + Date.now(),
          es: esText,
          en: enText,
          exEs: exEs || `Ejemplo con ${esText}.`,
          exEn: exEn || `Example with ${enText}.`,
          tag,
          box: 1,
          nextReview: 0,
          reps: 0
        };
        setCards([newCard, ...cards]);
        awardXp(15, `Saved to SRS Flashcards!`);
      };

      const addWordToDrills = (esText, enText, exEs, exEn) => {
        const targetSentence = exEs || `Quiero decir ${esText} ahora mismo.`;
        const words = targetSentence.split(" ");
        const clozeSentence = words.map((w, i) => (i % 2 === 1 ? "___" : w)).join(" ");
        const newDrill = {
          id: "d_" + Date.now(),
          title: `Drill: ${esText}`,
          pattern: esText,
          variations: [
            { en: enText, es: esText, cloze: "___" },
            { en: exEn || `Practice sentence with ${enText}`, es: targetSentence, cloze: clozeSentence },
            { en: `Can you tell me what ${enText} means?`, es: `¿Me puedes decir qué significa ${esText}?`, cloze: `¿Me puedes ___ qué significa ___?` }
          ]
        };
        setDrills([newDrill, ...drills]);
        setActiveDrillIdx(0);
        setVarIdx(0);
        setStage(1);

        setMessages([...messages, userEntry, { role: "ai", es: reply.es, en: reply.en }]);

        speakSpanish(reply.es);

                          <div className="flex justify-between items-center">
                            <span className="font-extrabold text-white">{s.badge}: {s.term}</span>
                            <button onClick={() => speakSpanish(s.exEs)} className="text-purple-400 font-bold">🔊 Hear</button>
                          </div>
                          <p className="text-slate-300">"{s.exEs}"</p>
                          <p className="text-slate-500">"{s.exEn}"</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* Regional Slang & Idioms Vault */}
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-extrabold text-sm text-amber-400">🌶️ Regional Slang & Idioms Vault</h3>
                  <select
                    value={slangFilter}
                    onChange={(e) => setSlangFilter(e.target.value)}
                    className="bg-slate-800 text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-700"
                  >
                    <option value="ALL">🌎 All Regions</option>
                    <option value="es-CU">🇨🇺 Cuba</option>
                    <option value="es-MX">🇲🇽 Mexico</option>
                    <option value="es-CO">🇨🇴 Colombia</option>
                    <option value="es-ES">🇪🇸 Spain</option>
                    <option value="es-AR">🇦🇷 Argentina</option>
                  </select>
                </div>

                <div className="space-y-2.5">
                  {SLANG_VAULT.filter(s => slangFilter === "ALL" || s.dialect === slangFilter).map((item) => (
                    <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-1.5">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-amber-300">
                            {item.badge}
                          </span>
                          <h4 className="font-extrabold text-base text-white mt-1">{item.phrase}</h4>
                        </div>
                        <button
                          onClick={() => speakSpanish(item.exEs)}
                          className="px-2.5 py-1.5 bg-slate-800 rounded-xl text-xs font-bold"
                        >
                          🔊 Audio
                        </button>
                      </div>
                      <p className="text-xs text-slate-400"><b>Literal:</b> "{item.literal}" • <b>Meaning:</b> {item.meaning}</p>
                      <p className="text-xs text-emerald-300 font-semibold">"{item.exEs}"</p>
                      <p className="text-xs text-slate-500">"{item.exEn}"</p>
                      <div className="flex gap-2 pt-2">
                        <button
                          onClick={() => addWordToDrills(item.phrase, item.meaning, item.exEs, item.exEn)}
                          className="flex-1 py-1.5 bg-purple-600/20 border border-purple-500/50 text-purple-300 rounded-xl text-xs font-bold"
                        >
                          + Add to Drills
                        </button>
                        <button
                          onClick={() => addWordToFlashcards(item.phrase, item.meaning, item.exEs, item.exEn, item.badge)}
                          className="flex-1 py-1.5 bg-blue-600/20 border border-blue-500/50 text-blue-300 rounded-xl text-xs font-bold"
                        >
                          + Add to SRS
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
