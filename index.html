        "where", "when", "why", "who", "this", "that", "it", "with", "from", "about", "if",
        "computer", "water", "coffee", "pot", "bro", "cool", "damn", "fuck", "shit"
      ]);
      let engCount = 0;
      tokens.forEach(t => {
        if (englishStopWords.has(t)) engCount++;
      });
      if (/^(how|what|can you|do you|i want|i need|tell me|where is)\b/i.test(text.trim())) return true;
      if (tokens.length === 1 && englishStopWords.has(tokens[0])) return true;
      return (engCount / tokens.length) >= 0.45;
    }

    function generatePhoneticGuide(spanishText, dialectCode = "es-CU") {
      if (!spanishText) return "";
      const words = spanishText
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      const convertWord = (rawW) => {
        let w = rawW.toLowerCase();
        if (dialectCode === "es-CU") {
          w = w.replace(/ado$/, "ao").replace(/ada$/, "á");
          w = w.replace(/s([tpckfbgd])/g, "h$1").replace(/s$/, "h");
        } else if (dialectCode === "es-AR") {
          w = w.replace(/ll/g, "sh").replace(/\by([aeiouáéíóú])/g, "sh$1");
        } else if (dialectCode === "es-ES") {
          w = w.replace(/z/g, "th").replace(/ce/g, "the").replace(/ci/g, "thi");
        }
        w = w
          .replace(/qué/g, "KEH")
          .replace(/que/g, "keh")
          .replace(/qu([eiéí])/g, "k$1")
          .replace(/gue/g, "geh")
          .replace(/gui/g, "gee")
          .replace(/ñ/g, "ny")
          .replace(/ll/g, "y")
          .replace(/j/g, "kh")
          .replace(/ge/g, "kheh")
          .replace(/gi/g, "khee")
          .replace(/ce/g, "seh")
          .replace(/ci/g, "see")
          .replace(/z/g, "s")
          .replace(/^h/g, "")
          .replace(/v/g, "b");
        return w;
      };

      return words.map(convertWord).join(" · ");
    }

    function wordSimilarity(a, b) {
      const s1 = normalizeText(a);
      const s2 = normalizeText(b);
      if (!s1 || !s2) return 0;
      if (s1 === s2) return 100;
      const phoneticNorm = (w) => w.replace(/v/g, "b").replace(/z/g, "s").replace(/ll/g, "y").replace(/s$/, "");
      if (phoneticNorm(s1) === phoneticNorm(s2)) return 84;

      const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
      for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
      for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;
      for (let j = 1; j <= s2.length; j += 1) {
        for (let i = 1; i <= s1.length; i += 1) {
          const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
          track[j][i] = Math.min(
            track[j][i - 1] + 1,
            track[j - 1][i] + 1,
            track[j - 1][i - 1] + indicator
          );
        }
      }
      const distance = track[s2.length][s1.length];
      const maxLen = Math.max(s1.length, s2.length);
      return Math.round(((maxLen - distance) / maxLen) * 100);
    }

    function scorePronunciation(expected, spoken) {
      const expWords = (expected || "").trim().split(/\s+/).filter(Boolean);
      const spkWords = (spoken || "").trim().split(/\s+/).filter(Boolean);
      if (!spkWords.length) {
        return {
          score: 0,
          breakdown: expWords.map(w => ({ word: w, status: "red", sim: 0, note: "Not heard" }))
        };
      }
      let totalSim = 0;
      const breakdown = expWords.map((expW, idx) => {
        let bestSim = 0;
        let matchedSpk = "";
        spkWords.forEach((spkW, sIdx) => {
          const sim = wordSimilarity(expW, spkW);
          const posPenalty = Math.abs(idx - sIdx) > 3 ? 10 : 0;
          const adjSim = Math.max(0, sim - posPenalty);
          if (adjSim > bestSim) {
            bestSim = adjSim;
            matchedSpk = spkW;
          }
        });
        totalSim += bestSim;
        let status = "red";
        let note = matchedSpk ? `Heard "${matchedSpk}"` : "Missed word";
        if (bestSim >= 85) {
          status = "green";
          note = "Perfect pronunciation!";
        } else if (bestSim >= 65) {
          status = "yellow";
          note = `Medium ("${matchedSpk}")`;
        }
        return { word: expW, status, sim: bestSim, note };
      });
      const score = Math.round(totalSim / expWords.length);
      return { score, breakdown };
    }

    const GRAMMAR_RULES = [
      {
        regex: /\bmi nombre (?!es\b|era\b)([a-zA-ZáéíóúÁÉÍÓÚñÑ]+)\b/gi,
        replacement: "mi nombre es $1",
        reason: "Include the verb 'es' (is) after 'mi nombre' → 'mi nombre es...'."
      },
      { regex: /\byo llamo\b/gi, replacement: "me llamo", reason: "Use reflexive 'me llamo' (I call myself) instead of 'yo llamo'." },
      { regex: /\bme llama\b/gi, replacement: "me llamo", reason: "For 'I call myself', end with '-o': 'me llamo'." },
      { regex: /\bmi nombre soy\b/gi, replacement: "mi nombre es", reason: "Use 'mi nombre es' or 'yo soy'." },
      { regex: /\bgustar[ií]o\b/gi, replacement: "gustaría", reason: "'Gustaría' never changes ending to '-o' — it is always 'me gustaría'." },
      { regex: /\byo gusto\b/gi, replacement: "me gusta", reason: "Use 'me gusta' (it pleases me) instead of 'yo gusto'." },
      { regex: /\btu gustas\b/gi, replacement: "te gusta", reason: "Use 'te gusta' to say 'you like'." },
      { regex: /\byo sabo\b/gi, replacement: "yo sé", reason: "'Saber' is irregular in the first person: 'yo sé'." },
      { regex: /\bla problema\b/gi, replacement: "el problema", reason: "'Problema' is masculine: 'el problema'." },
      { regex: /\bla dia\b|\bla día\b/gi, replacement: "el día", reason: "'Día' is masculine: 'el día'." },
      { regex: /\bestoy hambre\b|\bsoy hambre\b/gi, replacement: "tengo hambre", reason: "Use 'tener' for hunger: 'tengo hambre'." }
    ];

    function restoreSpanishPunctuation(rawText) {
      let s = (rawText || "").trim();
      if (!s) return "";
      s = s.replace(/\bmucho gusto\s+(?=[a-záéíóúñ])/gi, "mucho gusto, ");
      s = s
        .replace(/\bcomo estas\b/gi, "¿cómo estás?")
        .replace(/\bcomo se dice\b/gi, "¿cómo se dice")
        .replace(/\bque tal\b/gi, "¿qué tal?")
        .replace(/\bque bola\b/gi, "¿qué bolá?")
        .replace(/\by tu\b$/gi, "¿y tú?")
        .replace(/\btambien\b/gi, "también")
        .replace(/\bmas\b/gi, "más");
      s = s.charAt(0).toUpperCase() + s.slice(1);
      s = s.replace(/^(Hola|Buenas|Oye|Che|Quiubo)\s+(?=[a-záéíóúñ])/i, "$1, ");

      const isQuestion = /^(¿|Que|Qué|Como|Cómo|Donde|Dónde|Cuando|Cuándo|Por que|Por qué|Quien|Quién|Cual|Cuál)\b/i.test(s);
      if (isQuestion && !s.includes("?")) {
        if (!s.startsWith("¿")) {
          s = "¿" + s.charAt(0).toLowerCase() + s.slice(1) + "?";
          s = s.charAt(0) + s.charAt(1).toUpperCase() + s.slice(2);
        } else {
          s = s + "?";
        }
      } else if (!/[.?!]$/.test(s)) {
        s = s + ".";
      }
      return s;
    }

    function extractHowToSayQuery(text) {
      const cleaned = (text || "").replace(/[¿?¡!.,"]/g, "").trim();
      const patterns = [
        /(?:como se dice|cómo se dice|que significa|qué significa|como digo|cómo digo)\s+(.+)$/i,
        /(?:how do you say|how do i say|how to say|what is the word for|what's the word for|what is|translate)\s+(.+?)(?:\s+in spanish|\s+en espanol|\s+en español)?$/i
      ];
      for (const pat of patterns) {
        const m = cleaned.match(pat);
        if (m && m[1]) {
          return m[1].replace(/\b(en espanol|en español|in spanish|por favor|please)\b/gi, "").trim();
        }
      }
      return null;
    }

    const QUICK_WORD_TIPS = {
      "if": {
        es: "si (without an accent mark)",
        tipEs: "Para decir 'if' en español se dice 'si' (sin tilde). Por ejemplo: 'Si quieres, practicamos más.' (Con tilde, 'sí' significa 'yes').",
        tipEn: "To say 'if' in Spanish, you say 'si' (without an accent). For example: 'Si quieres, practicamos más' (If you want, we practice more)."
      },
      "proof": {
        es: "la prueba / la evidencia",
        tipEs: "¡Claro que sí! 'Proof' en español se dice 'la prueba' (o 'la evidencia'). Por ejemplo: 'Necesito una prueba de eso.' ¡Intenta repetirlo!",
        tipEn: "Of course! 'Proof' in Spanish is 'la prueba' (or 'la evidencia'). For example: 'Necesito una prueba de eso' (I need proof of that). Try repeating it!"
      },
      "computer": {
        es: "la computadora / el ordenador",
        tipEs: "¡Fácil! 'Computer' en español se dice 'la computadora' (en América Latina) o 'el ordenador' (en España). ¡Repítelo conmigo: la computadora!",
        tipEn: "Easy! 'Computer' in Spanish is 'la computadora' (in Latin America) or 'el ordenador' (in Spain). Repeat with me: la computadora!"
      }
    };

    async function translateTextReliable(query, sourceLang = "en", targetLang = "es") {
      const clean = (query || "").trim();
      if (!clean) return "";
      const lower = clean.toLowerCase();

      if (sourceLang === "en" && targetLang === "es" && OFFLINE_WORD_FALLBACK[lower]) {
        return OFFLINE_WORD_FALLBACK[lower];
      }

      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(clean)}`;
        const res = await fetch(gtxUrl);
        if (res.ok) {
          const data = await res.json();
          if (data && data[0]) {
            const joined = data[0].map(seg => seg[0]).join("");
            if (joined && joined.toLowerCase() !== lower) {
              return joined;
            }
          }
        }
      } catch (err) {}

      try {
        const mmUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${sourceLang}|${targetLang}`;
        const mmRes = await fetch(mmUrl);
        if (mmRes.ok) {
          const mmData = await mmRes.json();
          if (mmData && mmData.responseData && mmData.responseData.translatedText) {
            return mmData.responseData.translatedText;
          }
        }
      } catch (e) {}

      return OFFLINE_WORD_FALLBACK[lower] || clean;
    }

    // ====================================================
    // NEW: DUAL-ENGINE SPANISH SONG & LYRIC IDENTIFIER
    // Searches LRCLIB (Lyric Match) + iTunes API (Audio/Art)
    // ====================================================
    async function identifySpanishSongByLyricsOrTitle(queryText) {
      const clean = (queryText || "").trim();
      if (!clean) return [];

      const results = [];
      const seenKeys = new Set();

      // 1. Check LRCLIB API (Finds songs by sung lyric phrases!)
      try {
        const lrcUrl = `https://lrclib.net/api/search?q=${encodeURIComponent(clean)}`;
        const lrcRes = await fetch(lrcUrl);
        if (lrcRes.ok) {
          const lrcData = await lrcRes.json();
          if (Array.isArray(lrcData)) {
            for (const item of lrcData.slice(0, 4)) {
              const title = item.trackName || item.name || "Unknown Song";
              const artist = item.artistName || "Unknown Artist";
              const key = `${title.toLowerCase()}|${artist.toLowerCase()}`;
              if (seenKeys.has(key)) continue;
              seenKeys.add(key);

              // Extract a relevant snippet from plainLyrics matching the user's query
              let snippetEs = clean;
              if (item.plainLyrics) {
                const lines = item.plainLyrics.split("\n").map(l => l.trim()).filter(Boolean);
                const normQueryWords = normalizeText(clean).split(/\s+/).filter(w => w.length > 2);
                const matchedLineIdx = lines.findIndex(line =>
                  normQueryWords.some(w => normalizeText(line).includes(w))
                );
                if (matchedLineIdx !== -1) {
                  snippetEs = lines.slice(matchedLineIdx, matchedLineIdx + 2).join(" / ");
                } else if (lines.length > 0) {
                  snippetEs = lines.slice(0, 2).join(" / ");
                }
              }

              results.push({
                id: "lrc_" + (item.id || Math.random()),
                title,
                artist,
                album: item.albumName || "",
                artwork: null,
                previewUrl: null,
                lyricEs: snippetEs,
                fullLyrics: item.plainLyrics || ""
              });
            }
          }
        }
      } catch (e) {}

      // 2. Enrich with iTunes Search API (Artwork, 30s Audio Preview & Title/Lyric Matches)
      try {
        const itunesSearchTerm = results.length > 0
          ? `${results[0].title} ${results[0].artist}`
          : clean;
        const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(itunesSearchTerm)}&entity=song&limit=5`;
        const itRes = await fetch(itunesUrl);
        if (itRes.ok) {
          const itData = await itRes.json();
          if (itData && Array.isArray(itData.results)) {
            for (const track of itData.results) {
              const title = track.trackName || "Unknown Track";
              const artist = track.artistName || "Unknown Artist";
              const key = `${title.toLowerCase()}|${artist.toLowerCase()}`;

              // If we already found it via LRCLIB, attach artwork & previewUrl!
              const existing = results.find(
                r =>
                  normalizeText(r.title) === normalizeText(title) ||
                  normalizeText(r.artist) === normalizeText(artist)
              );
              if (existing && !existing.previewUrl) {
                existing.artwork = track.artworkUrl100;
                existing.previewUrl = track.previewUrl;
                if (!existing.album) existing.album = track.collectionName;
              } else if (!seenKeys.has(key) && results.length < 5) {
                seenKeys.add(key);
                results.push({
                  id: "it_" + track.trackId,
                  title,
                  artist,
                  album: track.collectionName || "",
                  artwork: track.artworkUrl100 || null,
                  previewUrl: track.previewUrl || null,
                  lyricEs: clean,
                  fullLyrics: ""
                });
              }
            }
          }
        }
      } catch (e) {}

      // Translate the primary lyric snippet into English for the top match
      for (const r of results.slice(0, 3)) {
        r.lyricEn = await translateTextReliable(r.lyricEs, "es", "en");
      }

      return results;
    }

    function gradeFreeSpeechWords(originalText, correctedText, rawConfidence, grammarMatches) {
      const origWords = (originalText || "").trim().split(/\s+/).filter(Boolean);
      const corrWords = (correctedText || "").replace(/[¿?¡!.,;:"]/g, "").trim().split(/\s+/).filter(Boolean);
      const baseConf = rawConfidence && rawConfidence > 0 ? rawConfidence : 0.88;

      const wrongWordSet = new Set();
      (grammarMatches || []).forEach(m => {
        (m.wrong || "").toLowerCase().split(/\s+/).forEach(w => wrongWordSet.add(normalizeText(w)));
      });

      const hardRedSet = new Set(["sabo", "poni", "poní", "teni", "tení", "haci", "hací", "gustario", "gustarío"]);

      return origWords.map((w, idx) => {
        const norm = normalizeText(w);
        const alignedCorr = corrWords[idx] || w;

        if (hardRedSet.has(norm)) {
          return {
            word: w,
            status: "red",
            label: "Bad / Grammar Error",
            score: 45,
            reason: `"${w}" is not a valid conjugation — check the Grammar Correction box below.`
          };
        }

        if (wrongWordSet.has(norm)) {
          return {
            word: w,
            status: "yellow",
            label: "Medium (Grammar/Word Missing)",
            score: 74,
            reason: `Good effort on "${w}", but a connector word (like 'es') or agreement fix was needed here.`
          };
        }

        const cleanOrig = w.replace(/[¿?¡!.,;:"]/g, "").toLowerCase();
        const cleanCorr = alignedCorr.toLowerCase();
        if (cleanOrig !== cleanCorr && normalizeText(cleanOrig) === normalizeText(cleanCorr)) {
          return {
            word: w,
            status: "yellow",
            label: "Medium (Accent)",
            score: 82,
            reason: `Good sound! Written with an accent mark: "${alignedCorr}".`
          };
        }

        if (baseConf >= 0.80) {
          return {
            word: w,
            status: "green",
            label: "Perfect",
            score: Math.min(99, Math.round(baseConf * 100) + 4),
            reason: "Perfect pronunciation & grammar!"
          };
        }

        return {
          word: w,
          status: "yellow",
          label: "Medium",
          score: Math.round(baseConf * 100),
          reason: "Medium pronunciation — tap to hear native speaker."
        };
      });
    }

    async function generateContextualTutorReply(userText, englishMeaning, dialectCode, turnHistoryCount, wasEnglishInput = false) {
      const d = DIALECTS[dialectCode] || DIALECTS["es-CU"];
      const norm = normalizeText(userText);

      const wordToTranslate = extractHowToSayQuery(userText);
      if (wordToTranslate) {
        const cleanQuery = wordToTranslate.toLowerCase().trim();
        if (QUICK_WORD_TIPS[cleanQuery]) {
          const tip = QUICK_WORD_TIPS[cleanQuery];
          return {
            es: `¡Buena pregunta, ${d.slangWord}! ${tip.tipEs}`,
            en: `Great question, bro! ${tip.tipEn}`
          };
        }

        const translatedEs = await translateTextReliable(cleanQuery, "en", "es");
        return {
          es: `¡Claro que sí, ${d.slangWord}! "${cleanQuery}" en español se dice "${translatedEs}". Por ejemplo: "Necesito ${translatedEs} ahora." ¡Intenta decir "${translatedEs}" en voz alta!`,
          en: `Of course, bro! "${cleanQuery}" in Spanish is "${translatedEs}". For example: "I need ${translatedEs} now." Try saying "${translatedEs}" out loud!`
        };
      }

      if (wasEnglishInput) {
        const cleanEng = userText.replace(/[¿?¡!.,"]/g, "").trim().toLowerCase();
        if (QUICK_WORD_TIPS[cleanEng]) {
          return {
            es: QUICK_WORD_TIPS[cleanEng].tipEs,
            en: QUICK_WORD_TIPS[cleanEng].tipEn
          };
        }
        const spanishVersion = await translateTextReliable(userText, "en", "es");
        return {
          es: `¡En español eso se dice: "${spanishVersion}"! Intenta repetir conmigo: "${spanishVersion}".`,
          en: `In Spanish you say that as: "${spanishVersion}"! Try repeating with me: "${spanishVersion}".`
        };
      }

      const nameMatch = userText.match(/(?:me llamo|soy|mi nombre es)\s+([a-zA-ZáéíóúÁÉÍÓÚñÑ]+)/i);
      if (nameMatch) {
        const userName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
        return {
          es: `¡El gusto es mío, ${userName}, ${d.slangWord}! Qué bolá, aquí tienes a tu socio ${d.tutor}. ¿Cómo va tu día hoy o qué palabra quieres aprender?`,
          en: `The pleasure is mine, ${userName}, bro! What's up, you've got your buddy ${d.tutor} here. How's your day going today or what word do you want to learn?`
        };
      }

      if (/\b(hola|buenas|que bola|como estas|que tal|todo bien|mucho gusto)\b/.test(norm)) {
        return {
          es: `¡Todo en talla por aquí, ${d.slangWord}, tranquilo y sin coger lucha! ¿Y tú qué me cuentas hoy?`,
          en: `Everything's great over here, bro, relaxed and stress-free! What about you today?`
        };
      }

      return {
        es: `¡Muy bien dicho en español, ${d.slangWord}! Eso sonó ${d.coolWord}. ¿Qué más quieres practicar o qué palabra en inglés quieres traducir?`,
        en: `Very well said in Spanish, bro! That sounded awesome. What else do you want to practice or what English word do you want to translate?`
      };
    }

    async function analyzeFreeSpeechAndCorrect(spokenRaw, confidence, dialectCode, turnCount = 0, forcedEnglishMode = false) {
      const cleanSpoken = (spokenRaw || "").trim();
      const detectedEnglish = forcedEnglishMode || isMostlyEnglishInput(cleanSpoken);

      if (detectedEnglish) {
        const extractedWord = extractHowToSayQuery(cleanSpoken);
        const queryToTranslate = extractedWord || cleanSpoken;
        const translatedToSpanish = await translateTextReliable(queryToTranslate, "en", "es");
        const aiReply = await generateContextualTutorReply(cleanSpoken, cleanSpoken, dialectCode, turnCount, true);

        const engWords = cleanSpoken.split(/\s+/).filter(Boolean).map(w => ({
          word: w,
          status: "english",
          label: "🇺🇸 English Spoken (Translated Below)",
          score: 100,
          reason: `You spoke "${w}" in English — see the instant Spanish translation below!`
        }));

        return {
          originalEs: cleanSpoken,
          correctedEs: `🇪🇸 En español: "${restoreSpanishPunctuation(translatedToSpanish)}"`,
          spanishTargetOnly: restoreSpanishPunctuation(translatedToSpanish),
          isGrammarPerfect: true,
          wasEnglish: true,
          explanations: [
            {
              wrong: cleanSpoken,
              right: restoreSpanishPunctuation(translatedToSpanish),
              reason: "Translated from English to Spanish so you can practice saying it in Spanish!"
            }
          ],
          englishMeaning: cleanSpoken,
          wordBreakdown: engWords,
          avgPronunciationScore: null,
          aiReply
        };
      }

      let workingCorrected = cleanSpoken;
      const explanations = [];

      GRAMMAR_RULES.forEach(rule => {
        const match = workingCorrected.match(rule.regex);
        if (match) {
          const wrongText = match[0];
          const replacedText = workingCorrected.replace(rule.regex, rule.replacement);
          workingCorrected = replacedText;
          explanations.push({
            wrong: wrongText,
            right: wrongText.replace(rule.regex, rule.replacement),
            reason: rule.reason
          });
        }
      });

      const punctuatedCorrected = restoreSpanishPunctuation(workingCorrected);
      const englishMeaning = await translateTextReliable(punctuatedCorrected, "es", "en");
      const wordBreakdown = gradeFreeSpeechWords(cleanSpoken, punctuatedCorrected, confidence, explanations);
      const avgPronunciationScore = wordBreakdown.length
        ? Math.round(wordBreakdown.reduce((acc, w) => acc + w.score, 0) / wordBreakdown.length)
        : 0;

      const aiReply = await generateContextualTutorReply(punctuatedCorrected, englishMeaning, dialectCode, turnCount, false);

      return {
        originalEs: cleanSpoken,
        correctedEs: punctuatedCorrected,
        spanishTargetOnly: punctuatedCorrected,
        isGrammarPerfect: explanations.length === 0,
        wasEnglish: false,
        explanations,
        englishMeaning,
        wordBreakdown,
        avgPronunciationScore,
        aiReply
      };
    }

          const anySpanish = pool.find(v => v.lang.toLowerCase().startsWith("es"));

          if (exactVoice) u.voice = exactVoice;

          else if (anySpanish) u.voice = anySpanish;

          u.onstart = () => setIsAiSpeaking(true);
          u.onend = () => {

            </div>
          )}

          {/* TAB 5: MULTI-MODE SPEAKING DRILLS */}
          {activeTab === "drills" && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3 shadow-xl">
              <div className="flex gap-1 bg-slate-950 p-1 rounded-2xl border border-slate-800">
                {["guided", "cloze", "blind"].map(m => (
                  <button
                    key={m}
                    onClick={() => { setDrillMode(m); setDrillFeedback(null); }}
                    className={`flex-1 py-2 text-[11px] font-extrabold rounded-xl capitalize transition ${
                      drillMode === m ? "bg-purple-600 text-white shadow-md" : "text-slate-400"
                    }`}
                  >
                    {m === "guided" ? "📖 Guided" : m === "cloze" ? "🧩 Cloze" : "🕶️ Blind"}
                  </button>
                ))}
              </div>

              <div className="flex items-center justify-between text-xs">
                <span className="font-extrabold text-purple-300">{currentDrill.title}</span>
                <button
                  onClick={() => {
                    setVarIdx((varIdx + 1) % currentDrill.variations.length);
                    setDrillFeedback(null);
                  }}
                  className="px-3 py-1.5 bg-slate-800 rounded-xl text-[11px] font-extrabold text-slate-200"
                >
                  Next ({varIdx + 1}/{currentDrill.variations.length}) →
                </button>
              </div>

              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-center space-y-3">
                <h3 className="text-base font-extrabold text-white">"{currentVar.en}"</h3>

                {drillMode === "guided" && (
                  <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                    {renderClickableSpanish(currentVar.es, "text-base font-extrabold text-emerald-300")}
                  </div>
                )}
                {drillMode === "cloze" && (
                  <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <p className="text-base font-extrabold text-amber-300">{currentVar.cloze}</p>
                  </div>
                )}
                {drillMode === "blind" && (
                  <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <p className="text-xs text-slate-400 italic">Speak the Spanish translation from memory!</p>
                  </div>
                )}

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => speakSpanish(currentVar.es, dialect)}
                    className="flex-1 py-2.5 bg-slate-800 rounded-xl text-xs font-extrabold text-white"
                  >
                    🔊 Hear Target
                  </button>
                  <button
                    onClick={() => listenVoiceRealtime((text) => evaluateDrillResponse(text), dialect)}
                    className="flex-1 py-2.5 bg-emerald-600 rounded-xl text-xs font-extrabold text-white shadow-lg"
                  >
                    {isRecording ? "🔴 Listening..." : "🎙️ Speak Drill"}
                  </button>
                </div>

                {drillFeedback && (
                  <div className={`p-3 rounded-xl text-xs font-bold ${drillFeedback.correct ? "bg-emerald-950 border border-emerald-500 text-emerald-300" : "bg-rose-950 border border-rose-500 text-rose-300"}`}>
                    <p>You said: "{drillFeedback.spoken}" ({drillFeedback.score}% Match)</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {navConfig.position !== "top" && renderNavBar()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
