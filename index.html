    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim();
    }

    // Detects if spoken input is actually English (so the app NEVER marks English speech as "100% Perfect Spanish"!)
    function isMostlyEnglishInput(text) {
      const tokens = normalizeText(text).split(/\s+/).filter(Boolean);
      if (!tokens.length) return false;
      const englishStopWords = new Set([
        "how", "do", "you", "say", "what", "is", "the", "word", "for", "in", "spanish",
        "mean", "means", "can", "tell", "me", "i", "want", "to", "know", "need", "more",
        "practice", "proof", "hello", "hi", "my", "name", "good", "morning", "night",
        "where", "when", "why", "who", "this", "that", "it", "with", "from", "about", "if"
      ]);
      // If it starts with "como se dice", check if they said mostly English
      let engCount = 0;
      tokens.forEach(t => {
        if (englishStopWords.has(t)) engCount++;
      });
      if (/^(how|what|can you|do you|i want|i need|tell me|where is)\b/i.test(text.trim())) return true;
      if (tokens.length === 1 && englishStopWords.has(tokens[0])) return true;
      return (engCount / tokens.length) >= 0.45;
    }

    function generatePhoneticGuide(spanishText, dialectCode = "es-CU") {
      if (!spanishText) return "";
      const words = spanishText
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      const convertWord = (rawW) => {
        let w = rawW.toLowerCase();
        if (dialectCode === "es-CU") {
          w = w.replace(/ado$/, "ao").replace(/ada$/, "á");
          w = w.replace(/s([tpckfbgd])/g, "h$1").replace(/s$/, "h");
        } else if (dialectCode === "es-AR") {
          w = w.replace(/ll/g, "sh").replace(/\by([aeiouáéíóú])/g, "sh$1");
        } else if (dialectCode === "es-ES") {
          w = w.replace(/z/g, "th").replace(/ce/g, "the").replace(/ci/g, "thi");
        }
        w = w
          .replace(/qué/g, "KEH")
          .replace(/que/g, "keh")
          .replace(/qu([eiéí])/g, "k$1")
          .replace(/gue/g, "geh")
          .replace(/gui/g, "gee")
          .replace(/ñ/g, "ny")
          .replace(/ll/g, "y")
          .replace(/j/g, "kh")
          .replace(/ge/g, "kheh")
          .replace(/gi/g, "khee")
          .replace(/ce/g, "seh")
          .replace(/ci/g, "see")
          .replace(/z/g, "s")
          .replace(/^h/g, "")
          .replace(/v/g, "b");
        return w;
      };

      return words.map(convertWord).join(" · ");
    }

    function wordSimilarity(a, b) {
      const s1 = normalizeText(a);
      const s2 = normalizeText(b);
      if (!s1 || !s2) return 0;
      if (s1 === s2) return 100;
      const phoneticNorm = (w) => w.replace(/v/g, "b").replace(/z/g, "s").replace(/ll/g, "y").replace(/s$/, "");
      if (phoneticNorm(s1) === phoneticNorm(s2)) return 82;

      const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
      for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
      for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;
      for (let j = 1; j <= s2.length; j += 1) {
        for (let i = 1; i <= s1.length; i += 1) {
          const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
          track[j][i] = Math.min(
            track[j][i - 1] + 1,
            track[j - 1][i] + 1,
            track[j - 1][i - 1] + indicator
          );
        }
      }
      const distance = track[s2.length][s1.length];
      const maxLen = Math.max(s1.length, s2.length);
      return Math.round(((maxLen - distance) / maxLen) * 100);
    }

    function scorePronunciation(expected, spoken) {
      const expWords = (expected || "").trim().split(/\s+/).filter(Boolean);
      const spkWords = (spoken || "").trim().split(/\s+/).filter(Boolean);
      if (!spkWords.length) {
        return {
          score: 0,
          breakdown: expWords.map(w => ({ word: w, status: "red", sim: 0, note: "Not heard" }))
        };
      }
      let totalSim = 0;
      const breakdown = expWords.map((expW, idx) => {
        let bestSim = 0;
        let matchedSpk = "";
        spkWords.forEach((spkW, sIdx) => {
          const sim = wordSimilarity(expW, spkW);
          const posPenalty = Math.abs(idx - sIdx) > 3 ? 10 : 0;
          const adjSim = Math.max(0, sim - posPenalty);
          if (adjSim > bestSim) {
            bestSim = adjSim;
            matchedSpk = spkW;
          }
        });
        totalSim += bestSim;
        let status = "red";
        let note = matchedSpk ? `Heard "${matchedSpk}"` : "Missed word";
        if (bestSim >= 85) {
          status = "green";
          note = "Perfect pronunciation!";
        } else if (bestSim >= 65) {
          status = "yellow";
          note = `Medium ("${matchedSpk}")`;
        }
        return { word: expW, status, sim: bestSim, note };
      });
      const score = Math.round(totalSim / expWords.length);
      return { score, breakdown };
    }

    function restoreSpanishPunctuation(rawText) {
      let s = (rawText || "").trim();
      if (!s) return "";
      s = s.replace(/\bmucho gusto\s+(?=[a-záéíóúñ])/gi, "mucho gusto, ");
      s = s
        .replace(/\bcomo estas\b/gi, "¿cómo estás?")
        .replace(/\bcomo se dice\b/gi, "¿cómo se dice")
        .replace(/\bque tal\b/gi, "¿qué tal?")
        .replace(/\bque bola\b/gi, "¿qué bolá?")
        .replace(/\by tu\b$/gi, "¿y tú?")
        .replace(/\btambien\b/gi, "también")
        .replace(/\bmas\b/gi, "más");
      s = s.charAt(0).toUpperCase() + s.slice(1);
      s = s.replace(/^(Hola|Buenas|Oye|Che|Quiubo)\s+(?=[a-záéíóúñ])/i, "$1, ");

      const isQuestion = /^(¿|Que|Qué|Como|Cómo|Donde|Dónde|Cuando|Cuándo|Por que|Por qué|Quien|Quién|Cual|Cuál)\b/i.test(s);
      if (isQuestion && !s.includes("?")) {
        if (!s.startsWith("¿")) {
          s = "¿" + s.charAt(0).toLowerCase() + s.slice(1) + "?";
          s = s.charAt(0) + s.charAt(1).toUpperCase() + s.slice(2);
        } else {
          s = s + "?";
        }
      } else if (!/[.?!]$/.test(s)) {
        s = s + ".";
      }
      return s;
    }

    function extractHowToSayQuery(text) {
      const cleaned = (text || "").replace(/[¿?¡!.,"]/g, "").trim();
      const patterns = [
        /(?:como se dice|cómo se dice|que significa|qué significa|como digo|cómo digo)\s+(.+)$/i,
        /(?:how do you say|how do i say|how to say|what is the word for|what's the word for|translate)\s+(.+?)(?:\s+in spanish|\s+en espanol|\s+en español)?$/i
      ];
      for (const pat of patterns) {
        const m = cleaned.match(pat);
        if (m && m[1]) {
          return m[1].replace(/\b(en espanol|en español|in spanish|por favor|please)\b/gi, "").trim();
        }
      }
      return null;
    }

    function gradeFreeSpeechWords(originalText, correctedText, rawConfidence, grammarMatches) {
      const origWords = (originalText || "").trim().split(/\s+/).filter(Boolean);
      const corrWords = (correctedText || "").replace(/[¿?¡!.,;:"]/g, "").trim().split(/\s+/).filter(Boolean);
      const baseConf = rawConfidence && rawConfidence > 0 ? rawConfidence : 0.88;

      const wrongWordSet = new Set();
      (grammarMatches || []).forEach(m => {
        (m.wrong || "").toLowerCase().split(/\s+/).forEach(w => wrongWordSet.add(normalizeText(w)));
      });

      const hardRedSet = new Set(["sabo", "poni", "poní", "teni", "tení", "haci", "hací", "gustario", "gustarío"]);

      return origWords.map((w, idx) => {
        const norm = normalizeText(w);
        const alignedCorr = corrWords[idx] || w;

        if (hardRedSet.has(norm)) {
          return {
            word: w,
            status: "red",
            label: "Bad / Grammar Error",
            score: 45,
            reason: `"${w}" is not a valid conjugation — check the Grammar Correction box below.`
          };
        }

        if (wrongWordSet.has(norm)) {
          return {
            word: w,
            status: "yellow",
            label: "Medium (Grammar/Word Missing)",
            score: 74,
            reason: `Good effort on "${w}", but a connector word (like 'es') or agreement fix was needed here.`
          };
        }

        const cleanOrig = w.replace(/[¿?¡!.,;:"]/g, "").toLowerCase();
        const cleanCorr = alignedCorr.toLowerCase();
        if (cleanOrig !== cleanCorr && normalizeText(cleanOrig) === normalizeText(cleanCorr)) {
          return {
            word: w,
            status: "yellow",
            label: "Medium (Accent)",
            score: 82,
            reason: `Good sound! Written with an accent mark: "${alignedCorr}".`
          };
        }

        if (baseConf >= 0.80) {
          return {
            word: w,
            status: "green",
            label: "Perfect",
            score: Math.min(99, Math.round(baseConf * 100) + 4),
            reason: "Perfect pronunciation & grammar!"
          };
        }

        return {
          word: w,
          status: "yellow",
          label: "Medium",
          score: Math.round(baseConf * 100),
          reason: "Medium pronunciation — tap to hear native speaker."
        };
      });
    }

    async function generateContextualTutorReply(userText, englishMeaning, dialectCode, turnHistoryCount, wasEnglishInput = false) {
      const d = DIALECTS[dialectCode] || DIALECTS["es-CU"];
      const norm = normalizeText(userText);

      // 1. Check if user asked "¿Cómo se dice [word]?" or "How do I say [word]?"
      const wordToTranslate = extractHowToSayQuery(userText);
      if (wordToTranslate) {
        const cleanQuery = wordToTranslate.toLowerCase().trim();
        if (QUICK_WORD_TIPS[cleanQuery]) {
          const tip = QUICK_WORD_TIPS[cleanQuery];
          return {
            es: `¡Buena pregunta, ${d.slangWord}! ${tip.tipEs}`,
            en: `Great question, bro! ${tip.tipEn}`
          };
        }

        try {
          const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q=${encodeURIComponent(cleanQuery)}`;
          const gtxRes = await fetch(gtxUrl);
          const gtxData = await gtxRes.json();
          const translatedEs = (gtxData && gtxData[0]) ? gtxData[0].map(seg => seg[0]).join("") : cleanQuery;
          return {
            es: `¡Claro que sí, ${d.slangWord}! "${cleanQuery}" en español se dice "${translatedEs}". Por ejemplo: "Necesito ${translatedEs} ahora." ¡Intenta decir "${translatedEs}" en voz alta!`,
            en: `Of course, bro! "${cleanQuery}" in Spanish is "${translatedEs}". For example: "I need ${translatedEs} now." Try saying "${translatedEs}" out loud!`
          };
        } catch (e) {}
      }

      // 2. If User Spoke directly in English (e.g. "proof", "need more practice", "I want to eat"), translate it to Spanish for them!
      if (wasEnglishInput) {
        const cleanEng = userText.replace(/[¿?¡!.,"]/g, "").trim().toLowerCase();
        if (QUICK_WORD_TIPS[cleanEng]) {
          return {
            es: QUICK_WORD_TIPS[cleanEng].tipEs,
            en: QUICK_WORD_TIPS[cleanEng].tipEn
          };
        }
        try {
          const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q=${encodeURIComponent(userText)}`;
          const gtxRes = await fetch(gtxUrl);
          const gtxData = await gtxRes.json();
          const spanishVersion = (gtxData && gtxData[0]) ? gtxData[0].map(seg => seg[0]).join("") : userText;
          return {
            es: `¡En español eso se dice: "${spanishVersion}"! Intenta repetir conmigo: "${spanishVersion}".`,
            en: `In Spanish you say that as: "${spanishVersion}"! Try repeating with me: "${spanishVersion}".`
          };
        } catch (e) {}
      }

      // 3. Check if User Introduced Themselves
      const nameMatch = userText.match(/(?:me llamo|soy|mi nombre es)\s+([a-zA-ZáéíóúÁÉÍÓÚñÑ]+)/i);
      if (nameMatch) {
        const userName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
        return {
          es: `¡El gusto es mío, ${userName}, ${d.slangWord}! Qué bolá, aquí tienes a tu socio ${d.tutor}. ¿Cómo va tu día hoy o qué palabra quieres aprender?`,
          en: `The pleasure is mine, ${userName}, bro! What's up, you've got your buddy ${d.tutor} here. How's your day going today or what word do you want to learn?`
        };
      }

      if (/\b(hola|buenas|que bola|como estas|que tal|todo bien|mucho gusto)\b/.test(norm)) {
        return {
          es: `¡Todo en talla por aquí, ${d.slangWord}, tranquilo y sin coger lucha! ¿Y tú qué me cuentas hoy?`,
          en: `Everything's great over here, bro, relaxed and stress-free! What about you today?`
        };
      }

      return {
        es: `¡Muy bien dicho en español, ${d.slangWord}! Eso sonó ${d.coolWord}. ¿Qué más quieres practicar o qué palabra en inglés quieres traducir?`,
        en: `Very well said in Spanish, bro! That sounded awesome. What else do you want to practice or what English word do you want to translate?`
      };
    }

    async function analyzeFreeSpeechAndCorrect(spokenRaw, confidence, dialectCode, turnCount = 0, forcedEnglishMode = false) {
      const cleanSpoken = (spokenRaw || "").trim();
      const detectedEnglish = forcedEnglishMode || isMostlyEnglishInput(cleanSpoken);

      // If the user spoke English, DO NOT grade it as "Perfect Spanish"! Instead, translate it into Spanish and show the Spanish equivalent.
      if (detectedEnglish) {
        let translatedToSpanish = cleanSpoken;
        const extractedWord = extractHowToSayQuery(cleanSpoken);
        const queryToTranslate = extractedWord || cleanSpoken;

        try {
          const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q=${encodeURIComponent(queryToTranslate)}`;
          const gtxRes = await fetch(gtxUrl);
          const gtxData = await gtxRes.json();
          if (gtxData && gtxData[0]) {
            translatedToSpanish = gtxData[0].map(seg => seg[0]).join("");
          }
        } catch (e) {}

        const aiReply = await generateContextualTutorReply(cleanSpoken, cleanSpoken, dialectCode, turnCount, true);
        const engWords = cleanSpoken.split(/\s+/).filter(Boolean).map(w => ({
          word: w,
          status: "english",
          label: "🇺🇸 English Spoken (Translated Below)",
          score: 100,
          reason: `You spoke "${w}" in English — see the instant Spanish translation below!`
        }));

        return {
          originalEs: cleanSpoken,
          correctedEs: `🇪🇸 En español: "${restoreSpanishPunctuation(translatedToSpanish)}"`,
          spanishTargetOnly: restoreSpanishPunctuation(translatedToSpanish),
          isGrammarPerfect: true,
          wasEnglish: true,
          explanations: [
            {
              wrong: cleanSpoken,
              right: restoreSpanishPunctuation(translatedToSpanish),
              reason: "Translated from English to Spanish so you can practice saying it in Spanish!"
            }
          ],
          englishMeaning: cleanSpoken,
          wordBreakdown: engWords,
          avgPronunciationScore: null,
          aiReply
        };
      }

      // Otherwise, grade their spoken Spanish!
      let workingCorrected = cleanSpoken;
      const explanations = [];

      GRAMMAR_RULES.forEach(rule => {
        const match = workingCorrected.match(rule.regex);
        if (match) {
          const wrongText = match[0];
          const replacedText = workingCorrected.replace(rule.regex, rule.replacement);
          workingCorrected = replacedText;
          explanations.push({
            wrong: wrongText,
            right: wrongText.replace(rule.regex, rule.replacement),
            reason: rule.reason
          });
        }
      });

      const punctuatedCorrected = restoreSpanishPunctuation(workingCorrected);

      let englishMeaning = "";
      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=${encodeURIComponent(punctuatedCorrected)}`;
        const gtxRes = await fetch(gtxUrl);
        const gtxData = await gtxRes.json();
        if (gtxData && gtxData[0]) {
          englishMeaning = gtxData[0].map(seg => seg[0]).join("");
        }
      } catch (e) {
        englishMeaning = "Spoken Spanish phrase";
      }

      const wordBreakdown = gradeFreeSpeechWords(cleanSpoken, punctuatedCorrected, confidence, explanations);
      const avgPronunciationScore = wordBreakdown.length
        ? Math.round(wordBreakdown.reduce((acc, w) => acc + w.score, 0) / wordBreakdown.length)
        : 0;

      const aiReply = await generateContextualTutorReply(punctuatedCorrected, englishMeaning, dialectCode, turnCount, false);

      return {
        originalEs: cleanSpoken,
        correctedEs: punctuatedCorrected,
        spanishTargetOnly: punctuatedCorrected,
        isGrammarPerfect: explanations.length === 0,
        wasEnglish: false,
        explanations,
        englishMeaning,
        wordBreakdown,
        avgPronunciationScore,
        aiReply
      };
    }

    async function autoTranslateWordOrPhrase(rawInput, forcedSourceLang = null) {
      const cleanInput = rawInput.trim();
      try {
        let sourceLang = forcedSourceLang || (isMostlyEnglishInput(cleanInput) ? "en" : "es");
        const targetLang = sourceLang === "es" ? "en" : "es";
        const transUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(cleanInput)}`;
        const transRes = await fetch(transUrl);
        const transData = await transRes.json();
        const translatedText = (transData && transData[0]) ? transData[0].map(seg => seg[0]).join("") : cleanInput;
        const finalEs = sourceLang === "es" ? cleanInput : translatedText;
        const finalEn = sourceLang === "en" ? cleanInput : translatedText;
        return { sourceLang, targetLang, es: finalEs, en: finalEn };
      } catch (err) {
        return { sourceLang: "es", targetLang: "en", es: cleanInput, en: cleanInput };
      }
    }

          const anySpanish = pool.find(v => v.lang.toLowerCase().startsWith("es"));

          if (exactVoice) u.voice = exactVoice;

          return;

        if (isAiSpeaking) {

        if (isRecording && activeRecognitionRef.current) {

            activeRecognitionRef.current.stop();

        const rec = new SpeechRec();
        activeRecognitionRef.current = rec;
        const useLang = overrideLang || dialect;
        rec.lang = useLang;
        setRecordingLangMode(useLang.startsWith("en") ? "en" : "es");
        rec.interimResults = true;
        rec.continuous = false;
        rec.maxAlternatives = 1;

        setIsRecording(true);
        setLiveInterimText("");

        let capturedFinal = "";
        let capturedInterim = "";
        let bestConfidence = 0.88;
        let hasSubmitted = false;

        rec.onresult = (e) => {
          let currentInterim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const seg = e.results[i][0].transcript;
            if (e.results[i].isFinal) {
              capturedFinal += seg + " ";
              if (e.results[i][0].confidence) bestConfidence = e.results[i][0].confidence;
            } else {
              currentInterim += seg;
            }
          }
          capturedInterim = currentInterim;
          setLiveInterimText((capturedFinal + currentInterim).trim());
        };

        rec.onerror = () => {
          setIsRecording(false);
          const fallbackText = (capturedFinal + " " + capturedInterim).trim();
          if (fallbackText && !hasSubmitted) {
            hasSubmitted = true;
            setLiveInterimText("");
            onFinalTranscript(fallbackText, bestConfidence);
          }
        };

        rec.onend = () => {
          setIsRecording(false);
          activeRecognitionRef.current = null;
          const completedText = (capturedFinal + " " + capturedInterim).trim();
          setLiveInterimText("");
          if (completedText && !hasSubmitted) {
            hasSubmitted = true;
            onFinalTranscript(completedText, bestConfidence);
          }

        try {
          rec.start();

          setIsRecording(false);

          {/* TAB: SPEAKING DRILLS */}
          {activeTab === "drills" && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
              <p className="text-[11px] uppercase tracking-wider text-purple-400 font-bold">
                Speaking Drill • Variation {varIdx + 1} of {currentDrill.variations.length}
              </p>
              <h2 className="text-xl font-extrabold text-white">"{currentVar.en}"</h2>
              <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-4 my-2">
                {renderClickableSpanish(currentVar.es)}
              </div>
              <div className="flex justify-center gap-2.5">
                <button
                  onClick={() => speakSpanish(currentVar.es)}
                  className="px-4 py-3 rounded-2xl bg-slate-800 text-xs font-extrabold"
                >
                  🔊 Hear Native
                </button>
                <button
                  onClick={() => listenVoiceRealtime((t) => speakSpanish("¡Excelente!"), dialect)}
                  className="px-5 py-3 rounded-2xl bg-purple-600 text-white text-xs font-extrabold"
                >
                  {isRecording ? "✅ Done" : "🎤 Tap & Speak"}
                </button>
              </div>
            </div>
          )}

          {/* TAB: SRS FLASHCARDS */}
          {activeTab === "cards" && currentCard && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
              <div
                onClick={() => setFlipped(!flipped)}
                className="min-h-[180px] flex flex-col items-center justify-center bg-slate-950 border border-slate-800 rounded-2xl p-5 cursor-pointer"
              >
                {!flipped ? (
                  <>
                    <p className="text-xs uppercase text-slate-400 mb-2">Tap Card to Flip</p>
                    <h2 className="text-2xl font-extrabold text-white">{currentCard.en}</h2>
                  </>
                ) : (
                  <div className="space-y-2">
                    {renderClickableSpanish(currentCard.es, "text-2xl font-extrabold text-emerald-400")}
                    <p className="text-sm text-slate-200 pt-2 font-semibold">"{currentCard.exEs}"</p>
                    <p className="text-xs text-slate-400">"{currentCard.exEn}"</p>
                  </div>
                )}
              </div>
              <div className="grid grid-cols-3 gap-2 text-xs font-extrabold">
                <button onClick={() => { setFlipped(false); setCardIdx(cardIdx + 1); }} className="py-2.5 rounded-xl bg-rose-950 border border-rose-700 text-rose-300">
                  🔴 Hard
                </button>
                <button onClick={() => { setFlipped(false); setCardIdx(cardIdx + 1); }} className="py-2.5 rounded-xl bg-amber-950 border border-amber-700 text-amber-300">
                  🟡 Good
                </button>
                <button onClick={() => { setFlipped(false); setCardIdx(cardIdx + 1); }} className="py-2.5 rounded-xl bg-emerald-950 border border-emerald-700 text-emerald-300">
                  🟢 Easy
                </button>
              </div>
            </div>
          )}

          {/* TAB: TRANSLATOR */}
          {activeTab === "dict" && (
            <div className="space-y-4">
              <form
                onSubmit={async (e) => {
                  e.preventDefault();
                  const res = await autoTranslateWordOrPhrase(searchQuery, null);
                  setDictResult(res);
                  speakSpanish(res.es, dialect);
                }}
                className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3"
              >
                <label className="text-xs font-bold text-purple-300 uppercase block">
                  🌍 Instant English ↔ Spanish Translator
                </label>
                <div className="flex gap-2">
                  <input
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Type any English or Spanish word..."
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm outline-none text-white"
                  />
                  <button type="submit" className="bg-purple-600 px-4 py-2.5 rounded-2xl font-extrabold text-sm">
                    Translate
                  </button>
                </div>
              </form>
              {dictResult && (
                <div className="bg-slate-900 border border-purple-500/40 rounded-3xl p-4 flex justify-between items-center">
                  <div>
                    <h3 className="text-xl font-extrabold text-white">{dictResult.es}</h3>
                    <p className="text-xs text-blue-300 mt-1">🇺🇸 {dictResult.en}</p>
                  </div>
                  <button
                    onClick={() => speakSpanish(dictResult.es, dialect)}
                    className="px-3.5 py-2 bg-emerald-600/20 border border-emerald-500/50 text-emerald-300 rounded-xl text-xs font-extrabold"
                  >
                    🔊 Hear
                  </button>
                </div>
              )}
            </div>
          )}

          {/* 5-TAB BOTTOM NAVIGATION BAR (Drills, Free AI, Media Immersion, SRS, Translator) */}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-2 py-2">
            <div className="max-w-md mx-auto grid grid-cols-5 items-center gap-1 text-[10px] font-extrabold">
              <button
                onClick={() => setActiveTab("drills")}
                className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "drills" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">🎯</span>
                <span>Drills</span>
              </button>

              <button
                onClick={() => {
                  setActiveTab("freeai");
                  setFreeAiViewMode("call");
                }}
                className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "freeai" ? "text-emerald-400" : "text-slate-400"}`}
              >
                <span className="text-base">🎙️</span>
                <span>Free AI</span>
              </button>

              <button
                onClick={() => setActiveTab("media")}
                className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "media" ? "text-amber-400" : "text-slate-400"}`}
              >
                <span className="text-base">🎧</span>
                <span>Media</span>
              </button>

              <button
                onClick={() => setActiveTab("cards")}
                className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "cards" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">🧠</span>
                <span>SRS ({cards.length})</span>
              </button>

              <button
                onClick={() => setActiveTab("dict")}
                className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "dict" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">🌍</span>
                <span>Translate</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
