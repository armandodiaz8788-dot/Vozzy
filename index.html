    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim();
    }

    // Street Phonetic "How It Actually Sounds" Decoder (Adapts to Cuba, Argentina, Spain, Mexico, Colombia)
    function generatePhoneticGuide(spanishText, dialectCode = "es-CU") {
      if (!spanishText) return "";
      const words = spanishText
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      const convertWord = (rawW) => {
        let w = rawW.toLowerCase();
        // Dialect-specific street transformations
        if (dialectCode === "es-CU") {
          // Cuban Spanish aspirates syllable-final 's' -> 'h' and drops 'd' in -ado
          w = w.replace(/ado$/, "ao").replace(/ada$/, "á");
          w = w.replace(/s([tpckfbgd])/g, "h$1").replace(/s$/, "h");
        } else if (dialectCode === "es-AR") {
          // Argentine Rioplatense turns ll / y before vowels into 'sh'
          w = w.replace(/ll/g, "sh").replace(/\by([aeiouáéíóú])/g, "sh$1");
        } else if (dialectCode === "es-ES") {
          // Castilian ceceo: z, ce, ci -> th
          w = w.replace(/z/g, "th").replace(/ce/g, "the").replace(/ci/g, "thi");
        }

        // Standard Spanish phonetic mappings for English speakers
        w = w
          .replace(/qué/g, "KEH")
          .replace(/que/g, "keh")
          .replace(/qu([eiéí])/g, "k$1")
          .replace(/gue/g, "geh")
          .replace(/gui/g, "gee")
          .replace(/güe/g, "gweh")
          .replace(/güi/g, "gwee")
          .replace(/ñ/g, "ny")
          .replace(/ll/g, "y")
          .replace(/ch/g, "ch")
          .replace(/j/g, "kh")
          .replace(/ge/g, "kheh")
          .replace(/gi/g, "khee")
          .replace(/ce/g, "seh")
          .replace(/ci/g, "see")
          .replace(/z/g, "s")
          .replace(/^h/g, "")
          .replace(/v/g, "b");

        return w;
      };

      return words.map(convertWord).join(" · ");
    }

    function wordSimilarity(a, b) {
      const s1 = normalizeText(a);
      const s2 = normalizeText(b);
      if (!s1 || !s2) return 0;
      if (s1 === s2) return 100;
      if (b.includes("*") && s1[0] === s2[0] && Math.abs(b.length - s1.length) <= 2) {
        return 95;
      }
      const phoneticNorm = (w) =>
        w.replace(/v/g, "b").replace(/z/g, "s").replace(/ll/g, "y").replace(/s$/, "");
      if (phoneticNorm(s1) === phoneticNorm(s2)) return 84;

      const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
      for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
      for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;
      for (let j = 1; j <= s2.length; j += 1) {
        for (let i = 1; i <= s1.length; i += 1) {
          const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
          track[j][i] = Math.min(
            track[j][i - 1] + 1,
            track[j - 1][i] + 1,
            track[j - 1][i - 1] + indicator
          );
        }
      }
      const distance = track[s2.length][s1.length];
      const maxLen = Math.max(s1.length, s2.length);
      return Math.round(((maxLen - distance) / maxLen) * 100);
    }

    function scorePronunciation(expected, spoken) {
      const expWords = (expected || "").trim().split(/\s+/).filter(Boolean);
      const spkWords = (spoken || "").trim().split(/\s+/).filter(Boolean);
      if (!spkWords.length) {
        return {
          score: 0,
          breakdown: expWords.map(w => ({ word: w, status: "red", sim: 0, note: "Not heard" }))
        };
      }

      let totalSim = 0;
      const breakdown = expWords.map((expW, idx) => {
        let bestSim = 0;
        let matchedSpk = "";
        spkWords.forEach((spkW, sIdx) => {
          const sim = wordSimilarity(expW, spkW);
          const posPenalty = Math.abs(idx - sIdx) > 3 ? 10 : 0;
          const adjSim = Math.max(0, sim - posPenalty);
          if (adjSim > bestSim) {
            bestSim = adjSim;
            matchedSpk = spkW;
          }
        });

        totalSim += bestSim;
        let status = "red";
        let note = matchedSpk ? `Heard "${matchedSpk}" — tap for X-Ray & audio` : "Missed word — tap to hear";
        if (bestSim >= 85) {
          status = "green";
          note = "Crisp native pronunciation!";
        } else if (bestSim >= 65) {
          status = "yellow";
          note = `Close ("${matchedSpk}") — slight slur`;
        }
        return { word: expW, status, sim: bestSim, note };
      });

      const score = Math.round(totalSim / expWords.length);
      return { score, breakdown };
    }

    const GRAMMAR_RULES = [

    function gradeFreeSpeechWords(transcript, rawConfidence, grammarMatches) {
      const words = (transcript || "").trim().split(/\s+/).filter(Boolean);
      const baseConf = rawConfidence && rawConfidence > 0 ? rawConfidence : 0.88;
      const yellowOrRedTokens = new Set();
      const redTokens = new Set(["sabo", "poni", "poní", "teni", "tení", "haci", "hací"]);

      (grammarMatches || []).forEach(m => {
        const wrongParts = (m.wrong || "").toLowerCase().split(/\s+/);
        wrongParts.forEach(p => yellowOrRedTokens.add(normalizeText(p)));
      });

      const englishBleedWords = new Set(["the", "and", "because", "with", "about", "what", "where", "fuck", "shit", "money", "friend"]);

      return words.map((w) => {
        const norm = normalizeText(w);
        if (w.includes("*")) {
          return { word: w, status: "green", score: 94, reason: "Uncensored street slang recognized!" };
        }
        if (redTokens.has(norm) || englishBleedWords.has(norm)) {
          return {
            word: w,
            status: "red",
            score: 48,
            reason: englishBleedWords.has(norm) ? `"${w}" is English — use Spanish here!` : `"${w}" is an invalid conjugation.`
          };
        }
        if (yellowOrRedTokens.has(norm)) {
          return { word: w, status: "yellow", score: 76, reason: `Pronounced clearly, but "${w}" needs a grammar tweak.` };
        }
        const wordLenBonus = norm.length >= 4 ? 0.04 : 0;
        const effectiveConf = Math.min(0.99, baseConf + wordLenBonus);
        if (effectiveConf >= 0.82) {
          return { word: w, status: "green", score: Math.round(effectiveConf * 100), reason: "Crisp pronunciation & valid Spanish cadence!" };
        }
        if (effectiveConf >= 0.65) {
          return { word: w, status: "yellow", score: Math.round(effectiveConf * 100), reason: "Slight slur/accent — tap for X-Ray & audio." };
        }
        return { word: w, status: "red", score: Math.round(effectiveConf * 100), reason: "Unclear pronunciation — tap to hear native audio." };
      });
    }

    async function analyzeFreeSpeechAndCorrect(spokenEs, confidence, dialectCode) {
      const cleanSpoken = (spokenEs || "").trim();

      GRAMMAR_RULES.forEach(rule => {

        if (match) {
          const wrongText = match[0];
          workingCorrected = workingCorrected.replace(rule.regex, rule.replacement);
          explanations.push({ wrong: wrongText, right: rule.replacement, reason: rule.reason });
        }
      });

      try {
        const params = new URLSearchParams();
        params.append("text", workingCorrected);
        params.append("language", "es");
        const ltRes = await fetch("https://api.languagetool.org/v2/check", {
          method: "POST",

        if (ltRes.ok) {
          const ltData = await ltRes.json();
          if (ltData && Array.isArray(ltData.matches)) {
            const validMatches = ltData.matches.filter(m =>
              m.replacements && m.replacements.length > 0 && m.rule &&
              m.rule.issueType !== "typographical" && m.rule.id !== "UPPERCASE_SENTENCE_START"
            );
            validMatches.slice(0, 3).forEach(m => {
              const wrongFrag = workingCorrected.substr(m.offset, m.length);
              const bestRep = m.replacements[0].value;
              if (normalizeText(wrongFrag) !== normalizeText(bestRep)) {
                explanations.push({ wrong: wrongFrag, right: bestRep, reason: m.message || "Spanish grammar fix" });
              }
            });
            validMatches
              .sort((a, b) => b.offset - a.offset)
              .forEach(m => {
                const bestRep = m.replacements[0].value;
                workingCorrected = workingCorrected.slice(0, m.offset) + bestRep + workingCorrected.slice(m.offset + m.length);

    function looksLikeSpanish(text) {
      const raw = (text || "").trim().toLowerCase();
      if (/[áéíóúñü¿¡]/.test(raw)) return true;
      const tokens = raw.split(/\s+/);
      const spanishMarkers = new Set([
        "el", "la", "los", "las", "un", "una", "yo", "tu", "usted", "que", "como", "donde",
        "cuando", "porque", "para", "por", "con", "sin", "hola", "gracias", "perro", "gato",
        "agua", "casa", "carro", "trabajo", "amigo", "dinero", "comida", "mierda", "puta",
        "puto", "carajo", "coño", "cono", "pinga", "singar", "singao", "comemierda", "chingar",
        "chingado", "chingon", "verga", "pendejo", "cabron", "culero", "pinche", "gonorrea",
        "malparido", "hijueputa", "jueputa", "marica", "pirobo", "joder", "hostia", "gilipollas",
        "capullo", "cojones", "polla", "boludo", "pelotudo", "concha", "quilombo", "forro",
        "cagar", "asere", "parcero", "parce", "chido", "chimba", "bacano", "tio", "guita"
      ]);
      if (tokens.some(t => spanishMarkers.has(normalizeText(t)))) return true;
      if (tokens.length === 1) {
        const w = normalizeText(tokens[0]);
        if (/(cion|siones|miento|dad|dades|ito|ita|ando|iendo|arse|erse|irse)$/.test(w)) return true;
      }
      return false;
    }

        let translatedText = (transData && transData[0]) ? transData[0].map(seg => seg[0]).join("") : cleanInput;

        if (normalizeText(translatedText) === normInput) {
          const mmRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanInput)}&langpair=${sourceLang}|${targetLang}`);
          const mmData = await mmRes.json();
          if (mmData && mmData.responseData && mmData.responseData.translatedText) {
            translatedText = mmData.responseData.translatedText;
          }
        }

        const finalEs = sourceLang === "es" ? cleanInput : translatedText;
        const finalEn = sourceLang === "en" ? cleanInput : translatedText;

        return {
          sourceLang,
          targetLang,
          isCurse: false,
          es: finalEs,
          en: finalEn,
          byDialect: buildDynamicDialectBreakdown(finalEs, finalEn)
        };
      } catch (err) {
        const sourceLang = forcedSourceLang || (looksLikeSpanish(cleanInput) ? "es" : "en");
        return {
          sourceLang,
          targetLang: sourceLang === "es" ? "en" : "es",
          isCurse: false,
          es: cleanInput,
          en: `${cleanInput} (Offline)`,
          byDialect: buildDynamicDialectBreakdown(cleanInput, cleanInput)
        };
      }
    }

    function generateContextualExamples(esWord, enMeaning, dialectCode) {
      const d = DIALECTS[dialectCode] || DIALECTS["es-CU"];
      const cleanEs = esWord.split("/")[0].trim();
      const cleanEn = enMeaning.split("/")[0].trim();
      return [
        { id: "street", label: `🌆 ${d.flag} Street & Casual`, es: `Oye ${d.slangWord}, hablar de "${cleanEs}" aquí siempre está ${d.coolWord}.`, en: `Hey bro, talking about "${cleanEn}" here is always super cool.` },
        { id: "raw", label: "🤬 18+ Raw / Heated", es: `${d.curseExclaim} ¡No me jodas con "${cleanEs}" ahora mismo, ${d.slangWord}!`, en: `Damn it! Don't fuck with me about "${cleanEn}" right now, bro!` },
        { id: "social", label: "🍽️ Social & Hangout", es: `Cuando nos veamos más tarde, tenemos que hablar sobre ${cleanEs}.`, en: `When we meet up later, we have to talk about ${cleanEn}.` },
        { id: "work", label: "💼 Work & Daily Life", es: `Hoy todo el mundo me estaba preguntando por ${cleanEs}.`, en: `Today everyone was asking me about ${cleanEn}.` },
        { id: "travel", label: "✈️ Travel & On the Go", es: `Disculpe, ¿me puede decir dónde encuentro ${cleanEs} por aquí cerca?`, en: `Excuse me, can you tell me where I can find ${cleanEn} near here?` }
      ];
    }

    function getLevelTitle(xp) {
      if (xp < 100) return { lvl: 1, title: "Novato" };
      if (xp < 250) return { lvl: 2, title: "Callejero" };
      if (xp < 500) return { lvl: 3, title: "En Talla" };
      if (xp < 1000) return { lvl: 4, title: "Candela" };
      return { lvl: 5, title: "Maestro" };
    }

    function App() {
      const [activeTab, setActiveTab] = useState("drills");
      const [dialect, setDialect] = useState("es-CU");
      // 3-Stage Speed Ladder: 0.75 (Slow), 1.0 (Normal), 1.25 (Street Fast)
      const [speechRate, setSpeechRate] = useState(1.0);
      const [showPhonetics, setShowPhonetics] = useState(true);

      const [stats, setStats] = useState(() => {
        const saved = localStorage.getItem("vozzy_stats_v5");
        const today = new Date().toISOString().slice(0, 10);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.lastDate !== today) return { ...parsed, dailyXp: 0, lastDate: today };
          return parsed;
        }
        return { xp: 60, dailyXp: 60, streak: 7, lastDate: today };
      });

      const [drills, setDrills] = useState(() => {
        const saved = localStorage.getItem("vozzy_drills_v5");
        return saved ? JSON.parse(saved) : INITIAL_DRILLS;
      });

      const [cards, setCards] = useState(() => {
        const saved = localStorage.getItem("vozzy_cards_v5");
        if (saved) {
          return JSON.parse(saved).map(c => ({ ...c, box: c.box || 1, nextReview: c.nextReview || 0, reps: c.reps || 0 }));
        }
        return INITIAL_CARDS;
      });

      const [savedWords, setSavedWords] = useState(() => {
        const saved = localStorage.getItem("vozzy_dict_history_v5");
        return saved ? JSON.parse(saved) : [];
      });

      const [voices, setVoices] = useState([]);
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      // Drills + Hands-Free Auto-Loop + Voice Recording Comparison State
      const [activeDrillIdx, setActiveDrillIdx] = useState(0);
      const [varIdx, setVarIdx] = useState(0);
      const [stage, setStage] = useState(1);
      const [isRecording, setIsRecording] = useState(false);
      const [autoCoachLoop, setAutoCoachLoop] = useState(false);
      const [myAudioUrl, setMyAudioUrl] = useState(null);
      const [liveInterimText, setLiveInterimText] = useState("");
      const [spokenText, setSpokenText] = useState("");
      const [evalResult, setEvalResult] = useState(null);
      const [toast, setToast] = useState("");

      // Tap-Any-Word Instant X-Ray Modal State
      const [xrayWord, setXrayWord] = useState(null);
      const [xrayLoading, setXrayLoading] = useState(false);

      // Backup / Restore Modal State
      const [showBackupModal, setShowBackupModal] = useState(false);
      const [backupJsonText, setBackupJsonText] = useState("");

      // Free Speaking AI + Guided Scenario Missions State
      const [activeMissionId, setActiveMissionId] = useState("free");
      const [completedGoals, setCompletedGoals] = useState({});
      const [freeAiAnalyzing, setFreeAiAnalyzing] = useState(false);
      const [freeAiInput, setFreeAiInput] = useState("");
      const [selectedFreeWord, setSelectedFreeWord] = useState(null);
      const [freeSessionTurns, setFreeSessionTurns] = useState(() => [
        {
          id: "welcome",
          role: "ai",
          es: DIALECTS["es-CU"].greeting,
          en: "What's up, bro! Tap any word to see its X-Ray or pick a mission below to practice real-world Spanish."
        }
      ]);

      // SRS State
      const [cardIdx, setCardIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [cardEval, setCardEval] = useState(null);
      const [srsFilterDue, setSrsFilterDue] = useState(false);

      // Translator State
      const [searchQuery, setSearchQuery] = useState("");
      const [isTranslating, setIsTranslating] = useState(false);
      const [dictResult, setDictResult] = useState(null);
      const [activeContextIdx, setActiveContextIdx] = useState(0);
      const [slangFilter, setSlangFilter] = useState("ALL");
      const [vaultTypeFilter, setVaultTypeFilter] = useState("ALL");

      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      useEffect(() => {
        localStorage.setItem("vozzy_stats_v5", JSON.stringify(stats));
      }, [stats]);

      useEffect(() => {
        localStorage.setItem("vozzy_drills_v5", JSON.stringify(drills));
      }, [drills]);

      useEffect(() => {
        localStorage.setItem("vozzy_cards_v5", JSON.stringify(cards));
      }, [cards]);

      useEffect(() => {
        localStorage.setItem("vozzy_dict_history_v5", JSON.stringify(savedWords));
      }, [savedWords]);

      useEffect(() => {
        const loadVoices = () => {
          if ("speechSynthesis" in window) {
            const available = window.speechSynthesis.getVoices();
            if (available.length) setVoices(available);
          }
        };
        loadVoices();
        if ("speechSynthesis" in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener("online", handleOnline);
        window.addEventListener("offline", handleOffline);
        return () => {
          window.removeEventListener("online", handleOnline);
          window.removeEventListener("offline", handleOffline);
        };
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3200);
      };

      const awardXp = (amount, label) => {
        const today = new Date().toISOString().slice(0, 10);
        setStats(prev => {
          const isNewDay = prev.lastDate !== today;
          const newStreak = isNewDay ? prev.streak + 1 : prev.streak;
          return {
            xp: prev.xp + amount,
            dailyXp: (isNewDay ? 0 : prev.dailyXp) + amount,
            streak: newStreak,
            lastDate: today
          };
        });
        showToast(`⚡ +${amount} XP! ${label || ""}`);
      };

      const cycleSpeedLadder = () => {
        if (speechRate === 1.0) setSpeechRate(1.25);
        else if (speechRate === 1.25) setSpeechRate(0.75);
        else setSpeechRate(1.0);
      };

      const speakSpanish = (text, targetLangCode = null, onEndCallback = null) => {
        if (!("speechSynthesis" in window)) {
          if (onEndCallback) onEndCallback();
          return;
        }
        window.speechSynthesis.cancel();
        const langToUse = targetLangCode || dialect;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = langToUse;
        u.rate = speechRate;

        const exactVoice = voices.find(v => v.lang.replace("_", "-").toLowerCase() === langToUse.toLowerCase());
        const localSpanish = voices.find(v => v.lang.toLowerCase().startsWith("es") && v.localService);
        const anySpanish = voices.find(v => v.lang.toLowerCase().startsWith("es"));
        if (exactVoice) u.voice = exactVoice;
        else if (localSpanish) u.voice = localSpanish;
        else if (anySpanish) u.voice = anySpanish;

        if (onEndCallback) {
          u.onend = () => onEndCallback();
        }
        window.speechSynthesis.speak(u);
      };

      // Tap-Any-Word Instant X-Ray Inspector
      const inspectWordXray = async (rawToken) => {
        const cleaned = (rawToken || "").replace(/[¿?¡!.,;:"()]/g, "").trim();
        if (!cleaned) return;
        setXrayLoading(true);
        setXrayWord({
          word: cleaned,
          phonetic: generatePhoneticGuide(cleaned, dialect),
          en: "Translating...",
          exEs: "",
          exEn: ""
        });
        speakSpanish(cleaned, dialect);

        const res = await autoTranslateWordOrPhrase(cleaned, "es");
        const dEntry = res.byDialect && res.byDialect[dialect];
        setXrayWord({
          word: cleaned,
          phonetic: generatePhoneticGuide(cleaned, dialect),
          en: res.en,
          dialectNote: dEntry ? dEntry.term : `${cleaned} (${DIALECTS[dialect].short})`,
          exEs: dEntry ? dEntry.exEs : `Quiero usar "${cleaned}" en una oración.`,
          exEn: dEntry ? dEntry.exEn : `I want to use "${res.en}" in a sentence.`
        });
        setXrayLoading(false);
      };

      // Render Clickable Spanish Sentence where EVERY word opens the Instant X-Ray Sheet
      const renderClickableSpanish = (sentence, textClass = "text-lg font-bold text-emerald-400") => {
        const tokens = (sentence || "").split(/\s+/).filter(Boolean);
        return (
          <div className="space-y-1">
            <div className="flex flex-wrap justify-center gap-x-1.5 gap-y-1">
              {tokens.map((tok, i) => (
                <span
                  key={i}
                  onClick={(e) => {
                    e.stopPropagation();
                    inspectWordXray(tok);
                  }}
                  className={`${textClass} underline decoration-dotted decoration-purple-400/60 underline-offset-4 cursor-pointer hover:text-purple-300 active:scale-95 transition`}
                  title="Tap for Instant Word X-Ray"
                >
                  {tok}
                </span>
              ))}
            </div>
            {showPhonetics && (
              <p className="text-[11px] font-mono text-amber-300/90 tracking-wide">
                🗣️ Sounds like: [{generatePhoneticGuide(sentence, dialect)}]
              </p>
            )}
          </div>
        );
      };

      // Optional Parallel Voice Audio Recorder for "Hear My Voice vs Native"
      const startParallelAudioCapture = async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunksRef.current = [];
          const mr = new MediaRecorder(stream);
          mr.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) audioChunksRef.current.push(ev.data);
          };
          mr.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: "audio/webm" });
            const url = URL.createObjectURL(blob);
            setMyAudioUrl(url);
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorderRef.current = mr;
          mr.start();
        } catch (e) {
          // Gracefully ignore if Android locks mic exclusively for SpeechRecognition
        }
      };

      const stopParallelAudioCapture = () => {
        try {
          if (mediaRecorderRef.current && mediaRecorderRef.current.state !== "inactive") {
            mediaRecorderRef.current.stop();
          }
        } catch (e) {}
      };

      // Real-Time Streaming Voice Listener
      const listenVoiceRealtime = (onFinalTranscript) => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert("Speech recognition requires Chrome, Samsung Internet, Edge, or Safari.");
          return;
        }
        const rec = new SpeechRec();
        rec.lang = dialect;
        rec.interimResults = true;
        rec.maxAlternatives = 1;

        setIsRecording(true);
        setLiveInterimText("");
        startParallelAudioCapture();

        let finalTranscript = "";
        let finalConfidence = 0.88;

        rec.onresult = (e) => {
          let interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const seg = e.results[i][0].transcript;
            if (e.results[i].isFinal) {
              finalTranscript += seg + " ";
              if (e.results[i][0].confidence) {
                finalConfidence = e.results[i][0].confidence;
              }
            } else {
              interim += seg;
            }
          }
          setLiveInterimText((finalTranscript + interim).trim());
        };

        rec.onerror = () => {
          setIsRecording(false);
          stopParallelAudioCapture();
        };

        rec.onend = () => {
          setIsRecording(false);
          stopParallelAudioCapture();
          const completedText = (finalTranscript || liveInterimText).trim();
          setLiveInterimText("");
          if (completedText) {
            onFinalTranscript(completedText, finalConfidence);
          }
        };

        rec.start();
      };

      const currentDrill = drills[activeDrillIdx] || drills[0];
      const currentVar = currentDrill.variations[varIdx] || currentDrill.variations[0];

      const advanceDrill = (fromAutoLoop = false) => {
        setEvalResult(null);
        setSpokenText("");
        let nextStage = stage;
        let nextVarIdx = varIdx;

        if (stage < 3) {
          nextStage = stage + 1;
          setStage(nextStage);
        } else {
          nextStage = 1;
          setStage(1);
          if (varIdx + 1 < currentDrill.variations.length) {
            nextVarIdx = varIdx + 1;
            setVarIdx(nextVarIdx);
          } else {
            nextVarIdx = 0;
            setVarIdx(0);
            awardXp(50, "Unit Mastered Bonus!");
          }
        }

        if (fromAutoLoop || autoCoachLoop) {
          const nextVariation = currentDrill.variations[nextVarIdx] || currentDrill.variations[0];
          setTimeout(() => {
            speakSpanish(nextVariation.es, dialect, () => {
              setTimeout(() => handleDrillMic(nextVariation.es), 350);
            });
          }, 500);
        }
      };

      const handleDrillMic = (overrideExpectedEs = null) => {
        const targetEs = overrideExpectedEs || currentVar.es;
        listenVoiceRealtime((transcript) => {
          setSpokenText(transcript);
          const res = scorePronunciation(targetEs, transcript);
          setEvalResult(res);
          if (res.score >= 85) {
            awardXp(25, "Passed Pronunciation Gate!");
            if (autoCoachLoop) {
              speakSpanish("¡Excelente! Seguimos.", dialect, () => {
                advanceDrill(true);
              });
            } else {
              speakSpanish("¡Excelente!");
            }
          }
        });
      };

      const currentMission = SCENARIO_MISSIONS.find(m => m.id === activeMissionId) || SCENARIO_MISSIONS[0];

      const selectMission = (mission) => {
        setActiveMissionId(mission.id);
        setFreeSessionTurns([
          {
            id: "m_" + Date.now(),
            role: "ai",
            es: mission.starterEs,
            en: mission.starterEn
          }
        ]);
        speakSpanish(mission.starterEs, dialect);
      };

      const processFreeSpeechTurn = async (rawSpokenText, confidenceScore = 0.9) => {
        const text = (rawSpokenText || "").trim();
        if (!text) return;
        setFreeAiAnalyzing(true);
        setSelectedFreeWord(null);

        // Check if any mission goals were completed by this spoken sentence!
        const newlyChecked = { ...completedGoals };
        let goalJustHit = false;
        currentMission.goals.forEach(g => {
          const key = `${currentMission.id}_${g.id}`;
          if (!newlyChecked[key] && g.check(text)) {
            newlyChecked[key] = true;
            goalJustHit = true;
          }
        });
        if (goalJustHit) {
          setCompletedGoals(newlyChecked);
        }

        const analysis = await analyzeFreeSpeechAndCorrect(text, confidenceScore, dialect);

        const userTurn = { id: "u_" + Date.now(), role: "user", analysis };
        const aiTurn = { id: "ai_" + (Date.now() + 1), role: "ai", es: analysis.aiReply.es, en: analysis.aiReply.en };

        setFreeSessionTurns(prev => [...prev, userTurn, aiTurn]);
        setFreeAiInput("");
        setFreeAiAnalyzing(false);

        speakSpanish(analysis.aiReply.es, dialect);
        awardXp(goalJustHit ? 35 : 20, goalJustHit ? "Mission Goal Completed! 🎯" : "Speech Graded & Corrected!");
      };

      const now = Date.now();
      const dueCards = cards.filter(c => (c.nextReview || 0) <= now);
      const activeDeck = srsFilterDue && dueCards.length > 0 ? dueCards : cards;
      const currentCard = activeDeck[cardIdx % activeDeck.length] || cards[0];

      const rateCardSRS = (cardId, difficulty) => {
        setCards(prev =>
          prev.map(c => {
            if (c.id !== cardId) return c;
            let newBox = c.box || 1;
            if (difficulty === "hard") newBox = 1;
            else if (difficulty === "good") newBox = Math.min(5, newBox + 1);
            else if (difficulty === "easy") newBox = Math.min(5, newBox + 2);
            const interval = SRS_INTERVALS[newBox] || 0;
            return { ...c, box: newBox, nextReview: Date.now() + interval, reps: (c.reps || 0) + 1 };
          })
        );
        awardXp(difficulty === "easy" ? 20 : 15, "SRS Box Updated!");
        setFlipped(false);
        setCardEval(null);
        setCardIdx((prev) => (prev + 1) % Math.max(1, activeDeck.length));
      };

      const runTranslation = async (rawQuery, forcedSourceLang = null) => {
        const cleanQ = rawQuery.trim();
        if (!cleanQ) return;
        setIsTranslating(true);
        setActiveContextIdx(0);

        const translated = await autoTranslateWordOrPhrase(cleanQ, forcedSourceLang);
        const contexts = generateContextualExamples(translated.es, translated.en, dialect);

        const resultObj = {
          query: cleanQ,
          sourceLang: translated.sourceLang,
          targetLang: translated.targetLang,
          isCurse: translated.isCurse,
          es: translated.es,
          en: translated.en,
          exEs: translated.exEs || contexts[0].es,
          exEn: translated.exEn || contexts[0].en,
          contexts,
          byDialect: translated.byDialect || buildDynamicDialectBreakdown(translated.es, translated.en)
        };

        setDictResult(resultObj);
        setIsTranslating(false);

        setSavedWords(prev => {
          const filtered = prev.filter(item => normalizeText(item.query) !== normalizeText(resultObj.query));
          return [resultObj, ...filtered].slice(0, 30);
        });

        awardXp(10, translated.sourceLang === "es" ? "Translated ES → EN!" : "Translated EN → ES!");
      };

      const handleSearch = (e) => {
        e.preventDefault();
        runTranslation(searchQuery, null);
      };

      const addWordToFlashcards = (esText, enText, exEs, exEn, tag = "📖 Coach") => {
        const newCard = {
          id: "c_" + Date.now(),
          es: esText,
          en: enText,
          exEs: exEs || `Ejemplo con ${esText}.`,
          exEn: exEn || `Example with ${enText}.`,
          tag,
          box: 1,
          nextReview: 0,
          reps: 0
        };
        setCards([newCard, ...cards]);
        awardXp(15, "Saved to SRS Flashcards!");
      };

      const addWordToDrills = (esText, enText, exEs, exEn) => {
        const cleanPhrase = esText.split("/")[0].replace(/\(.*?\)/g, "").trim();
        const targetSentence = exEs || cleanPhrase;
        const words = targetSentence.split(" ");
        const clozeSentence = words.map((w, i) => (i % 2 === 1 ? "___" : w)).join(" ");
        const newDrill = {
          id: "d_" + Date.now(),
          title: `Drill: ${cleanPhrase.slice(0, 22)}`,
          pattern: cleanPhrase,
          variations: [
            { en: enText || "Say this in Spanish", es: cleanPhrase, cloze: "___" },
            { en: exEn || `Practice: ${enText}`, es: targetSentence, cloze: clozeSentence }
          ]
        };
        setDrills([newDrill, ...drills]);
        setActiveDrillIdx(0);
        setVarIdx(0);
        setStage(1);
        awardXp(15, "Added to Speaking Drills!");
      };

      // Open Backup & Restore Modal
      const openBackup = () => {
        const payload = { stats, drills, cards, savedWords };
        setBackupJsonText(JSON.stringify(payload));
        setShowBackupModal(true);
      };

      const restoreBackup = () => {
        try {
          const parsed = JSON.parse(backupJsonText);
          if (parsed.stats) setStats(parsed.stats);
          if (parsed.drills) setDrills(parsed.drills);
          if (parsed.cards) setCards(parsed.cards);
          if (parsed.savedWords) setSavedWords(parsed.savedWords);
          setShowBackupModal(false);
          showToast("✅ Backup Restored Successfully!");
        } catch (e) {
          alert("Invalid backup code. Make sure you pasted the exact JSON text.");
        }
      };

      // Center Floating Mic Quick-Action
      const triggerGlobalQuickMic = () => {
        if (activeTab === "drills") {
          handleDrillMic();
        } else if (activeTab === "freeai") {
          listenVoiceRealtime((text, conf) => processFreeSpeechTurn(text, conf));
        } else if (activeTab === "cards" && currentCard) {
          listenVoiceRealtime((t) => {
            const res = scorePronunciation(currentCard.es, t);
            setCardEval({ spoken: t, score: res.score, breakdown: res.breakdown });
            setFlipped(true);
            if (res.score >= 85) rateCardSRS(currentCard.id, "good");
          });
        } else if (activeTab === "dict") {
          listenVoiceRealtime((t) => {
            setSearchQuery(t);
            runTranslation(t, null);
          });
        }
      };

      const levelInfo = getLevelTitle(stats.xp);
      const dailyProgressPct = Math.min(100, Math.round((stats.dailyXp / 100) * 100));

      const getPillColorClasses = (status) => {
        if (status === "green") return "bg-emerald-950/90 text-emerald-300 border-emerald-500/80";
        if (status === "yellow") return "bg-amber-950/90 text-amber-300 border-amber-500/80";
        return "bg-rose-950/90 text-rose-300 border-rose-500/80";
      };

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 pb-28 max-w-md mx-auto px-3.5 pt-3 select-none">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-4 py-2 rounded-full shadow-xl text-xs font-extrabold flex items-center gap-2 animate-bounce">
              {toast}
            </div>
          )}

          {/* TAP-ANY-WORD INSTANT X-RAY BOTTOM DRAWER */}
          {xrayWord && (
            <div
              onClick={() => setXrayWord(null)}
              className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center p-3"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-md bg-slate-900 border-2 border-purple-500 rounded-3xl p-4 space-y-3 shadow-2xl"
              >

                    />
                    <button
                      onClick={() => processFreeSpeechTurn(freeAiInput, 0.92)}
                      className="px-3.5 py-2.5 bg-emerald-600 rounded-2xl font-extrabold text-xs shrink-0"
                    >
                      Send
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: SPACED REPETITION (SRS) 3D FLASHCARDS */}
          {activeTab === "cards" && (
            <div className="space-y-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-extrabold text-purple-300">🧠 SRS Leitner Mastery Boxes</span>
                  <button
                    onClick={() => { setSrsFilterDue(!srsFilterDue); setCardIdx(0); }}
                    className={`text-[11px] font-bold px-2.5 py-1 rounded-xl border ${
                      srsFilterDue ? "bg-emerald-600/20 border-emerald-500 text-emerald-300" : "bg-slate-800 border-slate-700 text-slate-300"
                    }`}
                  >
                    {srsFilterDue ? `Showing Due (${dueCards.length})` : `All Cards (${cards.length})`}
                  </button>
                </div>
                <div className="grid grid-cols-5 gap-1.5 text-center text-[10px] font-bold">
                  {[1, 2, 3, 4, 5].map(b => {
                    const count = cards.filter(c => (c.box || 1) === b).length;
                    return (
                      <div key={b} className="bg-slate-950 border border-slate-800 rounded-xl py-1.5">
                        <div className="text-slate-400">Box {b}</div>
                        <div className="text-sm font-extrabold text-white">{count}</div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {currentCard && (
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
                  <div className="flex justify-between items-center text-xs text-slate-400">
                    <span className="px-2.5 py-1 rounded-full bg-slate-800 text-purple-300 font-bold">
                      {currentCard.tag}
                    </span>
                    <span className="px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-300 font-bold border border-amber-500/30">
                      SRS Box {currentCard.box || 1} / 5
                    </span>
                  </div>

                  <div
                    onClick={() => { setFlipped(!flipped); setCardEval(null); }}
                    className="min-h-[180px] flex flex-col items-center justify-center bg-slate-950 border border-slate-800 rounded-2xl p-5 cursor-pointer transition hover:border-purple-500"
                  >
                    {!flipped ? (
                      <>
                        <p className="text-xs uppercase text-slate-400 mb-2">Tap Card to Flip</p>
                        <h2 className="text-2xl font-extrabold text-white">{currentCard.en}</h2>
                        <p className="text-xs text-purple-400 mt-3">Recall & speak the Spanish phrase!</p>
                      </>
                    ) : (
                      <div className="space-y-2">
                        {renderClickableSpanish(currentCard.es, "text-2xl font-extrabold text-emerald-400")}
                        <p className="text-sm text-slate-200 pt-2 font-semibold">"{currentCard.exEs}"</p>
                        <p className="text-xs text-slate-400">"{currentCard.exEn}"</p>
                      </div>
                    )}
                  </div>

                  <div className="flex justify-center gap-2">
                    <button
                      onClick={() => speakSpanish(currentCard.es)}
                      className="px-3.5 py-2.5 bg-slate-800 rounded-xl text-xs font-bold"
                    >
                      🔊 Word
                    </button>
                    <button
                      onClick={() => speakSpanish(currentCard.exEs)}
                      className="px-3.5 py-2.5 bg-slate-800 rounded-xl text-xs font-bold"
                    >
                      🔊 Sentence
                    </button>
                    <button
                      onClick={() =>
                        listenVoiceRealtime((t) => {
                          const res = scorePronunciation(currentCard.es, t);
                          setCardEval({ spoken: t, score: res.score, breakdown: res.breakdown });
                          setFlipped(true);
                          if (res.score >= 85) rateCardSRS(currentCard.id, "good");
                        })
                      }
                      className="px-4 py-2.5 bg-purple-600 rounded-xl text-xs font-bold"
                    >
                      🎤 Speak to Grade
                    </button>
                  </div>

                  <div className="pt-2 border-t border-slate-800">
                    <div className="grid grid-cols-3 gap-2 text-xs font-extrabold">
                      <button
                        onClick={() => rateCardSRS(currentCard.id, "hard")}
                        className="py-2.5 rounded-xl bg-rose-950/80 border border-rose-700 text-rose-300"
                      >
                        🔴 Hard (Box 1)
                      </button>
                      <button
                        onClick={() => rateCardSRS(currentCard.id, "good")}
                        className="py-2.5 rounded-xl bg-amber-950/80 border border-amber-700 text-amber-300"
                      >
                        🟡 Good (+1 Box)
                      </button>
                      <button
                        onClick={() => rateCardSRS(currentCard.id, "easy")}
                        className="py-2.5 rounded-xl bg-emerald-950/80 border border-emerald-700 text-emerald-300"
                      >
                        🟢 Easy (+2 Box)
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 4: ALL-DIALECTS UNCENSORED TRANSLATOR & SLANG/CURSE VAULT */}
          {activeTab === "dict" && (
            <div className="space-y-4">
              <form onSubmit={handleSearch} className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-bold text-purple-300 uppercase tracking-wider">
                    🌍 All-Dialects Translator (ES ↔ EN)
                  </label>
                  <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/40">
                    🤬 18+ Uncensored
                  </span>
                </div>
                <div className="flex gap-2">
                  <input
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Type ANY word, slang, or curse word..."
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm outline-none text-white"
                  />
                  <button
                    type="submit"
                    disabled={isTranslating}
                    className="bg-purple-600 hover:bg-purple-500 disabled:opacity-50 px-4 py-2.5 rounded-2xl font-extrabold text-sm shrink-0"
                  >
                    {isTranslating ? "..." : "Translate"}
                  </button>
                </div>

                <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-0.5">
                  <span className="text-[10px] text-slate-400 font-bold shrink-0">Try:</span>
                  {["fuck", "shit", "asshole", "no mames", "comemierda", "boludo", "gonorrea", "cool", "money"].map(sample => (
                    <button
                      type="button"
                      key={sample}
                      onClick={() => {
                        setSearchQuery(sample);
                        runTranslation(sample, null);
                      }}
                      className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-950 hover:bg-purple-950 text-slate-300 border border-slate-800 shrink-0"
                    >
                      {sample}
                    </button>
                  ))}
                </div>
              </form>

              {dictResult && (
                <div className="bg-slate-900 border border-purple-500/40 rounded-3xl p-4 space-y-3.5 shadow-xl">
                  <div className="space-y-2">
                    <div className="bg-slate-950 border border-emerald-500/30 rounded-2xl p-3.5 flex justify-between items-center">
                      <div>
                        <span className="text-[10px] uppercase font-extrabold text-emerald-400 block">
                          🌎 Spanish + Street Phonetics
                        </span>
                        <h3 className="text-xl font-extrabold text-white mt-0.5">{dictResult.es}</h3>
                        <p className="text-[11px] font-mono text-amber-300 mt-0.5">
                          🗣️ [{generatePhoneticGuide(dictResult.es, dialect)}]
                        </p>
                      </div>
                      <button
                        onClick={() => speakSpanish(dictResult.es)}
                        className="px-3.5 py-2 bg-emerald-600/20 border border-emerald-500/50 text-emerald-300 rounded-xl text-xs font-extrabold shrink-0"
                      >
                        🔊 Hear
                      </button>
                    </div>

                    <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5">
                      <span className="text-[10px] uppercase font-extrabold text-blue-400 block">
                        🇺🇸 English Meaning
                      </span>
                      <h4 className="text-lg font-bold text-slate-200 mt-0.5">{dictResult.en}</h4>
                    </div>
                  </div>

                  {dictResult.byDialect && (
                    <div className="pt-2 border-t border-slate-800 space-y-2">
                      <p className="text-xs font-extrabold text-amber-400">
                        🌎 All 5 Dialects Breakdown:
                      </p>
                      <div className="space-y-2">
                        {Object.entries(DIALECTS).map(([code, dInfo]) => {
                          const dItem = dictResult.byDialect[code];
                          if (!dItem) return null;
                          return (
                            <div
                              key={code}
                              className={`bg-slate-950 p-3 rounded-2xl border text-xs space-y-1.5 ${
                                code === dialect ? "border-purple-500/60" : "border-slate-800"
                              }`}
                            >
                              <div className="flex justify-between items-center">
                                <span className="font-extrabold text-white">
                                  {dInfo.flag} {dInfo.short}: <span className="text-emerald-400">{dItem.term}</span>
                                </span>
                                <button
                                  onClick={() => speakSpanish(dItem.exEs, code)}
                                  className="px-2 py-1 bg-slate-800 rounded-lg text-purple-300 font-bold"
                                >
                                  🔊 Audio
                                </button>
                              </div>
                              <p className="text-slate-200 font-semibold">"{dItem.exEs}"</p>
                              <p className="text-[10px] font-mono text-amber-300/80">
                                🗣️ [{generatePhoneticGuide(dItem.exEs, code)}]
                              </p>
                              <p className="text-slate-400">"{dItem.exEn}"</p>
                              <div className="flex gap-2 pt-1">
                                <button
                                  onClick={() => addWordToDrills(dItem.term, `${dictResult.en} (${dInfo.short})`, dItem.exEs, dItem.exEn)}
                                  className="px-2.5 py-1 bg-purple-950/80 border border-purple-700/50 text-purple-300 rounded-lg font-bold text-[11px]"
                                >
                                  + Drill ({dInfo.flag})
                                </button>
                                <button
                                  onClick={() => addWordToFlashcards(dItem.term, `${dictResult.en} (${dInfo.short})`, dItem.exEs, dItem.exEn, `${dInfo.flag} ${dInfo.short}`)}
                                  className="px-2.5 py-1 bg-blue-950/80 border border-blue-700/50 text-blue-300 rounded-lg font-bold text-[11px]"
                                >
                                  + SRS Card ({dInfo.flag})
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Regional Slang & 18+ Curse Vault */}
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-extrabold text-sm text-amber-400">🌶️ Slang & 18+ Curse Vault</h3>
                  <select
                    value={slangFilter}
                    onChange={(e) => setSlangFilter(e.target.value)}
                    className="bg-slate-800 text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-700"
                  >
                    <option value="ALL">🌎 All 5 Dialects</option>
                    <option value="es-CU">🇨🇺 Cuba</option>
                    <option value="es-MX">🇲🇽 Mexico</option>
                    <option value="es-CO">🇨🇴 Colombia</option>
                    <option value="es-ES">🇪🇸 Spain</option>
                    <option value="es-AR">🇦🇷 Argentina</option>
                  </select>
                </div>

                <div className="space-y-2.5">
                  {SLANG_VAULT.filter(s => slangFilter === "ALL" || s.dialect === slangFilter).map((item) => (
                    <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-1.5">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-950 text-rose-300 border border-rose-700/50">
                            {item.badge}
                          </span>
                          <h4 className="font-extrabold text-base text-white mt-1">{item.phrase}</h4>
                        </div>
                        <button
                          onClick={() => speakSpanish(item.exEs, item.dialect)}
                          className="px-2.5 py-1.5 bg-slate-800 rounded-xl text-xs font-bold"
                        >
                          🔊 Audio
                        </button>
                      </div>
                      <p className="text-xs text-slate-400"><b>Literal:</b> "{item.literal}" • <b>Meaning:</b> {item.meaning}</p>
                      {renderClickableSpanish(item.exEs, "text-xs text-emerald-300 font-semibold")}
                      <p className="text-xs text-slate-500">"{item.exEn}"</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* THUMB-ZONE FIXED BOTTOM NAVIGATION DOCK + FLOATING CENTER MIC */}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-3 py-2">
            <div className="max-w-md mx-auto grid grid-cols-5 items-center gap-1 text-[11px] font-extrabold">
              <button
                onClick={() => setActiveTab("drills")}
                className={`flex flex-col items-center py-1.5 rounded-xl transition ${
                  activeTab === "drills" ? "text-purple-400" : "text-slate-400"
                }`}
              >
                <span className="text-base">🎯</span>
                <span>Drills</span>
              </button>

              <button
                onClick={() => setActiveTab("freeai")}
                className={`flex flex-col items-center py-1.5 rounded-xl transition ${
                  activeTab === "freeai" ? "text-purple-400" : "text-slate-400"
                }`}
              >
                <span className="text-base">💬</span>
                <span>Free AI</span>
              </button>

              {/* Floating Center Quick-Speak Mic Button */}
              <div className="flex justify-center -mt-6">
                <button
                  onClick={triggerGlobalQuickMic}
                  className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-xl border-4 border-[#090d16] transition active:scale-95 ${
                    isRecording
                      ? "bg-rose-600 animate-pulse text-white shadow-rose-600/50"
                      : "bg-gradient-to-tr from-purple-600 to-emerald-500 text-white shadow-purple-600/40"
                  }`}
                  title="Tap to Speak"
                >
                  🎤
                </button>
              </div>

              <button
                onClick={() => setActiveTab("cards")}
                className={`flex flex-col items-center py-1.5 rounded-xl transition ${
                  activeTab === "cards" ? "text-purple-400" : "text-slate-400"
                }`}
              >
                <span className="text-base">🧠</span>
                <span>SRS ({dueCards.length})</span>
              </button>

              <button
                onClick={() => setActiveTab("dict")}
                className={`flex flex-col items-center py-1.5 rounded-xl transition ${
                  activeTab === "dict" ? "text-purple-400" : "text-slate-400"
                }`}
              >
                <span className="text-base">🌍</span>
                <span>Translator</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
