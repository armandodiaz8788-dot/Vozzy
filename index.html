      50% { transform: scale(1.08); box-shadow: 0 0 55px rgba(168, 85, 247, 0.85), 0 0 95px rgba(16, 185, 129, 0.45); }

    @keyframes orbListen {

      50% { transform: scale(1.12); box-shadow: 0 0 65px rgba(16, 185, 129, 0.95), 0 0 110px rgba(52, 211, 153, 0.6); }
    }
    .orb-speaking { animation: orbPulse 1.6s infinite ease-in-out; }
    .orb-listening { animation: orbListen 1.2s infinite ease-in-out; }

<body>

    const DIALECTS = {

    const IMMERSION_MEDIA = [
      {
        id: "m1",
        type: "music",
        level: "A1 Beginner",
        genre: "Cuban Son / Classic",
        dialectTag: "🇨🇺 Cuba",
        title: "Chan Chan — Buena Vista Social Club",
        artist: "Compay Segundo",

        searchUrl: "https://www.youtube.com/results?search_query=Buena+Vista+Social+Club+Chan+Chan+lyrics"
      }
    ];

    const INITIAL_DRILLS = [
      {
        id: "d1",
        title: "Everyday Casual Invitations",
        pattern: "¿Qué tal si vamos por...?",
        variations: [
          { en: "How about we go get some tacos?", es: "¿Qué tal si vamos por unos tacos?", cloze: "¿Qué ___ si ___ por unos tacos?" },
          { en: "How about we go get a coffee?", es: "¿Qué tal si vamos por un café?", cloze: "¿Qué ___ si vamos ___ un café?" }
        ]
      }
    ];

    const INITIAL_CARDS = [
      { id: "c1", es: "¿Qué bolá?", en: "What's up? / How's it going?", exEs: "¿Qué bolá asere, cómo está la familia?", exEn: "What's up bro, how is the family?", tag: "🇨🇺 Cuba Slang", box: 1, nextReview: 0, reps: 0 },
      { id: "c2", es: "La prueba", en: "The proof / The test", exEs: "Necesito una prueba de que eso es verdad.", exEn: "I need proof that this is true.", tag: "🎯 Core Word", box: 1, nextReview: 0, reps: 0 }
    ];

    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim();
    }

    function isMostlyEnglishInput(text) {
      const tokens = normalizeText(text).split(/\s+/).filter(Boolean);
      if (!tokens.length) return false;
      const englishStopWords = new Set([
        "how", "do", "you", "say", "what", "is", "the", "word", "for", "in", "spanish",
        "mean", "means", "can", "tell", "me", "i", "want", "to", "know", "need", "more",
        "practice", "proof", "hello", "hi", "my", "name", "good", "morning", "night",
        "where", "when", "why", "who", "this", "that", "it", "with", "from", "about", "if"
      ]);
      let engCount = 0;
      tokens.forEach(t => { if (englishStopWords.has(t)) engCount++; });
      if (/^(how|what|can you|do you|i want|i need|tell me|where is)\b/i.test(text.trim())) return true;
      if (tokens.length === 1 && englishStopWords.has(tokens[0])) return true;
      return (engCount / tokens.length) >= 0.45;
    }

    function generatePhoneticGuide(spanishText, dialectCode = "es-CU") {
      if (!spanishText) return "";
      const words = spanishText.replace(/[¿?¡!.,;:"]/g, "").trim().split(/\s+/).filter(Boolean);
      const convertWord = (rawW) => {
        let w = rawW.toLowerCase();
        if (dialectCode === "es-CU") {
          w = w.replace(/ado$/, "ao").replace(/ada$/, "á");
          w = w.replace(/s([tpckfbgd])/g, "h$1").replace(/s$/, "h");
        }
        w = w
          .replace(/qué/g, "KEH").replace(/que/g, "keh").replace(/qu([eiéí])/g, "k$1")
          .replace(/ñ/g, "ny").replace(/ll/g, "y").replace(/j/g, "kh").replace(/v/g, "b");
        return w;
      };
      return words.map(convertWord).join(" · ");
    }

    function restoreSpanishPunctuation(rawText) {
      let s = (rawText || "").trim();
      if (!s) return "";
      s = s.charAt(0).toUpperCase() + s.slice(1);
      if (!/[.?!]$/.test(s)) s = s + ".";
      return s;
    }

    async function autoTranslateWordOrPhrase(rawInput, forcedSourceLang = null) {
      const cleanInput = rawInput.trim();
      try {
        let sourceLang = forcedSourceLang || (isMostlyEnglishInput(cleanInput) ? "en" : "es");
        const targetLang = sourceLang === "es" ? "en" : "es";
        const transUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(cleanInput)}`;
        const transRes = await fetch(transUrl);
        const transData = await transRes.json();
        const translatedText = (transData && transData[0]) ? transData[0].map(seg => seg[0]).join("") : cleanInput;
        return { sourceLang, targetLang, es: sourceLang === "es" ? cleanInput : translatedText, en: sourceLang === "en" ? cleanInput : translatedText };
      } catch (err) {
        return { sourceLang: "es", targetLang: "en", es: cleanInput, en: cleanInput };
      }
    }

    async function analyzeFreeSpeechAndCorrect(spokenRaw, confidence, dialectCode, turnCount = 0, forcedEnglishMode = false) {
      const cleanSpoken = (spokenRaw || "").trim();
      const detectedEnglish = forcedEnglishMode || isMostlyEnglishInput(cleanSpoken);

      if (detectedEnglish) {
        let translatedToSpanish = cleanSpoken;
        try {
          const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q=${encodeURIComponent(cleanSpoken)}`;
          const gtxRes = await fetch(gtxUrl);
          const gtxData = await gtxRes.json();
          if (gtxData && gtxData[0]) translatedToSpanish = gtxData[0].map(seg => seg[0]).join("");
        } catch (e) {}

        return {
          originalEs: cleanSpoken,
          correctedEs: `🇪🇸 En español: "${restoreSpanishPunctuation(translatedToSpanish)}"`,
          spanishTargetOnly: restoreSpanishPunctuation(translatedToSpanish),
          isGrammarPerfect: true,
          wasEnglish: true,
          englishMeaning: cleanSpoken,
          wordBreakdown: cleanSpoken.split(/\s+/).map(w => ({ word: w, status: "english", label: "🇺🇸 English", score: 100 })),
          avgPronunciationScore: null,
          aiReply: { es: `En español se dice: "${translatedToSpanish}".`, en: `In Spanish: "${translatedToSpanish}".` }
        };
      }

      let workingCorrected = cleanSpoken;
      const punctuatedCorrected = restoreSpanishPunctuation(workingCorrected);
      let englishMeaning = "Spoken Spanish phrase";
      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=${encodeURIComponent(punctuatedCorrected)}`;
        const gtxRes = await fetch(gtxUrl);
        const gtxData = await gtxRes.json();
        if (gtxData && gtxData[0]) englishMeaning = gtxData[0].map(seg => seg[0]).join("");
      } catch (e) {}

      return {
        originalEs: cleanSpoken,
        correctedEs: punctuatedCorrected,
        spanishTargetOnly: punctuatedCorrected,
        isGrammarPerfect: true,
        wasEnglish: false,
        englishMeaning,
        wordBreakdown: cleanSpoken.split(/\s+/).map(w => ({ word: w, status: "green", label: "Perfect", score: 95 })),
        avgPronunciationScore: 95,
        aiReply: { es: `¡Muy bien dicho, asere! ¿Qué más practicamos?`, en: `Very well said, bro! What else shall we practice?` }
      };
    }

    function App() {
      const [activeTab, setActiveTab] = useState("freeai");
      const [dialect, setDialect] = useState("es-CU");
      const [speechRate, setSpeechRate] = useState(1.0);
      const [showPhonetics, setShowPhonetics] = useState(true);

      const [handsFreeCallMode, setHandsFreeCallMode] = useState(true);
      const [freeAiViewMode, setFreeAiViewMode] = useState("call");
      const [isAiSpeaking, setIsAiSpeaking] = useState(false);

      const [userProfile, setUserProfile] = useState(() => {
        const saved = localStorage.getItem("vozzy_profile_v9");
        return saved ? JSON.parse(saved) : { assessed: false, tier: "A1 Beginner", favVibe: "Latin Music" };
      });
      const [showAssessmentModal, setShowAssessmentModal] = useState(false);
      const [quizStep, setQuizStep] = useState(1);
      const [quizComfort, setQuizComfort] = useState("beginner");
      const [quizGrammarAns, setQuizGrammarAns] = useState("");
      const [quizVibe, setQuizVibe] = useState("Cuban Son & Salsa");

      const [stats, setStats] = useState({ xp: 120, dailyXp: 120, streak: 7 });
      const [drills] = useState(INITIAL_DRILLS);
      const [activeDrillIdx, setActiveDrillIdx] = useState(0);
      const [varIdx, setVarIdx] = useState(0);
      const [cards, setCards] = useState(INITIAL_CARDS);
      const [voices, setVoices] = useState([]);

      const [isRecording, setIsRecording] = useState(false);
      const [liveInterimText, setLiveInterimText] = useState("");
      const [toast, setToast] = useState("");

      const [freeSessionTurns, setFreeSessionTurns] = useState([
        { id: "welcome", role: "ai", es: DIALECTS["es-CU"].greeting, en: "What's up, bro! Tap the orb to speak Spanish." }
      ]);

      // Camera Lens State & Manual Text Input Feature
      const videoRef = useRef(null);
      const [cameraActive, setCameraActive] = useState(false);
      const [scannedObject, setScannedObject] = useState(null);
      const [scanningLens, setScanningLens] = useState(false);
      const [manualInputWord, setManualInputWord] = useState("");
      const [manualResult, setManualResult] = useState(null);

      const activeRecognitionRef = useRef(null);
      const handsFreeRef = useRef(handsFreeCallMode);

      useEffect(() => { handsFreeRef.current = handsFreeCallMode; }, [handsFreeCallMode]);

      useEffect(() => {
        const loadVoices = () => {
          if ("speechSynthesis" in window) {
            const available = window.speechSynthesis.getVoices();
            if (available.length) setVoices(available);
          }
        };
        loadVoices();
        if ("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = loadVoices;
      }, []);

      useEffect(() => {
        if (activeTab === "lens") {
          startCameraStream();
        } else {
          stopCameraStream();
        }
        return () => stopCameraStream();
      }, [activeTab]);

      const startCameraStream = async () => {
        setCameraActive(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
          if (videoRef.current) videoRef.current.srcObject = stream;
        } catch (err) {
          setCameraActive(false);
        }
      };

      const stopCameraStream = () => {
        if (videoRef.current && videoRef.current.srcObject) {
          const stream = videoRef.current.srcObject;
          stream.getTracks().forEach(track => track.stop());
          videoRef.current.srcObject = null;
        }
        setCameraActive(false);
      };

      const captureAndTranslateObject = async () => {
        setScanningLens(true);
        const mockObjects = [
          { en: "Water bottle", es: "La botella de agua", icon: "🍼" },
          { en: "Coffee cup", es: "La taza de café", icon: "☕" },
          { en: "Pot / Pan", es: "La olla", icon: "🍲" },
          { en: "Smartphone", es: "El teléfono inteligente", icon: "📱" },
          { en: "Book / Notebook", es: "El cuaderno", icon: "📖" }
        ];
        const chosen = mockObjects[Math.floor(Math.random() * mockObjects.length)];
        setTimeout(() => {
          setScannedObject(chosen);
          setScanningLens(false);
          speakSpanish(chosen.es, dialect);
        }, 800);
      };

      const handleManualTranslateSubmit = async (e) => {
        e.preventDefault();
        if (!manualInputWord.trim()) return;
        const res = await autoTranslateWordOrPhrase(manualInputWord, null);
        const manualObj = {
          en: res.en,
          es: res.es,
          icon: "✍️"
        };
        setManualResult(manualObj);
        speakSpanish(res.es, dialect);
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3000);
      };

      const speakSpanish = (text, targetLangCode = null) => {
        if (!("speechSynthesis" in window) || !text) return;
        try { window.speechSynthesis.cancel(); window.speechSynthesis.resume(); } catch (e) {}
        setTimeout(() => {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = targetLangCode || dialect;
          u.rate = speechRate;
          const pool = window.speechSynthesis.getVoices().length ? window.speechSynthesis.getVoices() : voices;
          const exactVoice = pool.find(v => v.lang.replace("_", "-").toLowerCase() === u.lang.toLowerCase());
          if (exactVoice) u.voice = exactVoice;
          window.speechSynthesis.speak(u);
        }, 200);
      };

      const listenVoiceRealtime = (onFinalTranscript, overrideLang = null) => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert("Speech recognition is supported in Chrome, Safari, and Edge.");
          return;
        }
        const rec = new SpeechRec();
        activeRecognitionRef.current = rec;
        rec.lang = overrideLang || dialect;
        rec.interimResults = true;
        rec.continuous = false;

        setIsRecording(true);
        let captured = "";

        rec.onresult = (e) => {
          let interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) captured += e.results[i][0].transcript + " ";
            else interim += e.results[i][0].transcript;
          }
          setLiveInterimText((captured + interim).trim());
        };

        rec.onend = () => {
          setIsRecording(false);
          if (captured.trim()) onFinalTranscript(captured.trim(), 0.9);
        };

        try { rec.start(); } catch (e) { setIsRecording(false); }
      };

      const processFreeSpeechTurn = async (text, conf, forcedEnglish = false) => {
        const analysis = await analyzeFreeSpeechAndCorrect(text, conf, dialect, freeSessionTurns.length, forcedEnglish);
        setFreeSessionTurns(prev => [...prev, { id: "u_" + Date.now(), role: "user", analysis }, { id: "ai_" + Date.now(), role: "ai", es: analysis.aiReply.es, en: analysis.aiReply.en }]);
        speakSpanish(analysis.aiReply.es, dialect);
      };

      const addWordToFlashcards = (es, en) => {
        setCards([{ id: "c_" + Date.now(), es, en, exEs: es, exEn: en, tag: "📸 Camera / Manual" }, ...cards]);
        showToast("Saved to SRS Flashcards!");
      };

      const finishLevelPlacement = () => {
        let tier = quizComfort === "intermediate" ? "B1 Intermediate" : quizComfort === "high_beginner" ? "A2 High-Beginner" : "A1 Beginner";
        setUserProfile({ assessed: true, tier, favVibe: quizVibe });
        setShowAssessmentModal(false);
        showToast(`Level set to ${tier}!`);
      };

      const latestAiTurn = [...freeSessionTurns].reverse().find(t => t.role === "ai") || freeSessionTurns[0];
      const latestUserTurn = [...freeSessionTurns].reverse().find(t => t.role === "user") || null;
      const currentDrill = drills[activeDrillIdx] || drills[0];
      const currentVar = currentDrill.variations[varIdx] || currentDrill.variations[0];

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 pb-28 max-w-md mx-auto px-3.5 pt-3 select-none">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-4 py-2 rounded-full shadow-xl text-xs font-extrabold flex items-center gap-2 animate-bounce">
              {toast}
            </div>
          )}

          {/* Assessment Modal */}
          {showAssessmentModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-3">
              <div className="w-full max-w-md bg-slate-900 border-2 border-purple-500 rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h2 className="text-lg font-extrabold text-white">🎓 Retake Level Check</h2>
                  <button onClick={() => setShowAssessmentModal(false)} className="px-2.5 py-1 bg-slate-800 text-slate-400 rounded-xl text-xs font-bold">Close</button>
                </div>
                <div className="space-y-3">
                  <p className="text-xs text-slate-300">Select your current Spanish comfort level:</p>
                  {["beginner", "high_beginner", "intermediate"].map(lvl => (
                    <button key={lvl} onClick={() => setQuizComfort(lvl)} className={`w-full text-left p-3 rounded-2xl border text-xs font-extrabold ${quizComfort === lvl ? "bg-purple-950 border-purple-400 text-white" : "bg-slate-950 border-slate-800 text-slate-300"}`}>
                      {lvl === "beginner" ? "🌱 Beginner (A1)" : lvl === "high_beginner" ? "🔥 High-Beginner (A2)" : "🚀 Intermediate (B1+)"}
                    </button>
                  ))}
                  <button onClick={finishLevelPlacement} className="w-full py-3 bg-emerald-600 rounded-2xl text-xs font-extrabold text-white">Save Level</button>
                </div>
              </div>
            </div>
          )}

          {/* Header */}
          <div className="bg-slate-900/95 border border-slate-800 rounded-2xl p-2.5 mb-2.5 flex items-center justify-between shadow-lg">
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center text-lg shadow-md">🎙️</div>
              <div>
                <span className="font-extrabold text-sm">Vozzy</span>
                <button onClick={() => setShowAssessmentModal(true)} className="ml-2 text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                  🎓 {userProfile.tier}
                </button>
              </div>
            </div>
            <select
              value={dialect}
              onChange={(e) => setDialect(e.target.value)}
              className="bg-slate-800 text-[11px] font-bold rounded-xl px-2 py-1.5 border border-slate-700 text-slate-200 outline-none"
            >
              {Object.entries(DIALECTS).map(([code, d]) => (
                <option key={code} value={code}>{d.flag} {d.short}</option>
              ))}
            </select>
          </div>

          {/* TAB: CAMERA LENS & MANUAL TEXT TRANSLATION */}
          {activeTab === "lens" && (
            <div className="space-y-3">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-3 space-y-2 text-center">
                <span className="text-[10px] font-extrabold uppercase text-amber-400">
                  📸 AI Camera Lens & Manual Lookup
                </span>
                <div className="relative w-full h-56 bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
                  <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover"></video>
                  {!cameraActive && (
                    <div className="absolute inset-0 flex items-center justify-center bg-slate-950 text-xs text-slate-400">
                      Camera starting...
                    </div>
                  )}
                  <div className="absolute inset-0 border-2 border-dashed border-emerald-400/60 m-4 rounded-xl pointer-events-none flex items-center justify-center">
                    <span className="bg-black/60 text-emerald-300 text-[10px] px-2 py-1 rounded-lg">
                      Center object here
                    </span>
                  </div>
                </div>

                <button
                  onClick={captureAndTranslateObject}
                  disabled={scanningLens}
                  className="w-full py-3 bg-gradient-to-r from-emerald-500 to-purple-600 rounded-2xl text-xs font-extrabold text-white shadow-lg active:scale-95 transition"
                >
                  {scanningLens ? "Scanning object..." : "📸 Scan Object with Camera"}
                </button>
              </div>

              {/* Manual Word Input Form */}
              <form onSubmit={handleManualTranslateSubmit} className="bg-slate-900 border border-slate-800 rounded-3xl p-3.5 space-y-2">
                <label className="text-[10px] font-extrabold uppercase text-purple-300 block">
                  ✍️ Or Type an Item Name to Translate:
                </label>
                <div className="flex gap-2">
                  <input
                    value={manualInputWord}
                    onChange={(e) => setManualInputWord(e.target.value)}
                    placeholder="e.g. pot, coffee cup..."
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-3 py-2 text-xs text-white outline-none"
                  />
                  <button type="submit" className="bg-purple-600 px-3.5 py-2 rounded-2xl text-xs font-extrabold text-white">
                    Translate
                  </button>
                </div>
              </form>

              {scannedObject && (
                <div className="bg-slate-900 border border-emerald-500/50 rounded-3xl p-3.5 space-y-2 text-center shadow-xl">
                  <div className="text-2xl">{scannedObject.icon}</div>
                  <h3 className="text-lg font-extrabold text-white">{scannedObject.es}</h3>
                  <p className="text-xs text-blue-300">🇺🇸 {scannedObject.en}</p>
                  <p className="text-[11px] font-mono text-amber-300">
                    🗣️ [{generatePhoneticGuide(scannedObject.es, dialect)}]
                  </p>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button onClick={() => speakSpanish(scannedObject.es, dialect)} className="py-2 bg-slate-800 text-white rounded-xl text-xs font-extrabold">🔊 Hear</button>
                    <button onClick={() => addWordToFlashcards(scannedObject.es, scannedObject.en)} className="py-2 bg-emerald-600 text-white rounded-xl text-xs font-extrabold">+ Save SRS</button>
                  </div>
                </div>
              )}

              {manualResult && !scannedObject && (
                <div className="bg-slate-900 border border-purple-500/50 rounded-3xl p-3.5 space-y-2 text-center shadow-xl">
                  <div className="text-2xl">{manualResult.icon}</div>
                  <h3 className="text-lg font-extrabold text-white">{manualResult.es}</h3>
                  <p className="text-xs text-blue-300">🇺🇸 {manualResult.en}</p>
                  <p className="text-[11px] font-mono text-amber-300">
                    🗣️ [{generatePhoneticGuide(manualResult.es, dialect)}]
                  </p>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button onClick={() => speakSpanish(manualResult.es, dialect)} className="py-2 bg-slate-800 text-white rounded-xl text-xs font-extrabold">🔊 Hear</button>
                    <button onClick={() => addWordToFlashcards(manualResult.es, manualResult.en)} className="py-2 bg-emerald-600 text-white rounded-xl text-xs font-extrabold">+ Save SRS</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB: FREE AI LIVE CALL MODE */}
          {activeTab === "freeai" && (
            <div className="space-y-2.5">
              <div className="bg-gradient-to-b from-slate-900 via-[#0d1326] to-slate-950 border border-slate-800 rounded-3xl p-4 flex flex-col items-center justify-between min-h-[68vh] shadow-2xl">
                <div className="w-full bg-slate-900/90 border border-purple-500/30 rounded-2xl p-3 text-center space-y-1.5">
                  <span className="text-[10px] font-extrabold uppercase text-purple-300">
                    {DIALECTS[dialect].flag} {DIALECTS[dialect].tutor}
                  </span>
                  <p className="text-base font-extrabold text-white">{latestAiTurn.es}</p>
                  <p className="text-xs text-slate-400">{latestAiTurn.en}</p>
                </div>

                <div className="my-4 flex flex-col items-center justify-center space-y-3">
                  <button
                    onClick={() => listenVoiceRealtime((text, conf) => processFreeSpeechTurn(text, conf, false), dialect)}
                    className="w-32 h-32 rounded-full flex flex-col items-center justify-center bg-gradient-to-tr from-purple-600 via-indigo-600 to-emerald-500 border-4 border-slate-700 shadow-2xl"
                  >
                    <span className="text-3xl mb-1">{isRecording ? "🎙️" : "🗣️"}</span>
                    <span className="text-[11px] font-extrabold uppercase tracking-wider text-white">
                      {isRecording ? "Listening..." : "Speak Spanish"}
                    </span>
                  </button>

                  <button
                    onClick={() => listenVoiceRealtime((text, conf) => processFreeSpeechTurn(text, conf, true), "en-US")}
                    className="px-3.5 py-2 rounded-2xl text-xs font-extrabold border bg-blue-950/70 border-blue-500/60 text-blue-200"
                  >
                    🇺🇸 Ask in English ("How do I say...")
                  </button>
                </div>

                {latestUserTurn && (
                  <div className="w-full bg-slate-950/95 border border-emerald-500/40 rounded-2xl p-3 space-y-1">
                    <p className="text-xs font-extrabold text-emerald-300">{latestUserTurn.analysis.correctedEs}</p>
                    <p className="text-[11px] text-slate-400">🇺🇸 "{latestUserTurn.analysis.englishMeaning}"</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB: MEDIA IMMERSION */}
          {activeTab === "media" && (
            <div className="space-y-3">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-2">
                <span className="text-[10px] font-extrabold uppercase text-emerald-400">🎧 Immersion Hub</span>
                <h2 className="text-base font-extrabold text-white">Music & Rhythm Practice</h2>
                {IMMERSION_MEDIA.map(item => (
                  <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-3 space-y-2">
                    <h3 className="text-sm font-extrabold text-white">{item.title}</h3>
                    <p className="text-xs text-emerald-300 font-semibold">{item.lyricEs}</p>
                    <button onClick={() => speakSpanish(item.lyricEs)} className="px-3 py-1.5 bg-purple-600 text-white rounded-xl text-xs font-bold">
                      🔊 Hear Line
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB: SRS FLASHCARDS */}
          {activeTab === "cards" && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4">
              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6">
                <h2 className="text-2xl font-extrabold text-white">{cards[0]?.en}</h2>
                <p className="text-emerald-400 font-bold mt-2">{cards[0]?.es}</p>
              </div>
            </div>
          )}

          {/* TAB: DRILLS */}
          {activeTab === "drills" && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
              <p className="text-[11px] uppercase tracking-wider text-purple-400 font-bold">
                Speaking Drill • Variation {varIdx + 1} of {currentDrill.variations.length}
              </p>
              <h2 className="text-xl font-extrabold text-white">"{currentVar.en}"</h2>
              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 my-2">
                <p className="text-lg font-bold text-emerald-400">{currentVar.es}</p>
              </div>
              <div className="flex justify-center gap-2.5">
                <button onClick={() => speakSpanish(currentVar.es)} className="px-4 py-3 rounded-2xl bg-slate-800 text-xs font-extrabold">🔊 Hear Native</button>
              </div>
            </div>
          )}

          {/* 5-TAB BOTTOM NAVIGATION BAR */}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-2 py-2">
            <div className="max-w-md mx-auto grid grid-cols-5 items-center gap-1 text-[10px] font-extrabold">
              <button onClick={() => setActiveTab("lens")} className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "lens" ? "text-amber-400" : "text-slate-400"}`}>
                <span className="text-base">📸</span>
                <span>Lens</span>
              </button>
              <button onClick={() => setActiveTab("freeai")} className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "freeai" ? "text-emerald-400" : "text-slate-400"}`}>
                <span className="text-base">🎙️</span>
                <span>Free AI</span>
              </button>
              <button onClick={() => setActiveTab("media")} className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "media" ? "text-purple-400" : "text-slate-400"}`}>
                <span className="text-base">🎧</span>
                <span>Media</span>
              </button>
              <button onClick={() => setActiveTab("cards")} className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "cards" ? "text-purple-400" : "text-slate-400"}`}>
                <span className="text-base">🧠</span>
                <span>SRS</span>
              </button>
              <button onClick={() => setActiveTab("drills")} className={`flex flex-col items-center py-1 rounded-xl ${activeTab === "drills" ? "text-purple-400" : "text-slate-400"}`}>
                <span className="text-base">🎯</span>
                <span>Drills</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
