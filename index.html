    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim();
    }

    function generatePhoneticGuide(spanishText, dialectCode = "es-CU") {
      if (!spanishText) return "";
      const words = spanishText
        .replace(/[¿?¡!.,;:"]/g, "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      const convertWord = (rawW) => {
        let w = rawW.toLowerCase();
        if (dialectCode === "es-CU") {
          w = w.replace(/ado$/, "ao").replace(/ada$/, "á");
          w = w.replace(/s([tpckfbgd])/g, "h$1").replace(/s$/, "h");
        } else if (dialectCode === "es-AR") {
          w = w.replace(/ll/g, "sh").replace(/\by([aeiouáéíóú])/g, "sh$1");
        } else if (dialectCode === "es-ES") {
          w = w.replace(/z/g, "th").replace(/ce/g, "the").replace(/ci/g, "thi");
        }
        w = w
          .replace(/qué/g, "KEH")
          .replace(/que/g, "keh")
          .replace(/qu([eiéí])/g, "k$1")
          .replace(/gue/g, "geh")
          .replace(/gui/g, "gee")
          .replace(/ñ/g, "ny")
          .replace(/ll/g, "y")
          .replace(/j/g, "kh")
          .replace(/ge/g, "kheh")
          .replace(/gi/g, "khee")
          .replace(/ce/g, "seh")
          .replace(/ci/g, "see")
          .replace(/z/g, "s")
          .replace(/^h/g, "")
          .replace(/v/g, "b");
        return w;
      };

      return words.map(convertWord).join(" · ");
    }

    function wordSimilarity(a, b) {
      const s1 = normalizeText(a);
      const s2 = normalizeText(b);
      if (!s1 || !s2) return 0;
      if (s1 === s2) return 100;
      const phoneticNorm = (w) => w.replace(/v/g, "b").replace(/z/g, "s").replace(/ll/g, "y").replace(/s$/, "");
      if (phoneticNorm(s1) === phoneticNorm(s2)) return 82;

      const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
      for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
      for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;
      for (let j = 1; j <= s2.length; j += 1) {
        for (let i = 1; i <= s1.length; i += 1) {
          const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
          track[j][i] = Math.min(
            track[j][i - 1] + 1,
            track[j - 1][i] + 1,
            track[j - 1][i - 1] + indicator
          );
        }
      }
      const distance = track[s2.length][s1.length];
      const maxLen = Math.max(s1.length, s2.length);
      return Math.round(((maxLen - distance) / maxLen) * 100);
    }

    function scorePronunciation(expected, spoken) {
      const expWords = (expected || "").trim().split(/\s+/).filter(Boolean);
      const spkWords = (spoken || "").trim().split(/\s+/).filter(Boolean);
      if (!spkWords.length) {
        return {
          score: 0,
          breakdown: expWords.map(w => ({ word: w, status: "red", sim: 0, note: "Not heard" }))
        };
      }
      let totalSim = 0;
      const breakdown = expWords.map((expW, idx) => {
        let bestSim = 0;
        let matchedSpk = "";
        spkWords.forEach((spkW, sIdx) => {
          const sim = wordSimilarity(expW, spkW);
          const posPenalty = Math.abs(idx - sIdx) > 3 ? 10 : 0;
          const adjSim = Math.max(0, sim - posPenalty);
          if (adjSim > bestSim) {
            bestSim = adjSim;
            matchedSpk = spkW;
          }
        });
        totalSim += bestSim;
        let status = "red";
        let note = matchedSpk ? `Heard "${matchedSpk}"` : "Missed word";
        if (bestSim >= 85) {
          status = "green";
          note = "Perfect pronunciation!";
        } else if (bestSim >= 65) {
          status = "yellow";
          note = `Medium ("${matchedSpk}")`;
        }
        return { word: expW, status, sim: bestSim, note };
      });
      const score = Math.round(totalSim / expWords.length);
      return { score, breakdown };
    }

    // Restore Spanish Punctuation, Commas (so "mucho gusto, mi nombre es" translates properly!), Accents & Question Marks
    function restoreSpanishPunctuation(rawText) {
      let s = (rawText || "").trim();
      if (!s) return "";

      // Add comma after "mucho gusto" when followed by another clause so translator never merges "gusto mi nombre"
      s = s.replace(/\bmucho gusto\s+(?=[a-záéíóúñ])/gi, "mucho gusto, ");

      // Common accent & question restorations
      s = s
        .replace(/\bcomo estas\b/gi, "¿cómo estás?")
        .replace(/\bcomo se dice\b/gi, "¿cómo se dice")
        .replace(/\bque tal\b/gi, "¿qué tal?")
        .replace(/\bque bola\b/gi, "¿qué bolá?")
        .replace(/\by tu\b$/gi, "¿y tú?")
        .replace(/\btambien\b/gi, "también")
        .replace(/\bmas\b/gi, "más");

      // Capitalize first letter
      s = s.charAt(0).toUpperCase() + s.slice(1);

      // Add comma after greeting
      s = s.replace(/^(Hola|Buenas|Oye|Che|Quiubo)\s+(?=[a-záéíóúñ])/i, "$1, ");

      const isQuestion = /^(¿|Que|Qué|Como|Cómo|Donde|Dónde|Cuando|Cuándo|Por que|Por qué|Quien|Quién|Cual|Cuál)\b/i.test(s);
      if (isQuestion && !s.includes("?")) {
        if (!s.startsWith("¿")) {
          s = "¿" + s.charAt(0).toLowerCase() + s.slice(1) + "?";
          s = s.charAt(0) + s.charAt(1).toUpperCase() + s.slice(2);
        } else {
          s = s + "?";
        }
      } else if (!/[.?!]$/.test(s)) {
        s = s + ".";
      }
      return s;
    }

    // Detect if the user is asking "¿Cómo se dice [word]?" or "How do you say [word]?"
    function extractHowToSayQuery(text) {
      const cleaned = (text || "").replace(/[¿?¡!.,"]/g, "").trim();
      const patterns = [
        /(?:como se dice|cómo se dice|que significa|qué significa|como digo|cómo digo)\s+(.+)$/i,
        /(?:how do you say|how to say|what is the word for|how do i say)\s+(.+?)(?:\s+in spanish|\s+en espanol|\s+en español)?$/i
      ];
      for (const pat of patterns) {
        const m = cleaned.match(pat);
        if (m && m[1]) {
          return m[1].replace(/\b(en espanol|en español|in spanish|por favor|please)\b/gi, "").trim();
        }
      }
      return null;
    }

      },

    // Grade every word in Green (Perfect), Yellow (Medium), or Red (Bad)
    function gradeFreeSpeechWords(originalText, correctedText, rawConfidence, grammarMatches) {
      const origWords = (originalText || "").trim().split(/\s+/).filter(Boolean);
      const corrWords = (correctedText || "").replace(/[¿?¡!.,;:"]/g, "").trim().split(/\s+/).filter(Boolean);
      const baseConf = rawConfidence && rawConfidence > 0 ? rawConfidence : 0.88;

      const wrongWordSet = new Set();
      (grammarMatches || []).forEach(m => {
        (m.wrong || "").toLowerCase().split(/\s+/).forEach(w => wrongWordSet.add(normalizeText(w)));
      });

      const hardRedSet = new Set(["sabo", "poni", "poní", "teni", "tení", "haci", "hací", "gustario", "gustarío"]);

      return origWords.map((w, idx) => {
        const norm = normalizeText(w);
        const alignedCorr = corrWords[idx] || w;

        if (hardRedSet.has(norm)) {
          return {
            word: w,
            status: "red",
            label: "Bad / Grammar Error",
            score: 45,
            reason: `"${w}" is not a valid conjugation — check the Grammar Correction box below.`
          };
        }

        if (wrongWordSet.has(norm)) {
          return {
            word: w,
            status: "yellow",
            label: "Medium (Grammar/Word Missing)",
            score: 74,
            reason: `Good effort on "${w}", but a connector word (like 'es') or agreement fix was needed here.`
          };
        }

        const cleanOrig = w.replace(/[¿?¡!.,;:"]/g, "").toLowerCase();
        const cleanCorr = alignedCorr.toLowerCase();
        if (cleanOrig !== cleanCorr && normalizeText(cleanOrig) === normalizeText(cleanCorr)) {
          return {
            word: w,
            status: "yellow",
            label: "Medium (Accent)",
            score: 82,
            reason: `Good sound! Written with an accent mark: "${alignedCorr}".`
          };
        }

        if (baseConf >= 0.80) {
          return {
            word: w,
            status: "green",
            label: "Perfect",
            score: Math.min(99, Math.round(baseConf * 100) + 4),
            reason: "Perfect pronunciation & grammar!"
          };
        }

        if (baseConf >= 0.65) {
          return {
            word: w,
            status: "yellow",
            label: "Medium",
            score: Math.round(baseConf * 100),
            reason: "Medium pronunciation — slight slur or hesitation."
          };
        }

        return {
          word: w,
          status: "red",
          label: "Needs Work",
          score: Math.round(baseConf * 100),
          reason: "Unclear pronunciation — tap to hear native speaker."
        };
      });
    }

    // Complete Live Analyzer: Pronunciation (Green/Yellow/Red) + Grammar + Punctuation + Conversational AI Reply
    async function analyzeFreeSpeechAndCorrect(spokenEs, confidence, dialectCode, turnCount = 0) {
      const cleanSpoken = (spokenEs || "").trim();
      let workingCorrected = cleanSpoken;
      const explanations = [];

      // 1. Local Instant Grammar Rules (Fixes "mi nombre Armando" -> "mi nombre es Armando", "gustarío" -> "gustaría", etc.)
      GRAMMAR_RULES.forEach(rule => {
        const match = workingCorrected.match(rule.regex);
        if (match) {
          const wrongText = match[0];
          const replacedText = workingCorrected.replace(rule.regex, rule.replacement);
          workingCorrected = replacedText;
          explanations.push({
            wrong: wrongText,
            right: wrongText.replace(rule.regex, rule.replacement),
            reason: rule.reason
          });
        }
      });

      // 2. Restore Spanish Punctuation & Commas (e.g., "Hola, mucho gusto, mi nombre es Armando.")
      const punctuatedCorrected = restoreSpanishPunctuation(workingCorrected);

      // 3. Accurate English Meaning of the Corrected Sentence
      let englishMeaning = "";
      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=${encodeURIComponent(punctuatedCorrected)}`;
        const gtxRes = await fetch(gtxUrl);
        const gtxData = await gtxRes.json();
        if (gtxData && gtxData[0]) {
          englishMeaning = gtxData[0].map(seg => seg[0]).join("");
        }
      } catch (e) {
        englishMeaning = "Spoken Spanish phrase";
      }

      const wordBreakdown = gradeFreeSpeechWords(cleanSpoken, punctuatedCorrected, confidence, explanations);
      const avgPronunciationScore = wordBreakdown.length
        ? Math.round(wordBreakdown.reduce((acc, w) => acc + w.score, 0) / wordBreakdown.length)
        : 0;

      const aiReply = await generateContextualTutorReply(punctuatedCorrected, englishMeaning, dialectCode, turnCount);

      return {
        originalEs: cleanSpoken,
        correctedEs: punctuatedCorrected,
        isGrammarPerfect: explanations.length === 0,
        explanations,
        englishMeaning,
        wordBreakdown,
        avgPronunciationScore,
        aiReply
      };
    }

    function looksLikeSpanish(text) {
      const raw = (text || "").trim().toLowerCase();
      if (/[áéíóúñü¿¡]/.test(raw)) return true;
      const tokens = raw.split(/\s+/);
      const spanishMarkers = new Set([
        "el", "la", "los", "las", "un", "una", "yo", "tu", "usted", "que", "como", "donde",
        "cuando", "porque", "para", "por", "con", "sin", "hola", "gracias", "perro", "gato",
        "agua", "casa", "carro", "trabajo", "amigo", "dinero", "comida", "mierda", "puta",
        "carajo", "coño", "pinga", "singar", "comemierda", "chingar", "verga", "pendejo"
      ]);
      return tokens.some(t => spanishMarkers.has(normalizeText(t)));
    }

    function buildDynamicDialectBreakdown(esText, enText) {
      const cleanEs = esText.split("/")[0].trim();
      const cleanEn = enText.split("/")[0].trim();
      return {
        "es-CU": { term: `${cleanEs} (a lo cubano)`, exEs: `Oye asere, "${cleanEs}" está en talla.`, exEn: `Hey bro, "${cleanEn}" is all good.` },
        "es-MX": { term: `${cleanEs} (en México)`, exEs: `No mames carnal, "${cleanEs}" está bien chingón.`, exEn: `No way bro, "${cleanEn}" is super badass.` },
        "es-CO": { term: `${cleanEs} (en Colombia)`, exEs: `Quiubo parcero, "${cleanEs}" es una chimba.`, exEn: `What's up bro, "${cleanEn}" is awesome.` },
        "es-ES": { term: `${cleanEs} (en España)`, exEs: `Joder tío, "${cleanEs}" está de puta madre.`, exEn: `Damn man, "${cleanEs}" is awesome.` },
        "es-AR": { term: `${cleanEs} (en Argentina)`, exEs: `Che boludo, "${cleanEs}" está re copado.`, exEn: `Hey dude, "${cleanEn}" is super cool.` }
      };
    }

    async function autoTranslateWordOrPhrase(rawInput, forcedSourceLang = null) {
      const cleanInput = rawInput.trim();
      const normInput = normalizeText(cleanInput);

      if (!forcedSourceLang) {
        for (const item of MULTI_DIALECT_LEXICON) {
          if (item.keysEn.map(normalizeText).includes(normInput)) {
            return { sourceLang: "en", targetLang: "es", isCurse: item.isCurse, es: item.es, en: item.en, exEs: item.exEs, exEn: item.exEn, byDialect: item.byDialect };
          }
          if (item.keysEs.map(normalizeText).includes(normInput)) {
            return { sourceLang: "es", targetLang: "en", isCurse: item.isCurse, es: item.es, en: item.en, exEs: item.exEs, exEn: item.exEn, byDialect: item.byDialect };
          }
        }
      }

      try {
        let sourceLang = forcedSourceLang || (looksLikeSpanish(cleanInput) ? "es" : "en");
        const targetLang = sourceLang === "es" ? "en" : "es";
        const transUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(cleanInput)}`;
        const transRes = await fetch(transUrl);
        const transData = await transRes.json();
        const translatedText = (transData && transData[0]) ? transData[0].map(seg => seg[0]).join("") : cleanInput;

        const finalEs = sourceLang === "es" ? cleanInput : translatedText;
        const finalEn = sourceLang === "en" ? cleanInput : translatedText;

        return {
          sourceLang,
          targetLang,
          isCurse: false,
          es: finalEs,
          en: finalEn,
          byDialect: buildDynamicDialectBreakdown(finalEs, finalEn)
        };
      } catch (err) {
        return {
          sourceLang: "es",
          targetLang: "en",
          isCurse: false,
          es: cleanInput,
          en: cleanInput,
          byDialect: buildDynamicDialectBreakdown(cleanInput, cleanInput)
        };
      }
    }

            <div className="flex flex-wrap gap-x-1.5 gap-y-1 justify-center">
              {tokens.map((tok, i) => (
                <span
                  key={i}
                  onClick={(e) => {
                    e.stopPropagation();
                    inspectWordXray(tok);
                  }}
                  className={`${textClass} underline decoration-dotted decoration-purple-400/60 underline-offset-4 cursor-pointer hover:text-purple-300`}
                >
                  {tok}
                </span>
              ))}
            </div>
            {showPhonetics && (
              <p className="text-[11px] font-mono text-amber-300/90">
                🗣️ [{generatePhoneticGuide(sentence, dialect)}]
              </p>
            )}
          </div>
        );
      };

      const listenVoiceRealtime = (onFinalTranscript) => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert("Speech recognition requires Chrome, Samsung Internet, Edge, or Safari.");
          return;
        }

        // If AI is currently speaking and user taps Orb, interrupt AI and listen right away!
        if (isAiSpeaking) {
          try {
            window.speechSynthesis.cancel();
          } catch (e) {}
          setIsAiSpeaking(false);
        }

        if (isRecording && activeRecognitionRef.current) {
          try {
            activeRecognitionRef.current.stop();
          } catch (e) {}
          return;
        }

        try {
          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();
          }
        } catch (e) {}

        const rec = new SpeechRec();
        activeRecognitionRef.current = rec;
        rec.lang = dialect;
        rec.interimResults = true;
        rec.continuous = false;
        rec.maxAlternatives = 1;

        setIsRecording(true);
        setLiveInterimText("");

        let capturedFinal = "";
        let capturedInterim = "";
        let bestConfidence = 0.88;
        let hasSubmitted = false;

        rec.onresult = (e) => {
          let currentInterim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const seg = e.results[i][0].transcript;
            if (e.results[i].isFinal) {
              capturedFinal += seg + " ";
              if (e.results[i][0].confidence) {
                bestConfidence = e.results[i][0].confidence;
              }
            } else {
              currentInterim += seg;
            }
          }
          capturedInterim = currentInterim;
          const combined = (capturedFinal + currentInterim).trim();
          setLiveInterimText(combined);
        };

        rec.onerror = () => {
          setIsRecording(false);
          const fallbackText = (capturedFinal + " " + capturedInterim).trim();
          if (fallbackText && !hasSubmitted) {
            hasSubmitted = true;
            setLiveInterimText("");
            onFinalTranscript(fallbackText, bestConfidence);
          }
        };

        rec.onend = () => {
          setIsRecording(false);
          activeRecognitionRef.current = null;
          const completedText = (capturedFinal + " " + capturedInterim).trim();
          setLiveInterimText("");
          if (completedText && !hasSubmitted) {
            hasSubmitted = true;
            onFinalTranscript(completedText, bestConfidence);
          }
        };

        try {
          rec.start();
        } catch (err) {
          setIsRecording(false);
        }
      };

      const currentDrill = drills[activeDrillIdx] || drills[0];
      const currentVar = currentDrill.variations[varIdx] || currentDrill.variations[0];

      const advanceDrill = (fromAutoLoop = false) => {
        setEvalResult(null);
        setSpokenText("");
        let nextVarIdx = varIdx;

        if (stage < 3) {
          setStage(stage + 1);
        } else {
          setStage(1);
          if (varIdx + 1 < currentDrill.variations.length) {
            nextVarIdx = varIdx + 1;
            setVarIdx(nextVarIdx);
          } else {
            nextVarIdx = 0;
            setVarIdx(0);
            awardXp(50, "Unit Mastered Bonus!");
          }
        }

        if (fromAutoLoop || autoCoachLoop) {
          const nextVariation = currentDrill.variations[nextVarIdx] || currentDrill.variations[0];
          setTimeout(() => {
            speakSpanish(nextVariation.es, dialect, () => {
              setTimeout(() => handleDrillMic(nextVariation.es), 400);
            });
          }, 500);
        }
      };

      const handleDrillMic = (overrideExpectedEs = null) => {
        const targetEs = overrideExpectedEs || currentVar.es;
        listenVoiceRealtime((transcript) => {
          setSpokenText(transcript);
          const res = scorePronunciation(targetEs, transcript);
          setEvalResult(res);
          if (res.score >= 85) {
            awardXp(25, "Passed Pronunciation Gate!");
            if (autoCoachLoop) {
              speakSpanish("¡Excelente! Seguimos.", dialect, () => advanceDrill(true));
            } else {
              speakSpanish("¡Excelente!");
            }
          }
        });
      };

      const currentMission = SCENARIO_MISSIONS.find(m => m.id === activeMissionId) || SCENARIO_MISSIONS[0];

      const selectMission = (mission) => {
        setActiveMissionId(mission.id);
        setFreeSessionTurns([
          {
            id: "m_" + Date.now(),
            role: "ai",
            es: mission.starterEs,
            en: mission.starterEn
          }
        ]);
        speakSpanish(mission.starterEs, dialect);
      };

      // Process Free Speaking Turn -> Grade Words + Fix Grammar + Speak Reply + Auto-Reopen Mic Like Gemini Live!
      const processFreeSpeechTurn = async (rawSpokenText, confidenceScore = 0.9) => {
        const text = (rawSpokenText || "").trim();
        if (!text) return;
        setFreeAiAnalyzing(true);
        setSelectedFreeWord(null);

        const newlyChecked = { ...completedGoals };
        let goalJustHit = false;
        currentMission.goals.forEach(g => {
          const key = `${currentMission.id}_${g.id}`;
          if (!newlyChecked[key] && g.check(text)) {
            newlyChecked[key] = true;
            goalJustHit = true;
          }
        });
        if (goalJustHit) setCompletedGoals(newlyChecked);

        const analysis = await analyzeFreeSpeechAndCorrect(
          text,
          confidenceScore,
          dialect,
          freeSessionTurns.length
        );

        const userTurn = { id: "u_" + Date.now(), role: "user", analysis };
        const aiTurn = {
          id: "ai_" + (Date.now() + 1),
          role: "ai",
          es: analysis.aiReply.es,
          en: analysis.aiReply.en
        };

        setFreeSessionTurns(prev => [...prev, userTurn, aiTurn]);
        setFreeAiInput("");
        setFreeAiAnalyzing(false);

        awardXp(goalJustHit ? 35 : 20, goalJustHit ? "Mission Goal Completed! 🎯" : "Graded & Replied!");

        // Speak AI Tutor's reply out loud, then automatically listen again if Hands-Free Call Mode is on!
        speakSpanish(analysis.aiReply.es, dialect, () => {
          if (handsFreeRef.current && activeTab === "freeai") {
            setTimeout(() => {
              listenVoiceRealtime((nextText, nextConf) => processFreeSpeechTurn(nextText, nextConf));
            }, 450);
          }
        });
      };

      const now = Date.now();
      const dueCards = cards.filter(c => (c.nextReview || 0) <= now);
      const currentCard = cards[cardIdx % cards.length] || cards[0];

      const rateCardSRS = (cardId, difficulty) => {
        setCards(prev =>
          prev.map(c => {
            if (c.id !== cardId) return c;
            let newBox = c.box || 1;
            if (difficulty === "hard") newBox = 1;
            else if (difficulty === "good") newBox = Math.min(5, newBox + 1);
            else if (difficulty === "easy") newBox = Math.min(5, newBox + 2);
            const interval = SRS_INTERVALS[newBox] || 0;
            return { ...c, box: newBox, nextReview: Date.now() + interval, reps: (c.reps || 0) + 1 };
          })
        );
        awardXp(difficulty === "easy" ? 20 : 15, "SRS Box Updated!");
        setFlipped(false);
        setCardIdx((prev) => (prev + 1) % Math.max(1, cards.length));
      };

      const runTranslation = async (rawQuery, forcedSourceLang = null) => {
        const cleanQ = rawQuery.trim();
        if (!cleanQ) return;
        setIsTranslating(true);
        const translated = await autoTranslateWordOrPhrase(cleanQ, forcedSourceLang);
        const resultObj = {
          query: cleanQ,
          sourceLang: translated.sourceLang,
          targetLang: translated.targetLang,
          isCurse: translated.isCurse,
          es: translated.es,
          en: translated.en,
          byDialect: translated.byDialect || buildDynamicDialectBreakdown(translated.es, translated.en)
        };
        setDictResult(resultObj);
        setIsTranslating(false);
        speakSpanish(resultObj.es, dialect);
        awardXp(10, "Translated & Spoken!");
      };

      const handleSearch = (e) => {
        e.preventDefault();
        runTranslation(searchQuery, null);
      };

      const addWordToFlashcards = (esText, enText, exEs, exEn, tag = "📖 Coach") => {
        const newCard = {
          id: "c_" + Date.now(),
          es: esText,
          en: enText,
          exEs: exEs || `Ejemplo con ${esText}.`,
          exEn: exEn || `Example with ${enText}.`,
          tag,
          box: 1,
          nextReview: 0,
          reps: 0
        };
        setCards([newCard, ...cards]);
        awardXp(15, "Saved to SRS Flashcards!");
      };

      const addWordToDrills = (esText, enText, exEs, exEn) => {
        const cleanPhrase = esText.split("/")[0].replace(/\(.*?\)/g, "").trim();
        const targetSentence = exEs || cleanPhrase;
        const words = targetSentence.split(" ");
        const clozeSentence = words.map((w, i) => (i % 2 === 1 ? "___" : w)).join(" ");
        const newDrill = {
          id: "d_" + Date.now(),
          title: `Drill: ${cleanPhrase.slice(0, 22)}`,
          pattern: cleanPhrase,
          variations: [
            { en: enText || "Say this in Spanish", es: cleanPhrase, cloze: "___" },
            { en: exEn || `Practice: ${enText}`, es: targetSentence, cloze: clozeSentence }
          ]
        };
        setDrills([newDrill, ...drills]);
        setActiveDrillIdx(0);
        setVarIdx(0);
        setStage(1);
        awardXp(15, "Added to Speaking Drills!");
      };

      const triggerGlobalQuickMic = () => {

            runTranslation(t, null);
          });

      const levelInfo = getLevelTitle(stats.xp);
      const dailyProgressPct = Math.min(100, Math.round((stats.dailyXp / 100) * 100));

      const getPillColorClasses = (status) => {

              >
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase text-purple-400">
                      🔍 Instant Word X-Ray ({DIALECTS[dialect].flag} {DIALECTS[dialect].short})

                    <h3 className="text-2xl font-extrabold text-white">{xrayWord.word}</h3>

                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => speakSpanish(xrayWord.word, dialect)}
                      className="px-3 py-2 bg-purple-600 text-white rounded-xl text-xs font-extrabold"
                    >
                      🔊 Hear
                    </button>
                    <button
                      onClick={() => setXrayWord(null)}
                      className="px-2.5 py-2 bg-slate-800 text-slate-400 rounded-xl text-xs font-bold"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                <div className="bg-slate-950 rounded-2xl p-3 border border-slate-800 space-y-1">
                  <span className="text-[10px] uppercase font-bold text-blue-400">🇺🇸 Meaning</span>
                  <p className="text-base font-bold text-white">
                    {xrayLoading ? "Translating..." : xrayWord.en}
                  </p>
                  {xrayWord.exEs && (
                    <div className="pt-1.5 border-t border-slate-800/80 text-xs">
                      <p className="text-emerald-300 font-semibold">"{xrayWord.exEs}"</p>
                      <p className="text-slate-400">"{xrayWord.exEn}"</p>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => {
                      addWordToDrills(xrayWord.word, xrayWord.en, xrayWord.exEs, xrayWord.exEn);
                      setXrayWord(null);
                    }}
                    className="py-2.5 bg-purple-600/25 border border-purple-500 text-purple-200 rounded-xl text-xs font-extrabold"
                  >
                    + Add to Drills
                  </button>
                  <button
                    onClick={() => {
                      addWordToFlashcards(xrayWord.word, xrayWord.en, xrayWord.exEs, xrayWord.exEn, "🔍 X-Ray");
                      setXrayWord(null);
                    }}
                    className="py-2.5 bg-blue-600/25 border border-blue-500 text-blue-200 rounded-xl text-xs font-extrabold"
                  >
                    + Save to SRS Cards
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Compact Header */}
          <div className="bg-slate-900/95 border border-slate-800 rounded-2xl p-2.5 mb-2.5 flex items-center justify-between shadow-lg">
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center text-lg shadow-md">
                🎙️
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <span className="font-extrabold text-sm">Vozzy Live</span>
                  <span className="text-[10px] font-extrabold px-1.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300">
                    🔥 {stats.streak}d
                  </span>
                  <span className="text-[10px] font-extrabold px-1.5 py-0.5 rounded-full bg-purple-950 text-purple-300">
                    Lvl {levelInfo.lvl}
                  </span>
                </div>
                <p className="text-[10px] text-slate-400">
                  🟢 Perfect • 🟡 Medium • 🔴 Bad
                </p>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <select
                value={dialect}
                onChange={(e) => setDialect(e.target.value)}
                className="bg-slate-800 text-[11px] font-bold rounded-xl px-2 py-1.5 border border-slate-700 text-slate-200 outline-none"
              >
                {Object.entries(DIALECTS).map(([code, d]) => (
                  <option key={code} value={code}>
                    {d.flag} {d.short} ({d.tutor})
                  </option>
                ))}
              </select>

              <button
                onClick={cycleSpeedLadder}
                className="text-[10px] font-bold px-2 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-200"
              >
                {speechRate === 0.75 ? "🐢 0.75x" : speechRate === 1.25 ? "🔥 1.25x" : "⚡ 1.0x"}
              </button>
            </div>
          </div>

          {/* TAB 2: GEMINI-LIVE STYLE VOICE CALL & CONVERSATION MODE */}
          {activeTab === "freeai" && (
            <div className="space-y-2.5">
              {/* Mode Switcher Bar: Live Voice Call Orb vs Chat History */}
              <div className="flex items-center justify-between gap-2 bg-slate-900 border border-slate-800 rounded-2xl p-1.5">
                <div className="grid grid-cols-2 gap-1 flex-1">
                  <button
                    onClick={() => setFreeAiViewMode("call")}
                    className={`py-1.5 rounded-xl text-xs font-extrabold transition ${
                      freeAiViewMode === "call"
                        ? "bg-gradient-to-r from-purple-600 to-emerald-600 text-white shadow"

                    }`}
                  >
                    🎙️ Live Call Mode
                  </button>
                  <button
                    onClick={() => setFreeAiViewMode("chat")}
                    className={`py-1.5 rounded-xl text-xs font-extrabold transition ${
                      freeAiViewMode === "chat"
                        ? "bg-purple-600 text-white shadow"
                        : "text-slate-400"
                    }`}
                  >
                    💬 Chat Log ({freeSessionTurns.length})
                  </button>
                </div>

                <button
                  onClick={() => {
                    const next = !handsFreeCallMode;

                    showToast(next ? "📞 Hands-Free Loop ON" : "📞 Manual Mic Mode");
                  }}
                  className={`px-2.5 py-1.5 rounded-xl text-[10px] font-extrabold border ${
                    handsFreeCallMode

                  }`}
                >
                  {handsFreeCallMode ? "🔄 Auto-Loop ON" : "🔄 Auto-Loop OFF"}
                </button>
              </div>

              {/* VIEW 1: GEMINI-LIVE STYLE VOICE ORB SCREEN */}
              {freeAiViewMode === "call" ? (
                <div className="bg-gradient-to-b from-slate-900 via-[#0d1326] to-slate-950 border border-slate-800 rounded-3xl p-4 flex flex-col items-center justify-between min-h-[70vh] shadow-2xl relative overflow-hidden">
                  {/* Top Current Tutor Response Card */}
                  <div className="w-full bg-slate-900/90 border border-purple-500/30 rounded-2xl p-3 text-center space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-extrabold uppercase text-purple-300">
                        {DIALECTS[dialect].flag} {DIALECTS[dialect].tutor} • {isAiSpeaking ? "🔊 Speaking..." : "Listening Partner"}
                      </span>
                      <button
                        onClick={() => speakSpanish(latestAiTurn.es, dialect)}

                      >

                  <div className="my-4 flex flex-col items-center justify-center">
                    <button

                      className={`w-36 h-36 rounded-full flex flex-col items-center justify-center transition-all duration-300 border-4 ${
                        isRecording

                    >
                      <span className="text-4xl mb-1">
                        {isRecording ? "🎙️" : isAiSpeaking ? "🔊" : freeAiAnalyzing ? "⚡" : "🗣️"}
                      </span>

                    {/* Live Status & Stop Call Button */}
                    <div className="mt-3 flex items-center gap-2">
                      <span className="text-xs font-bold text-slate-300">

                    {/* Live Streaming Words While Speaking */}

                  {/* LIVE REPORT CARD: YOUR LAST SENTENCE GRADED IN GREEN / YELLOW / RED + GRAMMAR & PUNCTUATION */}
                  {latestUserTurn ? (

                      {selectedFreeWord && (

                      }`}>
                        <div className="flex items-center justify-between">
                          <span className="font-extrabold text-[10px] uppercase text-emerald-300">
                            {latestUserTurn.analysis.isGrammarPerfect
                              ? "✅ Grammar & Punctuation:"
                              : "🛠️ Corrected Grammar & Punctuation:"}
                          </span>
                          <button
                            onClick={() => speakSpanish(latestUserTurn.analysis.correctedEs, dialect)}
                            className="text-[10px] font-extrabold text-emerald-300 bg-slate-900 px-2 py-0.5 rounded-lg"
                          >
                            🔊 Hear Correct
                          </button>
                        </div>
                        <p className="text-sm font-extrabold text-white">
                          "{latestUserTurn.analysis.correctedEs}"
                        </p>
                        <p className="text-[11px] text-slate-400">
                          🇺🇸 <i>"{latestUserTurn.analysis.englishMeaning}"</i>
                        </p>
                        {latestUserTurn.analysis.explanations.map((exp, i) => (
                          <div key={i} className="text-[11px] text-amber-200">
                            • <span className="line-through text-rose-400">{exp.wrong}</span> → <b className="text-emerald-300">{exp.right}</b> ({exp.reason})
                          </div>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div className="w-full bg-slate-950/70 border border-slate-800 rounded-2xl p-3 text-center space-y-1.5">
                      <p className="text-xs text-slate-400 font-semibold">
                        💡 Try saying out loud or tap a quick test phrase:
                      </p>
                      <div className="flex flex-wrap justify-center gap-1.5">
                        {[
                          "Hola mucho gusto mi nombre Armando",
                          "¿Cómo se dice if?",
                          "Me gustarío comer comida cubana"
                        ].map((sample, i) => (
                          <button
                            key={i}
                            onClick={() => processFreeSpeechTurn(sample, 0.92)}
                            className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-900 hover:bg-purple-950 text-purple-200 border border-purple-500/40"
                          >
                            "{sample}"
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                /* VIEW 2: FULL SCROLLABLE CHAT LOG */
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-3.5 flex flex-col h-[66vh]">
                  <div className="flex-1 overflow-y-auto space-y-3.5 pr-1">
                    {freeSessionTurns.map((turn) => {
                      if (turn.role === "ai") {
                        return (
                          <div key={turn.id} className="flex justify-start">
                            <div className="max-w-[92%] bg-slate-800/95 border border-purple-500/40 rounded-2xl p-3.5 space-y-1.5">
                              <div className="flex items-center justify-between">
                                <span className="text-[10px] font-extrabold text-purple-300 uppercase">
                                  {DIALECTS[dialect].flag} {DIALECTS[dialect].tutor}
                                </span>
                                <button
                                  onClick={() => speakSpanish(turn.es, dialect)}
                                  className="text-[11px] font-extrabold px-2.5 py-1 bg-purple-600 text-white rounded-lg"
                                >
                                  🔊 Speak
                                </button>
                              </div>
                              {renderClickableSpanish(turn.es, "text-sm font-bold text-white")}
                              {turn.en && <p className="text-xs text-slate-400">{turn.en}</p>}
                            </div>
                          </div>
                        );
                      }

                      const a = turn.analysis;
                      return (
                        <div key={turn.id} className="bg-slate-950 border border-emerald-500/40 rounded-2xl p-3.5 space-y-2">
                          <div className="flex flex-wrap gap-1.5">
                            {a.wordBreakdown.map((wObj, idx) => (
                              <span
                                key={idx}
                                className={`px-2.5 py-1 rounded-xl text-xs font-extrabold border ${getPillColorClasses(wObj.status)}`}
                              >
                                {wObj.status === "green" ? "🟢" : wObj.status === "yellow" ? "🟡" : "🔴"} {wObj.word}
                              </span>
                            ))}
                          </div>
                          <p className="text-sm font-extrabold text-white">"{a.correctedEs}"</p>
                          <p className="text-xs text-slate-400">🇺🇸 "{a.englishMeaning}"</p>
                        </div>
                      );
                    })}
                    <div ref={chatBottomRef} />
                  </div>

                  <div className="pt-2.5 mt-2 border-t border-slate-800 flex gap-2">
                    <input
                      value={freeAiInput}
                      onChange={(e) => setFreeAiInput(e.target.value)}
                      placeholder="Type Spanish or '¿Cómo se dice...?'..."
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-3 py-2.5 text-xs outline-none text-white"
                    />
                    <button
                      onClick={() => processFreeSpeechTurn(freeAiInput, 0.92)}
                      className="px-4 py-2.5 bg-emerald-600 rounded-2xl font-extrabold text-xs"
                    >
                      Send
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 1: SPEAKING DRILLS */}
          {activeTab === "drills" && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
              <p className="text-[11px] uppercase tracking-wider text-purple-400 font-bold">
                Speaking Drill • Variation {varIdx + 1} of {currentDrill.variations.length}
              </p>
              <h2 className="text-xl font-extrabold text-white">"{currentVar.en}"</h2>
              <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-4 my-2">
                {renderClickableSpanish(currentVar.es)}
              </div>
              <div className="flex justify-center gap-2.5">
                <button
                  onClick={() => speakSpanish(currentVar.es)}
                  className="px-4 py-3 rounded-2xl bg-slate-800 text-xs font-extrabold"
                >
                  🔊 Hear Native
                </button>
                <button
                  onClick={() => handleDrillMic()}
                  className="px-5 py-3 rounded-2xl bg-purple-600 text-white text-xs font-extrabold"
                >
                  {isRecording ? "✅ Done" : "🎤 Tap & Speak"}
                </button>
              </div>
            </div>
          )}

          {/* TAB 3: SRS FLASHCARDS */}
          {activeTab === "cards" && currentCard && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
              <div
                onClick={() => setFlipped(!flipped)}
                className="min-h-[180px] flex flex-col items-center justify-center bg-slate-950 border border-slate-800 rounded-2xl p-5 cursor-pointer"
              >
                {!flipped ? (
                  <>
                    <p className="text-xs uppercase text-slate-400 mb-2">Tap Card to Flip</p>
                    <h2 className="text-2xl font-extrabold text-white">{currentCard.en}</h2>
                  </>
                ) : (
                  <div className="space-y-2">
                    {renderClickableSpanish(currentCard.es, "text-2xl font-extrabold text-emerald-400")}
                    <p className="text-sm text-slate-200 pt-2 font-semibold">"{currentCard.exEs}"</p>
                    <p className="text-xs text-slate-400">"{currentCard.exEn}"</p>
                  </div>
                )}
              </div>
              <div className="grid grid-cols-3 gap-2 text-xs font-extrabold">
                <button onClick={() => rateCardSRS(currentCard.id, "hard")} className="py-2.5 rounded-xl bg-rose-950 border border-rose-700 text-rose-300">
                  🔴 Hard
                </button>
                <button onClick={() => rateCardSRS(currentCard.id, "good")} className="py-2.5 rounded-xl bg-amber-950 border border-amber-700 text-amber-300">
                  🟡 Good
                </button>
                <button onClick={() => rateCardSRS(currentCard.id, "easy")} className="py-2.5 rounded-xl bg-emerald-950 border border-emerald-700 text-emerald-300">
                  🟢 Easy
                </button>
              </div>
            </div>
          )}

          {/* TAB 4: TRANSLATOR */}
          {activeTab === "dict" && (
            <div className="space-y-4">
              <form onSubmit={handleSearch} className="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3">
                <label className="text-xs font-bold text-purple-300 uppercase block">
                  🌍 All-Dialects Translator (Speaks Back 🔊)
                </label>
                <div className="flex gap-2">
                  <input
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Type or speak ANY word..."
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm outline-none text-white"
                  />
                  <button type="submit" className="bg-purple-600 px-4 py-2.5 rounded-2xl font-extrabold text-sm">
                    Translate
                  </button>
                </div>
              </form>
              {dictResult && (
                <div className="bg-slate-900 border border-purple-500/40 rounded-3xl p-4 flex justify-between items-center">
                  <div>
                    <h3 className="text-xl font-extrabold text-white">{dictResult.es}</h3>
                    <p className="text-xs text-blue-300 mt-1">🇺🇸 {dictResult.en}</p>
                  </div>
                  <button
                    onClick={() => speakSpanish(dictResult.es)}
                    className="px-3.5 py-2 bg-emerald-600/20 border border-emerald-500/50 text-emerald-300 rounded-xl text-xs font-extrabold"
                  >
                    🔊 Hear
                  </button>
                </div>
              )}
            </div>
          )}

          {/* THUMB-ZONE FIXED BOTTOM NAVIGATION DOCK */}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-3 py-2">
            <div className="max-w-md mx-auto grid grid-cols-5 items-center gap-1 text-[11px] font-extrabold">
              <button
                onClick={() => setActiveTab("drills")}
                className={`flex flex-col items-center py-1.5 rounded-xl ${activeTab === "drills" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">🎯</span>
                <span>Drills</span>
              </button>

              <button
                onClick={() => {
                  setActiveTab("freeai");
                  setFreeAiViewMode("call");
                }}
                className={`flex flex-col items-center py-1.5 rounded-xl ${activeTab === "freeai" ? "text-emerald-400" : "text-slate-400"}`}
              >
                <span className="text-base">🎙️</span>
                <span>Free AI</span>
              </button>

              <div className="flex justify-center -mt-6">
                <button
                  onClick={triggerGlobalQuickMic}
                  className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-xl border-4 border-[#090d16] transition active:scale-95 ${
                    isRecording
                      ? "bg-emerald-600 text-white shadow-emerald-600/50"
                      : "bg-gradient-to-tr from-purple-600 to-emerald-500 text-white shadow-purple-600/40"
                  }`}
                >
                  {isRecording ? "✅" : "🎤"}
                </button>
              </div>

              <button
                onClick={() => setActiveTab("cards")}
                className={`flex flex-col items-center py-1.5 rounded-xl ${activeTab === "cards" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">🧠</span>
                <span>SRS ({dueCards.length})</span>
              </button>

              <button
                onClick={() => setActiveTab("dict")}
                className={`flex flex-col items-center py-1.5 rounded-xl ${activeTab === "dict" ? "text-purple-400" : "text-slate-400"}`}
              >
                <span className="text-base">🌍</span>
                <span>Translator</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
